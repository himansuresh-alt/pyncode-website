<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Banner Manager - Visiting Card</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}


html,
body{
    min-height:100%;
}


body{
    font-family:Arial,sans-serif;

    background:#f5f6f8;

    color:#111;

    min-height:100vh;

    display:flex;

    flex-direction:column;
}


/* =========================
   HEADER
========================= */

.header{
    background:#fff;

    padding:20px;

    display:flex;

    justify-content:space-between;

    align-items:center;

    border-bottom:1px solid #ddd;

    flex-shrink:0;
}


.logo{
    font-size:20px;

    font-weight:800;
}


.header-buttons{
    display:flex;

    gap:9px;

    align-items:center;
}


.dashboard-btn,
.logout-btn{

    border:0;

    padding:11px 17px;

    border-radius:10px;

    font-size:13px;

    font-weight:700;

    cursor:pointer;

}


.dashboard-btn{
    background:#eee;

    color:#111;
}


.logout-btn{
    background:#111;

    color:#fff;
}


.dashboard-btn:hover{
    background:#ddd;
}


.logout-btn:hover{
    background:#222;
}


/* =========================
   MAIN
========================= */

.main{
    width:100%;

    max-width:900px;

    margin:auto;

    padding:35px 18px 55px;

    flex:1;
}


h1{
    font-size:32px;

    margin-bottom:8px;
}


.subtitle{
    color:#777;

    margin-bottom:25px;
}


/* =========================
   CARD
========================= */

.card{
    background:#fff;

    padding:22px;

    border-radius:18px;

    border:1px solid #ddd;
}


/* =========================
   GRID
========================= */

.grid{

    display:grid;

    grid-template-columns:
        repeat(
            2,
            minmax(0,1fr)
        );

    gap:18px;
}


/* =========================
   ITEM
========================= */

.item{

    border:1px solid #ddd;

    border-radius:14px;

    overflow:hidden;

    background:#fff;
}


.item img{

    width:100%;

    aspect-ratio:16/6;

    object-fit:cover;

    display:block;
}


.bottom{

    padding:12px;
}


.name{

    font-size:13px;

    font-weight:700;

    margin-bottom:10px;

    overflow:hidden;

    white-space:nowrap;

    text-overflow:ellipsis;
}


.delete{

    width:100%;

    padding:11px;

    border:0;

    border-radius:9px;

    background:#eee;

    color:#111;

    font-weight:700;

    cursor:pointer;
}


.delete:hover{

    background:#ddd;
}


/* =========================
   EMPTY
========================= */

.empty{

    text-align:center;

    color:#888;

    padding:40px 10px;

    grid-column:1 / -1;
}


/* =========================
   DELETE MODAL
========================= */

.modal{

    position:fixed;

    inset:0;

    background:rgba(0,0,0,.55);

    display:none;

    align-items:center;

    justify-content:center;

    padding:20px;

    z-index:9999;
}


.modal.show{

    display:flex;
}


.modal-box{

    width:100%;

    max-width:360px;

    background:#fff;

    border-radius:20px;

    padding:25px;

    box-shadow:
        0 20px 60px
        rgba(0,0,0,.25);

    animation:
        modalIn .18s ease;
}


@keyframes modalIn{

    from{

        transform:scale(.94);

        opacity:0;

    }

    to{

        transform:scale(1);

        opacity:1;

    }

}


.modal-title{

    font-size:21px;

    font-weight:800;

    margin-bottom:9px;
}


.modal-text{

    font-size:14px;

    color:#777;

    line-height:1.5;

    margin-bottom:22px;
}


.modal-buttons{

    display:flex;

    gap:10px;
}


.cancel-btn,
.confirm-btn{

    flex:1;

    padding:12px;

    border:0;

    border-radius:10px;

    font-weight:700;

    cursor:pointer;
}


.cancel-btn{

    background:#eee;

    color:#111;
}


.confirm-btn{

    background:#111;

    color:#fff;
}


.confirm-btn:disabled{

    opacity:.5;

    cursor:not-allowed;
}


/* =========================
   FOOTER
========================= */

.footer{

    width:100%;

    background:#111;

    color:#fff;

    text-align:center;

    padding:30px 20px;

    margin-top:auto;

    flex-shrink:0;
}


.footer-title{

    font-size:17px;

    font-weight:800;
}


.footer-text{

    color:#aaa;

    font-size:13px;

    margin-top:8px;
}


.footer-copy{

    color:#777;

    font-size:12px;

    margin-top:18px;
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .header{

        padding:16px;

    }


    .logo{

        font-size:18px;

    }


    .header-buttons{

        gap:6px;

    }


    .dashboard-btn,
    .logout-btn{

        padding:10px 11px;

        font-size:10px;

    }


    .grid{

        grid-template-columns:1fr;

    }


    h1{

        font-size:28px;

    }


    .main{

        padding:30px 14px 45px;

    }


    .card{

        padding:14px;

    }

}

</style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header class="header">


    <div class="logo">
        Visiting Card
    </div>


    <div class="header-buttons">


        <button
            type="button"
            class="dashboard-btn"
            onclick="goDashboard()"
        >

            ← Dashboard

        </button>


        <button
            type="button"
            class="logout-btn"
            id="logoutButton"
        >

            Logout

        </button>


    </div>

</header>



<!-- =========================
     MAIN
========================= -->

<main class="main">


    <h1>
        Banner Manager
    </h1>


    <p class="subtitle">
        Manage your website banners.
    </p>


    <div class="card">


        <div
            class="grid"
            id="bannerGrid"
        >

            <div class="empty">
                Checking admin access...
            </div>

        </div>


    </div>


</main>



<!-- =========================
     DELETE MODAL
========================= -->

<div
    class="modal"
    id="deleteModal"
>


    <div class="modal-box">


        <div class="modal-title">
            Delete Banner?
        </div>


        <div class="modal-text">

            Are you sure you want to delete this banner?
            This action cannot be undone.

        </div>


        <div class="modal-buttons">


            <button
                class="cancel-btn"
                onclick="closeDeleteModal()"
            >

                Cancel

            </button>


            <button
                class="confirm-btn"
                id="confirmDeleteButton"
                onclick="confirmDelete()"
            >

                Delete

            </button>


        </div>


    </div>

</div>



<!-- =========================
     FOOTER
========================= -->

<footer class="footer">


    <div class="footer-title">
        Visiting Card
    </div>


    <div class="footer-text">
        Admin Banner Manager
    </div>


    <div class="footer-copy">
        © 2026 Visiting Card. All rights reserved.
    </div>


</footer>



<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://mtuspuehsxsjoaxoenen.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_JpopjwDVjFvsDjXeG_56NQ_k3nA2mU6";


const client =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =====================================================
   SETTINGS
===================================================== */

const BUCKET =
    "banners";


const TABLE =
    "banners";


/* =====================================================
   ELEMENTS
===================================================== */

const grid =
    document.getElementById(
        "bannerGrid"
    );


const deleteModal =
    document.getElementById(
        "deleteModal"
    );


const confirmDeleteButton =
    document.getElementById(
        "confirmDeleteButton"
    );


const logoutButton =
    document.getElementById(
        "logoutButton"
    );


let selectedBannerId =
    null;


/* =====================================================
   ADMIN CHECK
===================================================== */

async function checkAdmin(){

    try{

        const {
            data,
            error
        } =
        await client
            .auth
            .getUser();


        if(
            error ||
            !data ||
            !data.user
        ){

            window.location.replace(
                "admin-login.html"
            );

            return false;

        }


        return true;

    }
    catch(error){

        console.error(
            "ADMIN CHECK ERROR:",
            error
        );


        window.location.replace(
            "admin-login.html"
        );


        return false;

    }

}


/* =====================================================
   DASHBOARD
===================================================== */

function goDashboard(){

    window.location.href =
        "admin-dashboard.html";

}


/* =====================================================
   LOGOUT
===================================================== */

logoutButton.addEventListener(
    "click",
    async function(){

        logoutButton.disabled =
            true;

        logoutButton.textContent =
            "Logging out...";


        const {
            error
        } =
        await client
            .auth
            .signOut();


        if(error){

            console.error(
                "LOGOUT ERROR:",
                error
            );


            alert(
                "Unable to logout. Please try again."
            );


            logoutButton.disabled =
                false;

            logoutButton.textContent =
                "Logout";

            return;

        }


        window.location.replace(
            "admin-login.html"
        );

    }
);


/* =====================================================
   LOAD BANNERS
===================================================== */

async function loadBanners(){

    grid.innerHTML = `
        <div class="empty">
            Loading banners...
        </div>
    `;


    const result =
        await client
            .from(TABLE)
            .select(
                "id,name,image_url"
            )
            .order(
                "id",
                {
                    ascending:false
                }
            );


    if(result.error){

        grid.innerHTML = `
            <div class="empty">
                Unable to load banners.
            </div>
        `;


        console.error(
            "BANNER LOAD ERROR:",
            result.error
        );


        return;

    }


    const banners =
        result.data || [];


    if(banners.length === 0){

        grid.innerHTML = `
            <div class="empty">
                No banners uploaded.
            </div>
        `;


        return;

    }


    grid.innerHTML = "";


    banners.forEach(
        function(banner){

            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "item";


            const image =
                document.createElement(
                    "img"
                );


            image.src =
                banner.image_url;


            image.alt =
                "Banner";


            const bottom =
                document.createElement(
                    "div"
                );


            bottom.className =
                "bottom";


            const name =
                document.createElement(
                    "div"
                );


            name.className =
                "name";


            name.textContent =
                banner.name ||
                "Banner";


            const deleteButton =
                document.createElement(
                    "button"
                );


            deleteButton.className =
                "delete";


            deleteButton.type =
                "button";


            deleteButton.textContent =
                "Delete";


            deleteButton.addEventListener(
                "click",
                function(){

                    deleteBanner(
                        banner.id
                    );

                }
            );


            bottom.appendChild(
                name
            );


            bottom.appendChild(
                deleteButton
            );


            item.appendChild(
                image
            );


            item.appendChild(
                bottom
            );


            grid.appendChild(
                item
            );

        }
    );

}


/* =====================================================
   OPEN DELETE MODAL
===================================================== */

function deleteBanner(id){

    selectedBannerId =
        id;


    deleteModal.classList.add(
        "show"
    );

}


/* =====================================================
   CLOSE DELETE MODAL
===================================================== */

function closeDeleteModal(){

    selectedBannerId =
        null;


    deleteModal.classList.remove(
        "show"
    );


    confirmDeleteButton.disabled =
        false;


    confirmDeleteButton.textContent =
        "Delete";

}


/* =====================================================
   CONFIRM DELETE
===================================================== */

async function confirmDelete(){

    if(
        !selectedBannerId
    ){

        return;

    }


    const id =
        selectedBannerId;


    confirmDeleteButton.disabled =
        true;


    confirmDeleteButton.textContent =
        "Deleting...";


    /* FIND BANNER */

    const result =
        await client
            .from(TABLE)
            .select(
                "id,image_url"
            )
            .eq(
                "id",
                id
            )
            .single();


    if(result.error){

        alert(
            "Unable to find banner."
        );


        closeDeleteModal();

        return;

    }


    const banner =
        result.data;


    /* DELETE DATABASE */

    const deleted =
        await client
            .from(TABLE)
            .delete()
            .eq(
                "id",
                id
            );


    if(deleted.error){

        alert(
            deleted.error.message
        );


        closeDeleteModal();

        return;

    }


    /* DELETE STORAGE */

    const marker =
        "/storage/v1/object/public/" +
        BUCKET +
        "/";


    if(
        banner.image_url &&
        banner.image_url.includes(
            marker
        )
    ){

        const path =
            banner.image_url
                .split(marker)[1];


        const storageDelete =
            await client
                .storage
                .from(BUCKET)
                .remove([
                    path
                ]);


        if(storageDelete.error){

            console.error(
                "STORAGE DELETE ERROR:",
                storageDelete.error
            );

        }

    }


    closeDeleteModal();


    await loadBanners();

}


/* =====================================================
   CLOSE MODAL ON BACKGROUND
===================================================== */

deleteModal.addEventListener(
    "click",
    function(event){

        if(
            event.target ===
            deleteModal
        ){

            closeDeleteModal();

        }

    }
);


/* =====================================================
   START
===================================================== */

async function initialize(){

    const isAdmin =
        await checkAdmin();


    if(!isAdmin){

        return;

    }


    await loadBanners();

}


initialize();

</script>


</body>

</html>
