<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Current Offers - Pyncode</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#f7f8fc;
    color:#171b2b;
    min-height:100vh;
    display:flex;
    flex-direction:column;
}

/* =========================
   HEADER
========================= */

.header{
    height:88px;
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 24px;
    border-bottom:1px solid #e8e8e8;
}

.logo{
    display:flex;
    align-items:center;
    gap:14px;
    font-size:25px;
    font-weight:800;
}

.logo-icon{
    width:52px;
    height:52px;
    border-radius:16px;
    background:linear-gradient(135deg,#ff6b18,#ff416c);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:25px;
    font-weight:800;
}

.back-btn{
    background:#202633;
    color:#fff;
    border:0;
    border-radius:14px;
    padding:14px 20px;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
}

/* =========================
   MAIN
========================= */

.container{
    width:100%;
    max-width:900px;
    margin:auto;
    padding:28px 16px 55px;
    flex:1;
}

/* =========================
   SHOP HEADER
========================= */

.shop-header{
    background:#fff;
    border-radius:22px;
    padding:22px;
    display:flex;
    align-items:center;
    gap:18px;
    box-shadow:0 5px 20px rgba(0,0,0,.05);
    margin-bottom:28px;
}

.shop-image{
    width:100px;
    height:100px;
    border-radius:18px;
    object-fit:cover;
    flex-shrink:0;
    background:#f0f1f4;
}

.shop-name{
    font-size:26px;
    font-weight:800;
    margin-bottom:7px;
}

.shop-category{
    color:#7d8493;
    font-size:15px;
}

.shop-location{
    margin-top:8px;
    color:#777;
    font-size:14px;
}

/* =========================
   TITLE
========================= */

.title{
    font-size:30px;
    font-weight:800;
    margin-bottom:7px;
}

.subtitle{
    color:#777f8e;
    font-size:15px;
    margin-bottom:22px;
}

/* =========================
   SLIDER
========================= */

.offer-slider{
    position:relative;
    width:100%;
    display:flex;
    justify-content:center;
    overflow:hidden;
    border-radius:24px;
}

.slides{
    display:flex;
    width:100%;
    transition:transform .45s ease;
    touch-action:pan-y;
}

.slide{
    min-width:100%;
    display:flex;
    justify-content:center;
    align-items:center;
}

.poster{
    width:min(100%,500px);
    aspect-ratio:9 / 16;
    object-fit:cover;
    display:block;
    border-radius:20px;
    cursor:pointer;
    box-shadow:0 10px 30px rgba(0,0,0,.15);
    user-select:none;
    -webkit-user-select:none;
}

/* =========================
   ARROWS
========================= */

.slider-arrow{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:46px;
    height:46px;
    border:0;
    border-radius:50%;
    background:rgba(0,0,0,.65);
    color:#fff;
    font-size:30px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    z-index:5;
}

.slider-prev{
    left:12px;
}

.slider-next{
    right:12px;
}

/* =========================
   DOTS
========================= */

.dots{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:8px;
    margin-top:18px;
}

.dot{
    width:8px;
    height:8px;
    border-radius:50%;
    background:#cfd2d8;
    cursor:pointer;
    transition:.25s;
}

.dot.active{
    width:24px;
    border-radius:20px;
    background:#ff5b2a;
}

/* =========================
   SLIDE COUNT
========================= */

.slide-count{
    text-align:center;
    margin-top:10px;
    color:#8a909b;
    font-size:13px;
}

/* =========================
   EMPTY
========================= */

.empty{
    background:#fff;
    border-radius:22px;
    padding:50px 20px;
    text-align:center;
    color:#777;
}

/* =========================
   FULLSCREEN VIEWER
========================= */

.viewer{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.96);
    z-index:9999;
    display:none;
    align-items:center;
    justify-content:center;
}

.viewer.active{
    display:flex;
}

.viewer-image{
    width:100%;
    height:100%;
    max-width:100%;
    max-height:100%;
    object-fit:contain;
    user-select:none;
    -webkit-user-select:none;
    touch-action:none;
}

.viewer-close{
    position:absolute;
    top:18px;
    right:18px;
    width:46px;
    height:46px;
    border:0;
    border-radius:50%;
    background:rgba(255,255,255,.18);
    color:#fff;
    font-size:30px;
    cursor:pointer;
    z-index:10001;
}

.viewer-arrow{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:48px;
    height:48px;
    border:0;
    border-radius:50%;
    background:rgba(255,255,255,.18);
    color:#fff;
    font-size:32px;
    cursor:pointer;
    z-index:10001;
}

.viewer-prev{
    left:15px;
}

.viewer-next{
    right:15px;
}

/* =========================
   FOOTER
========================= */
.footer{
    background:#202633;
    color:#fff;
    text-align:center;
    padding:28px 15px;
    margin-top:auto;
}

.footer-title{
    font-size:19px;
    font-weight:800;
}

.footer-text{
    margin-top:7px;
    color:#c8ccd4;
    font-size:13px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .header{
        height:76px;
        padding:0 15px;
    }

    .logo{
        font-size:21px;
        gap:10px;
    }

    .logo-icon{
        width:44px;
        height:44px;
        border-radius:13px;
        font-size:21px;
    }

    .back-btn{
        padding:11px 15px;
        font-size:14px;
    }

    .container{
        padding:22px 15px 45px;
    }

    .shop-header{
        padding:17px;
        gap:14px;
        margin-bottom:24px;
    }

    .shop-image{
        width:82px;
        height:82px;
        border-radius:16px;
    }

    .shop-name{
        font-size:21px;
    }

    .shop-category{
        font-size:14px;
    }

    .shop-location{
        font-size:13px;
    }

    .title{
        font-size:26px;
    }

    .subtitle{
        font-size:14px;
        margin-bottom:18px;
    }

    .offer-slider{
        border-radius:20px;
    }

    .poster{
        width:100%;
        border-radius:18px;
    }

    .slider-arrow{
        width:40px;
        height:40px;
        font-size:25px;
    }

    .slider-prev{
        left:8px;
    }

    .slider-next{
        right:8px;
    }

}

</style>

</head>

<body>


<!-- =========================
     HEADER
========================= -->

<header class="header">

    <div class="logo">

        <div class="logo-icon">
            P
        </div>

        <span>Pyncode</span>

    </div>

    <button
        type="button"
        class="back-btn"
        onclick="history.back()"
    >
        ← Back
    </button>

</header>


<!-- =========================
     MAIN
========================= -->

<main class="container">


    <!-- SHOP DETAILS -->

    <section class="shop-header">

        <img
            id="shopImage"
            class="shop-image"
            src=""
            alt="Shop"
        >

        <div>

            <div
                id="shopName"
                class="shop-name"
            >
                Loading...
            </div>

            <div
                id="shopCategory"
                class="shop-category"
            >
                —
            </div>

            <div
                id="shopLocation"
                class="shop-location"
            >
                📍 Loading...
            </div>

        </div>

    </section>


    <!-- TITLE -->

    <h1 class="title">
        🔥 Current Offers
    </h1>

    <p class="subtitle">
        Latest offers and special deals from this shop
    </p>


    <!-- =========================
         OFFER SLIDER
    ========================= -->

    <section
        class="offer-slider"
        id="offerSlider"
        style="display:none;"
    >

        <div
            class="slides"
            id="slides"
        ></div>


        <button
            type="button"
            class="slider-arrow slider-prev"
            id="prevBtn"
            aria-label="Previous offer"
        >
            ‹
        </button>


        <button
            type="button"
            class="slider-arrow slider-next"
            id="nextBtn"
            aria-label="Next offer"
        >
            ›
        </button>

    </section>


    <!-- DOTS -->

    <div
        class="dots"
        id="dots"
    ></div>


    <div
        class="slide-count"
        id="slideCount"
    ></div>


    <!-- EMPTY -->

    <div
        id="emptyBox"
        class="empty"
        style="display:none;"
    >

        <div
            style="
                font-size:42px;
                margin-bottom:12px;
            "
        >
            📭
        </div>

        <strong>
            No Current Offers
        </strong>

        <div
            id="emptyText"
            style="
                margin-top:8px;
                font-size:14px;
            "
        >
            This shop has no approved offers right now.
        </div>

    </div>


</main>


<!-- =========================
     FOOTER
========================= -->

<footer class="footer">

    <div class="footer-title">
        Pyncode
    </div>

    <div class="footer-text">
        Discover Local Offers & Promotions Near You.
    </div>

</footer>


<!-- =========================
     FULLSCREEN VIEWER
========================= -->

<div
    class="viewer"
    id="viewer"
>

    <button
        type="button"
        class="viewer-close"
        id="viewerClose"
        aria-label="Close"
    >
        ×
    </button>


    <button
        type="button"
        class="viewer-arrow viewer-prev"
        id="viewerPrev"
        aria-label="Previous"
    >
        ‹
    </button>


    <img
        id="viewerImage"
        class="viewer-image"
        alt="Offer"
    >


    <button
        type="button"
        class="viewer-arrow viewer-next"
        id="viewerNext"
        aria-label="Next"
    >
        ›
    </button>

</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://mtuspuehsxsjoaxoenen.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_JpopjwDVjFvsDjXeG_56NQ_k3nA2mU6";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =====================================================
   ELEMENTS
===================================================== */

const shopNameElement =
    document.getElementById("shopName");

const shopCategoryElement =
    document.getElementById("shopCategory");

const shopLocationElement =
    document.getElementById("shopLocation");

const shopImageElement =
    document.getElementById("shopImage");

const offerSlider =
    document.getElementById("offerSlider");

const slides =
    document.getElementById("slides");

const prevBtn =
    document.getElementById("prevBtn");

const nextBtn =
    document.getElementById("nextBtn");

const dotsContainer =
    document.getElementById("dots");

const slideCount =
    document.getElementById("slideCount");

const emptyBox =
    document.getElementById("emptyBox");

const emptyText =
    document.getElementById("emptyText");

const viewer =
    document.getElementById("viewer");

const viewerImage =
    document.getElementById("viewerImage");

const viewerClose =
    document.getElementById("viewerClose");

const viewerPrev =
    document.getElementById("viewerPrev");

const viewerNext =
    document.getElementById("viewerNext");


/* =====================================================
   GET SHOP ID FROM URL
===================================================== */

const params =
    new URLSearchParams(
        window.location.search
    );

const shopId =
    params.get("shop_id");


/* =====================================================
   SLIDER VARIABLES
===================================================== */

let offers = [];

let currentIndex = 0;

let autoSlide;


/* =====================================================
   LOAD SHOP DETAILS
===================================================== */

async function loadShop(){

    if(!shopId){

        shopNameElement.textContent =
            "Shop Not Found";

        shopCategoryElement.textContent =
            "";

        shopLocationElement.textContent =
            "";

        showEmpty(
            "Invalid shop link."
        );

        return false;

    }


    const {
        data: shop,
        error
    } =
    await supabaseClient
        .from("shops")
        .select(`
            id,
            shop_name,
            category,
            address,
            area,
            city,
            shop_image
        `)
        .eq(
            "id",
            shopId
        )
        .maybeSingle();


    if(error){

        console.error(
            "Shop load error:",
            error
        );

        shopNameElement.textContent =
            "Unable to load shop";

        showEmpty(
            "Please try again."
        );

        return false;

    }


    if(!shop){

        shopNameElement.textContent =
            "Shop Not Found";

        shopCategoryElement.textContent =
            "";

        shopLocationElement.textContent =
            "";

        showEmpty(
            "This shop could not be found."
        );

        return false;

    }


    /* SHOP NAME */

    shopNameElement.textContent =
        shop.shop_name ||
        "Shop";


    /* CATEGORY */

    shopCategoryElement.textContent =
        shop.category ||
        "Business";


    /* LOCATION */

    const locationParts = [
        shop.area,
        shop.city
    ].filter(Boolean);


    shopLocationElement.textContent =
        locationParts.length
        ?
        "📍 " +
        locationParts.join(", ")
        :
        "";


    /* SHOP IMAGE */

    if(shop.shop_image){

        shopImageElement.src =
            shop.shop_image;

    }else{

        shopImageElement.style.display =
            "none";

    }


    return true;

}


/* =====================================================
   LOAD APPROVED OFFERS
===================================================== */

async function loadOffers(){

    if(!shopId){

        return;

    }


    const {
        data,
        error
    } =
    await supabaseClient
        .from("shop_offers")
        .select(`
            id,
            shop_id,
            offer_image,
            pincode,
            status,
            is_active,
            created_at,
            expires_at
        `)
        .eq(
            "shop_id",
            shopId

        )
        .eq(
            "is_active",
            true
        )
        .order(
            "created_at",
            {
                ascending:false
            }
        );


    if(error){

        console.error(
            "Offers load error:",
            error
        );

        showEmpty(
            "Unable to load current offers."
        );

        return;

    }


    const now =
        new Date();


    offers =
        (data || []).filter(
            function(offer){

                if(
                    !offer.expires_at
                ){

                    return true;

                }


                return new Date(
                    offer.expires_at
                ) > now;

            }
        );


    if(
        offers.length === 0
    ){

        showEmpty(
            "This shop has no approved offers right now."
        );

        return;

    }


    emptyBox.style.display =
        "none";

    offerSlider.style.display =
        "flex";


    renderOffers();

}


/* =====================================================
   EMPTY STATE
===================================================== */

function showEmpty(text){

    offerSlider.style.display =
        "none";

    dotsContainer.innerHTML =
        "";

    slideCount.textContent =
        "";

    emptyBox.style.display =
        "block";

    emptyText.textContent =
        text;

}


/* =====================================================
   RENDER OFFERS
===================================================== */

function renderOffers(){

    slides.innerHTML =
        "";

    dotsContainer.innerHTML =
        "";

    currentIndex = 0;


    offers.forEach(
        function(offer, index){

            const slide =
                document.createElement(
                    "div"
                );

            slide.className =
                "slide";


            const image =
                document.createElement(
                    "img"
                );

            image.className =
                "poster";

            image.src =
                offer.offer_image;

            image.alt =
                "Current Offer";

            image.loading =
                "lazy";


            image.addEventListener(
                "click",
                function(){

                    currentIndex =
                        index;

                    updateViewer();

                    viewer.classList.add(
                        "active"
                    );

                    document.body.style.overflow =
                        "hidden";

                }
            );


            slide.appendChild(
                image
            );

            slides.appendChild(
                slide
            );


            const dot =
                document.createElement(
                    "div"
                );

            dot.className =
                "dot";


            dot.addEventListener(
                "click",
                function(){

                    currentIndex =
                        index;

                    updateSlider();

                    restartAutoSlide();

                }
            );


            dotsContainer.appendChild(
                dot
            );

        }
    );


    updateSlider();

    startAutoSlide();

}

  /* =====================================================
   UPDATE SLIDER
===================================================== */

function updateSlider(){

    slides.style.transform =
        "translateX(-" +
        (currentIndex * 100) +
        "%)";


    const dots =
        dotsContainer.querySelectorAll(
            ".dot"
        );


    dots.forEach(
        function(dot, index){

            dot.classList.toggle(
                "active",
                index === currentIndex
            );

        }
    );


    slideCount.textContent =
        (currentIndex + 1) +
        " / " +
        offers.length;

}


/* =====================================================
   NEXT SLIDE
===================================================== */

function nextSlide(){

    if(
        offers.length === 0
    ){

        return;

    }


    currentIndex++;


    if(
        currentIndex >=
        offers.length
    ){

        currentIndex = 0;

    }


    updateSlider();

}


/* =====================================================
   PREVIOUS SLIDE
===================================================== */

function previousSlide(){

    if(
        offers.length === 0
    ){

        return;

    }


    currentIndex--;


    if(
        currentIndex < 0
    ){

        currentIndex =
            offers.length - 1;

    }


    updateSlider();

}


/* =====================================================
   BUTTONS
===================================================== */

nextBtn.addEventListener(
    "click",
    function(){

        nextSlide();

        restartAutoSlide();

    }
);


prevBtn.addEventListener(
    "click",
    function(){

        previousSlide();

        restartAutoSlide();

    }
);


/* =====================================================
   AUTO SLIDE
===================================================== */

function startAutoSlide(){

    clearInterval(
        autoSlide
    );


    if(
        offers.length <= 1
    ){

        return;

    }


    autoSlide =
        setInterval(
            function(){

                nextSlide();

            },
            4000
        );

}


function restartAutoSlide(){

    clearInterval(
        autoSlide
    );

    startAutoSlide();

}


/* =====================================================
   UPDATE FULLSCREEN VIEWER
===================================================== */

function updateViewer(){

    if(
        offers.length === 0
    ){

        return;

    }


    viewerImage.src =
        offers[
            currentIndex
        ].offer_image;

}


/* =====================================================
   VIEWER NEXT
===================================================== */

viewerNext.addEventListener(
    "click",
    function(){

        nextSlide();

        updateViewer();

    }
);


/* =====================================================
   VIEWER PREVIOUS
===================================================== */

viewerPrev.addEventListener(
    "click",
    function(){

        previousSlide();

        updateViewer();

    }
);


/* =====================================================
   CLOSE VIEWER
===================================================== */

function closeViewer(){

    viewer.classList.remove(
        "active"
    );

    viewerImage.src =
        "";

    document.body.style.overflow =
        "";

}


viewerClose.addEventListener(
    "click",
    closeViewer
);


viewer.addEventListener(
    "click",
    function(event){

        if(
            event.target === viewer
        ){

            closeViewer();

        }

    }
);


/* =====================================================
   KEYBOARD
===================================================== */

document.addEventListener(
    "keydown",
    function(event){

        if(
            !viewer.classList.contains(
                "active"
            )
        ){

            return;

        }


        if(
            event.key ===
            "ArrowRight"
        ){

            nextSlide();

            updateViewer();

        }


        if(
            event.key ===
            "ArrowLeft"
        ){

            previousSlide();

            updateViewer();

        }


        if(
            event.key ===
            "Escape"
        ){

            closeViewer();

        }

    }
);


/* =====================================================
   SWIPE - MAIN SLIDER
===================================================== */

let startX = 0;

let endX = 0;


slides.addEventListener(
    "touchstart",
    function(event){

        startX =
            event.touches[0].clientX;

    },
    {
        passive:true
    }
);


slides.addEventListener(
    "touchend",
    function(event){

        endX =
            event.changedTouches[0].clientX;


        const difference =
            endX - startX;


        if(
            Math.abs(difference) < 50
        ){

            return;

        }


        if(
            difference < 0
        ){

            nextSlide();

        }else{

            previousSlide();

        }


        restartAutoSlide();

    },
    {
        passive:true
    }
);


/* =====================================================
   SWIPE - FULLSCREEN
===================================================== */

let viewerStartX = 0;

let viewerEndX = 0;


viewerImage.addEventListener(
    "touchstart",
    function(event){

        viewerStartX =
            event.touches[0].clientX;

    },
    {
        passive:true
    }
);


viewerImage.addEventListener(
    "touchend",
    function(event){

        viewerEndX =
            event.changedTouches[0].clientX;


        const difference =
            viewerEndX -
            viewerStartX;


        if(
            Math.abs(difference) < 50
        ){

            return;

        }


        if(
            difference < 0
        ){

            nextSlide();

        }else{

            previousSlide();

        }


        updateViewer();

    },
    {
        passive:true
    }
);


/* =====================================================
   PAGE INITIALIZE
===================================================== */

(async function(){

    const shopLoaded =
        await loadShop();


    if(!shopLoaded){

        return;

    }


    await loadOffers();

})();

</script>

</body>
</html>
