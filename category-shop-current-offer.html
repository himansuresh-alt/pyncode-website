/* =====================================================
   RESET
===================================================== */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:#f5f6fa;

    color:#171923;

    min-height:100vh;

    display:flex;

    flex-direction:column;

    padding-bottom:78px;

    overflow-x:hidden;
}


/* =====================================================
   CATEGORY HERO
   MATCH SHOP.HTML STYLE
===================================================== */

.category-hero{

    width:calc(100% - 32px);

    max-width:1050px;

    min-height:225px;

    margin:20px auto 0;

    position:relative;

    overflow:hidden;

    border-radius:22px;

    background:#ffffff;

    border:1px solid #e5e8ed;

    box-shadow:
        0 12px 30px
        rgba(20,30,60,.10);
}


.category-hero-content{

    width:100%;

    min-height:225px;

    padding:28px 30px;

    display:flex;

    flex-direction:column;

    justify-content:center;

    background:#ffffff;
}


/* =====================================================
   HERO EYEBROW
===================================================== */

.hero-eyebrow{

    color:#ef603e;

    font-size:11px;

    font-weight:900;

    text-transform:uppercase;

    letter-spacing:1px;

    margin-bottom:7px;
}


/* =====================================================
   HERO TITLE
===================================================== */

.hero-title{

    color:#151a28;

    font-size:30px;

    line-height:1.12;

    font-weight:900;

    letter-spacing:-.7px;
}


/* =====================================================
   HERO DESCRIPTION
===================================================== */

.hero-description{

    margin-top:7px;

    color:#737b89;

    font-size:13px;

    line-height:1.5;
}


/* =====================================================
   HERO BRANDS
===================================================== */

.hero-brands{

    display:flex;

    gap:10px;

    margin-top:16px;

    overflow-x:auto;

    scrollbar-width:none;

    padding:2px 2px 8px;
}

.hero-brands::-webkit-scrollbar{

    display:none;
}


/* =====================================================
   HERO BRAND CARD
===================================================== */

.hero-brand{

    flex:0 0 105px;

    height:62px;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:8px;

    background:#ffffff;

    border:1px solid #e4e7ec;

    border-radius:12px;

    box-shadow:
        0 4px 12px
        rgba(20,30,60,.06);
}


.hero-brand img{

    max-width:85px;

    max-height:44px;

    width:auto;

    height:auto;

    object-fit:contain;
}


.hero-brand-name{

    display:block;

    color:#343b48;

    font-size:10px;

    font-weight:900;

    text-align:center;

    line-height:1.25;
}


/* =====================================================
   MAIN
===================================================== */

.container{

    width:100%;

    max-width:1050px;

    margin:0 auto;

    padding:22px 16px 40px;

    flex:1;
}


/* =====================================================
   SHOP PROFILE
===================================================== */

.shop-profile{

    background:#fff;

    border-radius:24px;

    padding:18px;

    display:flex;

    align-items:center;

    gap:16px;

    box-shadow:
        0 8px 30px
        rgba(17,24,39,.07);

    margin-bottom:25px;

    border:1px solid
        rgba(0,0,0,.035);
}


.shop-image-wrap{

    width:92px;

    height:92px;

    flex-shrink:0;

    border-radius:22px;

    padding:3px;

    background:#f0f1f5;

    overflow:hidden;
}


.shop-image{

    width:100%;

    height:100%;

    object-fit:cover;

    border-radius:19px;

    background:#f0f1f5;

    display:block;
}


.shop-info{

    min-width:0;

    flex:1;
}


.shop-name{

    font-size:22px;

    line-height:1.2;

    font-weight:800;

    letter-spacing:-.3px;

    word-break:break-word;
}


.shop-category{

    color:#7b8190;

    font-size:13px;

    font-weight:600;

    margin-top:5px;
}


.shop-location{

    color:#626978;

    font-size:13px;

    line-height:1.4;

    margin-top:8px;

    word-break:break-word;
}


/* =====================================================
   SECTION TITLE
===================================================== */

.offers-heading{

    display:flex;

    align-items:flex-end;

    justify-content:space-between;

    gap:12px;

    margin-bottom:15px;
}


.offers-title{

    font-size:24px;

    font-weight:800;

    letter-spacing:-.4px;
}


.offers-subtitle{

    color:#858b98;

    font-size:13px;

    margin-top:5px;
}


.offer-counter{

    flex-shrink:0;

    padding:7px 11px;

    border-radius:20px;

    background:#fff;

    color:#666d7b;

    font-size:12px;

    font-weight:700;

    box-shadow:
        0 3px 12px
        rgba(0,0,0,.05);
}


/* =====================================================
   OFFER AREA
===================================================== */

.offer-stage{

    width:100%;

    position:relative;

    padding:8px 0 18px;
}


.offer-slider{

    width:100%;

    overflow:hidden;

    border-radius:28px;

    position:relative;

    touch-action:pan-y;
}


.slides{

    display:flex;

    width:100%;

    transition:
        transform .45s
        cubic-bezier(.22,.61,.36,1);

    touch-action:pan-y;
}


.slide{

    min-width:100%;

    display:flex;

    justify-content:center;

    align-items:center;

    padding:0 10px;
}


/* =====================================================
   POSTER
===================================================== */

.poster-frame{

    width:min(100%,520px);

    padding:7px;

    border-radius:28px;

    background:#fff;

    box-shadow:
        0 18px 45px
        rgba(17,24,39,.16);
}


.poster{

    width:100%;

    aspect-ratio:9 / 16;

    object-fit:cover;

    display:block;

    border-radius:22px;

    cursor:pointer;

    user-select:none;

    -webkit-user-select:none;
}


/* =====================================================
   SLIDER ARROWS
===================================================== */

.slider-arrow{

    position:absolute;

    top:50%;

    transform:
        translateY(-50%);

    width:44px;

    height:44px;

    border:0;

    border-radius:50%;

    display:flex;

    align-items:center;

    justify-content:center;

    background:
        rgba(20,24,32,.72);

    color:#fff;

    font-size:28px;

    cursor:pointer;

    z-index:5;

    box-shadow:
        0 5px 18px
        rgba(0,0,0,.18);

    backdrop-filter:
        blur(8px);
}


.slider-prev{

    left:8px;
}


.slider-next{

    right:8px;
}


/* =====================================================
   DOTS
===================================================== */

.dots{

    display:flex;

    justify-content:center;

    align-items:center;

    gap:6px;

    margin-top:14px;
}


.dot{

    width:7px;

    height:7px;

    border-radius:50%;

    background:#d0d4dc;

    cursor:pointer;

    transition:
        all .25s ease;
}


.dot.active{

    width:23px;

    border-radius:20px;

    background:#ff5b2a;
}


/* =====================================================
   EMPTY STATE
===================================================== */

.empty{

    background:#fff;

    border-radius:24px;

    padding:55px 20px;

    text-align:center;

    box-shadow:
        0 8px 28px
        rgba(0,0,0,.05);
}


.empty-icon{

    width:70px;

    height:70px;

    margin:0 auto 16px;

    border-radius:22px;

    display:flex;

    align-items:center;

    justify-content:center;

    background:#f2f3f7;

    font-size:32px;
}


.empty-title{

    font-size:18px;

    font-weight:800;
}


.empty-text{

    color:#7c8290;

    font-size:13px;

    line-height:1.5;

    margin-top:7px;
}


/* =====================================================
   FULLSCREEN VIEWER
===================================================== */

.viewer{

    position:fixed;

    inset:0;

    background:
        rgba(0,0,0,.97);

    z-index:9999;

    display:none;

    align-items:center;

    justify-content:center;
}


.viewer.active{

    display:flex;
}


.viewer-image{

    width:100%;

    height:100%;

    max-width:100%;

    max-height:100%;

    object-fit:contain;

    user-select:none;

    -webkit-user-select:none;

    touch-action:none;
}


.viewer-close{

    position:absolute;

    top:16px;

    right:16px;

    width:46px;

    height:46px;

    border:0;

    border-radius:50%;

    background:
        rgba(255,255,255,.16);

    color:#fff;

    font-size:30px;

    cursor:pointer;

    z-index:10001;
}


.viewer-arrow{

    position:absolute;

    top:50%;

    transform:
        translateY(-50%);

    width:48px;

    height:48px;

    border:0;

    border-radius:50%;

    background:
        rgba(255,255,255,.16);

    color:#fff;

    font-size:32px;

    cursor:pointer;

    z-index:10001;
}


.viewer-prev{

    left:15px;
}


.viewer-next{

    right:15px;
}

  /* =====================================================
   FIXED BOTTOM NAVIGATION
===================================================== */

.bottom-nav{

    position:fixed;

    left:0;

    right:0;

    bottom:0;

    height:72px;

    background:
        rgba(255,255,255,.96);

    border-top:1px solid
        #e6e7eb;

    display:flex;

    align-items:center;

    justify-content:space-around;

    z-index:5000;

    box-shadow:
        0 -5px 22px
        rgba(0,0,0,.07);

    backdrop-filter:
        blur(14px);
}


.bottom-nav-item{

    flex:1;

    height:100%;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    gap:3px;

    text-decoration:none;

    color:#7c8290;

    transition:.2s;

    -webkit-tap-highlight-color:
        transparent;
}


.nav-icon{

    font-size:21px;

    line-height:1;
}


.nav-label{

    font-size:10px;

    font-weight:700;
}


.bottom-nav-item.active{

    color:#ff572d;
}


.bottom-nav-item:active{

    transform:scale(.94);
}

    .poster{

    }

        left:8px;
    }

        right:8px;
    }

/* =====================================================
   DEFAULT CATEGORY
===================================================== */

const defaultCategoryData = {

    description:
        "Discover shops and businesses near you.",

    brands:[]

};


/* =====================================================
   UPDATE CATEGORY HERO
===================================================== */

function updateCategoryHero(category){

    const value =
        String(category || "").trim();


    categoryHeroTitle.textContent =
        value ||
        "All Shops";


    const categoryData =
        categoryHeroData[value] ||
        defaultCategoryData;


    categoryHeroDescription.textContent =
        categoryData.description ||
        "Discover shops and businesses near you.";


    renderCategoryHeroBrands(
        categoryData.brands || []
    );

}


/* =====================================================
   RENDER CATEGORY HERO BRANDS
===================================================== */

function renderCategoryHeroBrands(brands){

    if(
        !brands ||
        !brands.length
    ){

        categoryHeroBrands.innerHTML =
            "";

        return;

    }


    categoryHeroBrands.innerHTML =
        brands
        .map(
            function(brand){

                const name =
                    Array.isArray(brand)
                    ? brand[0]
                    : brand;


                const domain =
                    Array.isArray(brand)
                    ? brand[1]
                    : "";


                if(domain){

                    const logo =
                        "https://www.google.com/s2/favicons?domain=" +
                        encodeURIComponent(domain) +
                        "&sz=128";


                    return `

                        <div
                            class="hero-brand"
                            title="${escapeHtml(name)}"
                        >

                            <img
                                src="${logo}"
                                alt="${escapeHtml(name)}"
                                loading="lazy"
                                onerror="this.style.display='none';"
                            >

                            <span
                                class="hero-brand-name"
                            >
                                ${escapeHtml(name)}
                            </span>

                        </div>

                    `;

                }


                return `

                    <div
                        class="hero-brand"
                        title="${escapeHtml(name)}"
                    >

                        <span
                            class="hero-brand-name"
                        >
                            ${escapeHtml(name)}
                        </span>

                    </div>

                `;

            }
        )
        .join("");

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

    return String(value || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}

/* =====================================================
   LOAD SHOP DETAILS
===================================================== */

async function loadShop(){

    if(!shopId){

        shopNameElement.textContent =
            "Shop Not Found";

        shopCategoryElement.textContent =
            "";

        shopLocationElement.textContent =
            "";

        categoryHeroTitle.textContent =
            "Shop Not Found";

        showEmpty(
            "Invalid shop link."
        );

        return false;
    }


    try{

        const {
            data: shop,
            error
        } =
        await supabaseClient
            .from("shops")
            .select(`
                id,
                shop_name,
                category,
                address,
                area,
                city,
                shop_image
            `)
            .eq(
                "id",
                shopId
            )
            .maybeSingle();


        if(error){

            console.error(
                "Shop load error:",
                error
            );

            shopNameElement.textContent =
                "Unable to load shop";

            categoryHeroTitle.textContent =
                "Unable to load shop";

            showEmpty(
                "Please try again."
            );

            return false;
        }


        if(!shop){

            shopNameElement.textContent =
                "Shop Not Found";

            shopCategoryElement.textContent =
                "";

            shopLocationElement.textContent =
                "";

            categoryHeroTitle.textContent =
                "Shop Not Found";

            showEmpty(
                "This shop could not be found."
            );

            return false;
        }


        /* =================================================
           SHOP NAME
        ================================================= */

        shopNameElement.textContent =
            shop.shop_name ||
            "Shop";


        /* =================================================
           CATEGORY
        ================================================= */

        shopCategoryElement.textContent =
            shop.category ||
            "Business";


        /* =================================================
           CATEGORY HERO
           IMPORTANT:
           No recursive call here.
        ================================================= */

        updateCategoryHero(
            shop.category
        );


        /* =================================================
           LOCATION
        ================================================= */

        const locationParts = [

            shop.address,

            shop.area,

            shop.city

        ].filter(Boolean);


        if(locationParts.length){

            shopLocationElement.textContent =
                "📍 " +
                locationParts.join(
                    ", "
                );

        }else{

            shopLocationElement.textContent =
                "";

        }


        /* =================================================
           SHOP IMAGE
        ================================================= */

        if(shop.shop_image){

            shopImageElement.src =
                shop.shop_image;

            shopImageElement.style.display =
                "block";

        }else{

            shopImageElement.style.display =
                "block";

            shopImageElement.removeAttribute(
                "src"
            );

        }


        return true;

    }
    catch(error){

        console.error(
            "Unexpected shop loading error:",
            error
        );

        shopNameElement.textContent =
            "Unable to load shop";

        categoryHeroTitle.textContent =
            "Unable to load shop";

        showEmpty(
            "Something went wrong. Please refresh the page."
        );

        return false;

    }

}

/* =====================================================
   LOAD APPROVED OFFERS
===================================================== */

async function loadOffers(){

    if(!shopId){

        return;
    }


    try{

        const {
            data,
            error
        } =
        await supabaseClient
            .from("shop_offers")
            .select(`
                id,
                shop_id,
                offer_image,
                pincode,
                status,
                is_active,
                created_at,
                expires_at
            `)
            .eq(
                "shop_id",
                shopId
            )
            .eq(
                "is_active",
                true
            )
            .order(
                "created_at",
                {
                    ascending:false
                }
            );


        if(error){

            console.error(
                "Offers load error:",
                error
            );

            showEmpty(
                "Unable to load current offers."
            );

            return;
        }


        const now =
            new Date();


        offers =
            (data || []).filter(
                function(offer){

                    if(
                        !offer.expires_at
                    ){

                        return true;
                    }


                    return new Date(
                        offer.expires_at
                    ) > now;

                }
            );


        if(
            offers.length === 0
        ){

            showEmpty(
                "This shop has no approved offers right now."
            );

            return;
        }


        emptyBox.style.display =
            "none";


        offerSlider.style.display =
            "block";


        offerCounter.textContent =
            offers.length +
            (
                offers.length === 1
                ? " Offer"
                : " Offers"
            );


        renderOffers();

    }
    catch(error){

        console.error(
            "Unexpected offers error:",
            error
        );

        showEmpty(
            "Unable to load current offers."
        );

    }

}


/* =====================================================
   RENDER OFFERS
===================================================== */

function renderOffers(){

    slides.innerHTML =
        "";

    dotsContainer.innerHTML =
        "";

    currentIndex =
        0;


    offers.forEach(
        function(
            offer,
            index
        ){

            const slide =
                document.createElement(
                    "div"
                );


            slide.className =
                "slide";


            const frame =
                document.createElement(
                    "div"
                );


            frame.className =
                "poster-frame";


            const image =
                document.createElement(
                    "img"
                );


            image.className =
                "poster";


            image.src =
                offer.offer_image;


            image.alt =
                "Current Offer";


            image.loading =
                "lazy";


            image.addEventListener(
                "click",
                function(){

                    currentIndex =
                        index;

                    updateViewer();

                    viewer.classList.add(
                        "active"
                    );

                    document.body.style.overflow =
                        "hidden";

                }
            );


            image.addEventListener(
                "error",
                function(){

                    console.error(
                        "Offer image failed:",
                        offer.offer_image
                    );

                }
            );


            frame.appendChild(
                image
            );


            slide.appendChild(
                frame
            );


            slides.appendChild(
                slide
            );


            const dot =
                document.createElement(
                    "div"
                );


            dot.className =
                "dot";


            dot.setAttribute(
                "aria-label",
                "Offer " + (index + 1)
            );


            dot.addEventListener(
                "click",
                function(){

                    currentIndex =
                        index;

                    updateSlider();

                    restartAutoSlide();

                }
            );


            dotsContainer.appendChild(
                dot
            );

        }
    );


    updateSlider();

    startAutoSlide();

}


/* =====================================================
   UPDATE SLIDER
===================================================== */

function updateSlider(){

    if(!offers.length){

        return;
    }


    slides.style.transform =
        "translateX(-" +
        (
            currentIndex *
            100
        ) +
        "%)";


    const dots =
        dotsContainer.querySelectorAll(
            ".dot"
        );


    dots.forEach(
        function(
            dot,
            index
        ){

            dot.classList.toggle(
                "active",
                index === currentIndex
            );

        }
    );


    offerCounter.textContent =
        (
            currentIndex + 1
        ) +
        " / " +
        offers.length;

}


/* =====================================================
   NEXT SLIDE
===================================================== */

function nextSlide(){

    if(
        offers.length === 0
    ){

        return;
    }


    currentIndex++;


    if(
        currentIndex >=
        offers.length
    ){

        currentIndex =
            0;
    }


    updateSlider();

}


/* =====================================================
   PREVIOUS SLIDE
===================================================== */

function previousSlide(){

    if(
        offers.length === 0
    ){

        return;
    }


    currentIndex--;


    if(
        currentIndex < 0
    ){

        currentIndex =
            offers.length - 1;
    }


    updateSlider();

}


/* =====================================================
   SLIDER BUTTONS
===================================================== */

nextBtn.addEventListener(
    "click",
    function(){

        nextSlide();

        restartAutoSlide();

    }
);


prevBtn.addEventListener(
    "click",
    function(){

        previousSlide();

        restartAutoSlide();

    }
);


/* =====================================================
   AUTO SLIDE
===================================================== */

function startAutoSlide(){

    clearInterval(
        autoSlide
    );


    if(
        offers.length <= 1
    ){

        return;
    }


    autoSlide =
        setInterval(
            function(){

                nextSlide();

            },
            4000
        );

}


function restartAutoSlide(){

    clearInterval(
        autoSlide
    );

    startAutoSlide();

}


/* =====================================================
   FULLSCREEN VIEWER
===================================================== */

function updateViewer(){

    if(
        offers.length === 0
    ){

        return;
    }


    viewerImage.src =
        offers[
            currentIndex
        ].offer_image;

}


/* =====================================================
   VIEWER NEXT
===================================================== */

viewerNext.addEventListener(
    "click",
    function(){

        nextSlide();

        updateViewer();

    }
);


/* =====================================================
   VIEWER PREVIOUS
===================================================== */

viewerPrev.addEventListener(
    "click",
    function(){

        previousSlide();

        updateViewer();

    }
);


/* =====================================================
   CLOSE VIEWER
===================================================== */

function closeViewer(){

    viewer.classList.remove(
        "active"
    );


    viewerImage.src =
        "";


    document.body.style.overflow =
        "";

}


viewerClose.addEventListener(
    "click",
    closeViewer
);


/* =====================================================
   CLOSE VIEWER - OUTSIDE
===================================================== */

viewer.addEventListener(
    "click",
    function(event){

        if(
            event.target === viewer
        ){

            closeViewer();

        }

    }
);


/* =====================================================
   MAIN SLIDER SWIPE
===================================================== */

let startX = 0;

let endX = 0;


slides.addEventListener(
    "touchstart",
    function(event){

        if(
            !event.touches ||
            !event.touches.length
        ){

            return;
        }


        startX =
            event.touches[0].clientX;

    },
    {
        passive:true
    }
);


slides.addEventListener(
    "touchend",
    function(event){

        if(
            !event.changedTouches ||
            !event.changedTouches.length
        ){

            return;
        }


        endX =
            event.changedTouches[0].clientX;


        const difference =
            endX -
            startX;


        if(
            Math.abs(difference) < 50
        ){

            return;
        }


        if(
            difference < 0
        ){

            nextSlide();

        }else{

            previousSlide();

        }


        restartAutoSlide();

    },
    {
        passive:true
    }
);


/* =====================================================
   FULLSCREEN SWIPE
===================================================== */

let viewerStartX = 0;

let viewerEndX = 0;


viewerImage.addEventListener(
    "touchstart",
    function(event){

        if(
            !event.touches ||
            !event.touches.length
        ){

            return;
        }


        viewerStartX =
            event.touches[0].clientX;

    },
    {
        passive:true
    }
);


viewerImage.addEventListener(
    "touchend",
    function(event){

        if(
            !event.changedTouches ||
            !event.changedTouches.length
        ){

            return;
        }


        viewerEndX =
            event.changedTouches[0].clientX;


        const difference =
            viewerEndX -
            viewerStartX;


        if(
            Math.abs(difference) < 50
        ){

            return;
        }


        if(
            difference < 0
        ){

            nextSlide();

        }else{

            previousSlide();

        }


        updateViewer();

    },
    {
        passive:true
    }
);


/* =====================================================
   PREVENT IMAGE DRAGGING
===================================================== */

shopImageElement.addEventListener(
    "dragstart",
    function(event){

        event.preventDefault();

    }
);


viewerImage.addEventListener(
    "dragstart",
    function(event){

        event.preventDefault();

    }
);


/* =====================================================
   KEYBOARD CONTROLS
===================================================== */

document.addEventListener(
    "keydown",
    function(event){

        if(
            !viewer.classList.contains(
                "active"
            )
        ){

            return;
        }


        if(
            event.key ===
            "ArrowRight"
        ){

            nextSlide();

            updateViewer();

        }


        if(
            event.key ===
            "ArrowLeft"
        ){

            previousSlide();

            updateViewer();

        }


        if(
            event.key ===
            "Escape"
        ){

            closeViewer();

        }

    }
);


/* =====================================================
   PAGE INITIALIZE
===================================================== */

(async function(){

    const shopLoaded =
        await loadShop();


    if(!shopLoaded){

        return;
    }


    await loadOffers();

})();

</script>

</body>

</html>
