  <script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://mtuspuehsxsjoaxoenen.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_JpopjwDVjFvsDjXeG_56NQ_k3nA2mU6";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );




/* =====================================================
   PYNCODE PROMOTION CATEGORIES
===================================================== */

const categories = [

    ["🏠","Real Estate & Property"],
    ["🏢","Builders & Developers"],
    ["🚗","Cars & Automobile Dealers"],
    ["🏍️","Bikes & Scooters"],
    ["⚡","EV Vehicles"],
    ["📱","Mobile Phone Accessories"],
    ["📱","Mobile Showrooms"],
    ["🔌","Electronics & Electrical Products"],
    ["🏠","Home Appliances"],
    ["🖥️","Computers & IT Products"],
    ["📷","Cameras & Photography Equipment"],
    ["🎮","Gaming Products & Services"],
    ["🛋️","Furniture & Home Decor"],
    ["👗","Clothing & Fashion"],
    ["💍","Jewellery"],
    ["👟","Footwear"],
    ["💄","Beauty & Personal Care"],
    ["🛒","Retail & Supermarkets"],
    ["🍽️","Restaurants & Cafes"],
    ["🎂","Bakeries & Cakes"],
    ["🍱","Catering & Food Businesses"],
    ["🏨","Hotels & Resorts"],
    ["🎓","Schools & Colleges"],
    ["📚","Coaching & Tuition"],
    ["💻","Training & Skill Development"],
    ["💼","Jobs & Recruitment"],
    ["💰","Finance, Loans & Insurance"],
    ["🏭","Manufacturing & Industrial"],
    ["📦","Wholesale & Distribution"],
    ["🤝","Franchise & Business Opportunities"],
    ["🌾","Agriculture & Farming"],
    ["🏗️","Construction & Building Materials"],
    ["🐾","Pets & Animal Products"],
    ["🏋️","Sports & Fitness"],
    ["🏥","Healthcare & Hospitals"],
    ["🔧","Home & Professional Services"],
    ["💒","Weddings"],
    ["🎉","Events & Entertainment"],
    ["📸","Photography & Videography"],
    ["✈️","Travel & Tours"],
    ["📢","Marketing & Advertising"],
    ["🛍️","Online Business & E-commerce"],
    ["🖨️","Printing & Packaging"],
    ["🚚","Logistics & Transport"],
    ["⚖️","Legal & Documentation"],
    ["🤝","NGO & Social Organisations"],
    ["🏢","Coworking & Office Spaces"],
    ["🏘️","PG, Hostels & Accommodation"],
    ["🎬","Movies & Media"],
    ["📣","Exhibitions & Expos"],
    ["👤","Professionals & Freelancers"],
    ["🆕","New Brands & Product Launches"],
    ["🎁","Offers, Discounts & Sales"],
    ["📣","Announcements & Public Notices"]

];

/* =====================================================
   CATEGORY RENDER
===================================================== */

const categoryGrid =
    document.getElementById(
        "categoryGrid"
    );


function renderCategories(){

    if(!categoryGrid){

        return;

    }


    categoryGrid.innerHTML =
        "";


    categories.forEach(
        function(category){

            const icon =
                category[0];

            const name =
                category[1];


            const card =
                document.createElement(
                    "a"
                );


            card.className =
                "category-card";


            card.href =
                "promotion-category.html?category=" +
                encodeURIComponent(
                    name
                );


            card.innerHTML = `

                <div class="category-icon">
                    ${icon}
                </div>

                <div class="category-name">
                    ${name}
                </div>

                <div class="category-arrow">
                    →
                </div>

            `;


            categoryGrid.appendChild(
                card
            );

        }
    );

}


renderCategories();

/* =====================================================
   AUTOMATIC CATEGORY HORIZONTAL SCROLL
===================================================== */

const categoryScroll =
    document.getElementById("categoryGrid");

let categoryAutoScrollTimer = null;


/* Start automatic scrolling */

function startCategoryAutoScroll(){

    if(!categoryScroll){
        return;
    }

    clearInterval(categoryAutoScrollTimer);

    categoryAutoScrollTimer = setInterval(function(){

        const maxScroll =
            categoryScroll.scrollWidth -
            categoryScroll.clientWidth;


        /* Nothing to scroll */

        if(maxScroll <= 5){
            return;
        }


        /* Scroll to next position */

        const current =
            categoryScroll.scrollLeft;


        const next =
            current + 190;


        if(next >= maxScroll - 5){

            /* Start again from beginning */

            categoryScroll.scrollTo({
                left:0,
                behavior:"smooth"
            });

        }
        else{

            categoryScroll.scrollTo({
                left:next,
                behavior:"smooth"
            });

        }

    }, 2500);

}


/* =====================================================
   PAUSE WHILE USER TOUCHES
===================================================== */

categoryScroll.addEventListener(
    "touchstart",
    function(){

        clearInterval(
            categoryAutoScrollTimer
        );

    },
    {
        passive:true
    }
);


/* =====================================================
   RESUME AFTER USER STOPS TOUCHING
===================================================== */

categoryScroll.addEventListener(
    "touchend",
    function(){

        setTimeout(function(){

            startCategoryAutoScroll();

        },1000);

    },
    {
        passive:true
    }
);


/* =====================================================
   START
===================================================== */

setTimeout(function(){

    startCategoryAutoScroll();

},1000);


/* =====================================================
   POSTER ELEMENTS
===================================================== */

const posterTrack =
    document.getElementById(
        "posterTrack"
    );


const posterDots =
    document.getElementById(
        "posterDots"
    );


const posterPrev =
    document.getElementById(
        "posterPrev"
    );


const posterNext =
    document.getElementById(
        "posterNext"
    );


const posterCount =
    document.getElementById(
        "posterCount"
    );


const posterCarousel =
    document.getElementById(
        "posterCarousel"
    );



/* =====================================================
   POSTER STATE
===================================================== */

let promotionPosters = [];

let currentPoster = 0;

let posterTimer = null;



/* =====================================================
   LOAD LIVE PROMOTION POSTERS
===================================================== */

async function loadPromotionPosters(){

    try{

        posterCount.textContent =
            "Loading...";


        const {
            data,
            error
        } =
            await supabaseClient

                .from("promotions")

                .select(
                    "id, category, pincode, poster_url, is_active, created_at"
                )

                .eq(
                    "is_active",
                    true
                )

                .order(
                    "created_at",
                    {
                        ascending:false
                    }
                );


        if(error){

            console.error(
                "Promotion loading error:",
                error
            );


            promotionPosters = [];

            renderPosters();

            return;

        }


        promotionPosters =
            Array.isArray(data)
                ? data
                : [];


        renderPosters();

    }

    catch(error){

        console.error(
            "Promotion fetch error:",
            error
        );


        promotionPosters = [];

        renderPosters();

    }

}



/* =====================================================
   RENDER POSTERS
===================================================== */

function renderPosters(){

    posterTrack.innerHTML =
        "";

    posterDots.innerHTML =
        "";


    currentPoster = 0;



    /* =================================================
       NO ACTIVE POSTERS
    ================================================= */

    if(
        !promotionPosters ||
        promotionPosters.length === 0
    ){

        posterTrack.innerHTML = `

            <div class="poster-slide">

                <div class="no-posters">

                    <div class="no-posters-icon">
                        📢
                    </div>

                    <strong>
                        No Promotions Available
                    </strong>

                    <span>
                        New business promotions will appear here.
                    </span>

                </div>

            </div>

        `;


        posterPrev.style.display =
            "none";


        posterNext.style.display =
            "none";


        posterDots.style.display =
            "none";


        posterCount.textContent =
            "0 Promotions";


        return;

    }



    /* =================================================
       COUNT
    ================================================= */

    posterCount.textContent =
        promotionPosters.length +
        (
            promotionPosters.length === 1
                ? " Promotion"
                : " Promotions"
        );


    posterDots.style.display =
        "flex";



    /* =================================================
       CREATE POSTER SLIDES
    ================================================= */

    promotionPosters.forEach(
        function(
            promotion,
            index
        ){

            if(
                !promotion.poster_url
            ){

                return;

            }


            const slide =
                document.createElement(
                    "div"
                );


            slide.className =
                "poster-slide";


            const img =
                document.createElement(
                    "img"
                );


            img.src =
                promotion.poster_url;


            img.alt =
                promotion.category
                    ? promotion.category +
                      " promotion"
                    : "Pyncode Promotion";


            img.loading =
                index === 0
                    ? "eager"
                    : "lazy";


            img.decoding =
                "async";


            /*
               Prevent broken image
               from disturbing layout.
            */

            img.onerror =
                function(){

                    slide.remove();

                };


            slide.appendChild(
                img
            );


            posterTrack.appendChild(
                slide
            );



            /* =========================================
               DOT
            ========================================== */

            const dot =
                document.createElement(
                    "button"
                );


            dot.type =
                "button";


            dot.className =
                "poster-dot";


            dot.setAttribute(
                "aria-label",
                "Show promotion " +
                (index + 1)
            );


            if(index === 0){

                dot.classList.add(
                    "active"
                );

            }


            dot.addEventListener(
                "click",
                function(){

                    goToPoster(
                        index
                    );

                    startPosterAutoSlide();

                }
            );


            posterDots.appendChild(
                dot
            );

        }
    );



    /* =================================================
       BUTTON VISIBILITY
    ================================================= */

    if(
        promotionPosters.length <= 1
    ){

        posterPrev.style.display =
            "none";


        posterNext.style.display =
            "none";

    }

    else{

        posterPrev.style.display =
            "flex";


        posterNext.style.display =
            "flex";

    }



    /* =================================================
       START AUTO SLIDE
    ================================================= */

    startPosterAutoSlide();

}



/* =====================================================
   GO TO POSTER
===================================================== */

function goToPoster(index){

    if(
        !promotionPosters ||
        promotionPosters.length === 0
    ){

        return;

    }


    currentPoster =
        index;


    if(
        currentPoster < 0
    ){

        currentPoster =
            promotionPosters.length - 1;

    }


    if(
        currentPoster >=
        promotionPosters.length
    ){

        currentPoster =
            0;

    }


    posterTrack.style.transform =
        "translateX(-" +
        (
            currentPoster * 100
        ) +
        "%)";


    const dots =
        document.querySelectorAll(
            ".poster-dot"
        );


    dots.forEach(
        function(
            dot,
            index
        ){

            dot.classList.toggle(
                "active",
                index === currentPoster
            );

        }
    );

}



/* =====================================================
   NEXT
===================================================== */

function nextPoster(){

    if(
        !promotionPosters ||
        promotionPosters.length <= 1
    ){

        return;

    }


    goToPoster(
        currentPoster + 1
    );

}



/* =====================================================
   PREVIOUS
===================================================== */

function previousPoster(){

    if(
        !promotionPosters ||
        promotionPosters.length <= 1
    ){

        return;

    }


    goToPoster(
        currentPoster - 1
    );

}



/* =====================================================
   BUTTON EVENTS
===================================================== */

posterNext.addEventListener(
    "click",
    function(){

        nextPoster();

        startPosterAutoSlide();

    }
);


posterPrev.addEventListener(
    "click",
    function(){

        previousPoster();

        startPosterAutoSlide();

    }
);



/* =====================================================
   AUTO SLIDE
===================================================== */

function startPosterAutoSlide(){

    clearInterval(
        posterTimer
    );


    if(
        !promotionPosters ||
        promotionPosters.length <= 1
    ){

        return;

    }


    posterTimer =
        setInterval(
            function(){

                nextPoster();

            },
            4500
        );

}

    /* =====================================================
   MOBILE SWIPE
===================================================== */

let touchStartX = 0;

let touchEndX = 0;


posterCarousel.addEventListener(
    "touchstart",
    function(event){

        touchStartX =
            event.changedTouches[0]
                .screenX;

    },
    {
        passive:true
    }
);


posterCarousel.addEventListener(
    "touchend",
    function(event){

        touchEndX =
            event.changedTouches[0]
                .screenX;


        const difference =
            touchStartX -
            touchEndX;


        if(
            Math.abs(difference) < 45
        ){

            return;

        }


        if(
            difference > 0
        ){

            nextPoster();

        }

        else{

            previousPoster();

        }


        startPosterAutoSlide();

    },
    {
        passive:true
    }
);



/* =====================================================
   PAUSE AUTO SLIDE WHILE TOUCHING
===================================================== */

posterCarousel.addEventListener(
    "touchstart",
    function(){

        clearInterval(
            posterTimer
        );

    },
    {
        passive:true
    }
);



/* =====================================================
   5 TAP ADMIN LOGIN
===================================================== */

let promotionTapCount = 0;

let promotionTapTimer = null;


const promotionAdminTrigger =
    document.getElementById(
        "promotionAdminTrigger"
    );


if(
    promotionAdminTrigger
){

    promotionAdminTrigger.addEventListener(
        "click",
        function(){

            promotionTapCount++;


            clearTimeout(
                promotionTapTimer
            );


            promotionTapTimer =
                setTimeout(
                    function(){

                        promotionTapCount =
                            0;

                    },
                    2000
                );


            if(
                promotionTapCount >= 5
            ){

                promotionTapCount =
                    0;


                window.location.href =
                    "promotion-admin-login.html";

            }

        }
    );

}



/* =====================================================
   INITIAL LOAD
===================================================== */

loadPromotionPosters();


</script>
