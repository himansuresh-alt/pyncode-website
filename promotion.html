let categoryAutoTimer =
    null;


let categoryUserTouching =
    false;


let categoryUserInteracting =
    false;


/* =====================================================
   START CATEGORY AUTO SCROLL
===================================================== */

function startCategoryAutoScroll(){

    if(!categoryGrid){

        return;

    }


    clearInterval(
        categoryAutoTimer
    );


    categoryAutoTimer =
        setInterval(
            function(){

                if(
                    categoryUserTouching ||
                    categoryUserInteracting
                ){

                    return;

                }


                const maxScroll =
                    categoryGrid.scrollWidth -
                    categoryGrid.clientWidth;


                if(
                    maxScroll <= 5
                ){

                    return;

                }


                const current =
                    categoryGrid.scrollLeft;


                const step =
                    window.innerWidth <= 360
                        ? 163
                        : 187;


                const next =
                    current + step;


                if(
                    next >=
                    maxScroll - 5
                ){

                    categoryGrid.scrollTo({

                        left:0,

                        behavior:"smooth"

                    });

                }

                else{

                    categoryGrid.scrollTo({

                        left:next,

                        behavior:"smooth"

                    });

                }

            },

            2300
        );

}


/* =====================================================
   STOP CATEGORY AUTO SCROLL
===================================================== */

function stopCategoryAutoScroll(){

    clearInterval(
        categoryAutoTimer
    );

}

/* =====================================================
   PROMOTION DATA

let promotionPosters = [];


/* =====================================================
   NORMALIZE CATEGORY
===================================================== */

function normalizeCategory(
    value
){

    if(
        value === null ||
        value === undefined
    ){

        return "";

    }


    return String(value)
        .trim()
        .replace(/\s+/g," ")
        .toLowerCase();

}


/* =====================================================
   CATEGORY DISPLAY NAME
===================================================== */

function getCategoryDisplayName(
    promotionCategory
){

    const normalized =
        normalizeCategory(
            promotionCategory
        );


    if(!normalized){

        return "Other Promotions";

    }


    for(
        const category
        of categories
    ){

        if(
            normalizeCategory(
                category[1]
            ) === normalized
        ){

            return category[1];

        }

    }


    return String(
        promotionCategory
    ).trim();

}


/* =====================================================
   CATEGORY ICON
===================================================== */

function getCategoryIcon(
    categoryName
){

    return (
        categoryIconMap.get(
            categoryName
        )
        ||
        "📢"
    );

}


/* =====================================================
   DATE FORMAT
===================================================== */

function formatPromotionDate(
    dateValue
){

    if(!dateValue){

        return "";

    }


    const date =
        new Date(
            dateValue
        );


    if(
        Number.isNaN(
            date.getTime()
        )
    ){

        return "";

    }


    return date.toLocaleDateString(
        "en-IN",
        {
            day:"2-digit",
            month:"short",
            year:"numeric"
        }
    );

}


/* =====================================================
   LOAD LIVE PROMOTIONS
===================================================== */

async function loadPromotionPosters(){

    if(posterCount){

        posterCount.textContent =
            "Loading...";

    }


    try{

        const {
            data,
            error
        } =
            await supabaseClient

                .from(
                    "promotions"
                )

                .select(
                    "id, category, pincode, poster_url, is_active, created_at"
                )

                .eq(
                    "is_active",
                    true
                )

                .order(
                    "created_at",
                    {
                        ascending:false
                    }
                );


        if(error){

            console.error(
                "Promotion loading error:",
                error
            );


            promotionPosters =
                [];


            renderPromotionFeed();


            return;

        }


        promotionPosters =
            Array.isArray(data)
                ? data.filter(
                    function(item){

                        return (
                            item &&
                            item.poster_url
                        );

                    }
                )
                : [];


        renderPromotionFeed();

    }

    catch(error){

        console.error(
            "Promotion fetch error:",
            error
        );


        promotionPosters =
            [];


        renderPromotionFeed();

    }

}

   RENDER COMPLETE PROMOTION FEED
===================================================== */

function renderPromotionFeed(){

    renderAllPromotions();

    renderCategoryPosterFeed();

}


/* =====================================================
   RENDER ALL PROMOTIONS
===================================================== */

function renderAllPromotions(){

    if(!allPosterRow){

        return;

    }


    allPosterRow.innerHTML =
        "";


    if(
        !promotionPosters ||
        promotionPosters.length === 0
    ){

        allPosterRow.innerHTML = `

            <div class="all-poster-empty">

                <div class="all-poster-empty-icon">
                    📢
                </div>

                <strong>
                    No Promotions Available
                </strong>

                <span>
                    New business promotions will appear here.
                </span>

            </div>

        `;


        if(posterCount){

            posterCount.textContent =
                "0 Promotions";

        }


        return;

    }


    if(posterCount){

        posterCount.textContent =
            promotionPosters.length +
            (
                promotionPosters.length === 1
                    ? " Promotion"
                    : " Promotions"
            );

    }


    /*
       IMPORTANT:

       All active posters are shown here.
       Category does NOT matter.

       Example:

       Real Estate poster
       Mobile Showroom poster
       Jewellery poster
       Restaurant poster

       Everything appears in All Promotions.
    */

    promotionPosters.forEach(
        function(
            promotion,
            index
        ){

            const card =
                createPosterCard(
                    promotion,
                    index
                );


            allPosterRow.appendChild(
                card
            );

        }
    );


    /*
       Setup auto swipe after
       browser calculates widths.
    */

    requestAnimationFrame(
        function(){

            setupAllPosterAutoScroll();

        }
    );

}


/* =====================================================
   GROUP PROMOTIONS BY CATEGORY
===================================================== */

function groupPromotionsByCategory(){

    const groups =
        new Map();


    promotionPosters.forEach(
        function(promotion){

            if(
                !promotion ||
                !promotion.poster_url
            ){

                return;

            }


            const displayName =
                getCategoryDisplayName(
                    promotion.category
                );


            const key =
                normalizeCategory(
                    displayName
                );


            if(
                !groups.has(key)
            ){

                groups.set(
                    key,
                    {
                        name:
                            displayName,

                        icon:
                            getCategoryIcon(
                                displayName
                            ),

                        posters:[]
                    }
                );

            }


            groups
                .get(key)
                .posters
                .push(
                    promotion
                );

        }
    );


    return Array.from(
        groups.values()
    );

}

   RENDER CATEGORY POSTER FEED

function renderCategoryPosterFeed(){

    if(!categoryPosterFeed){

        return;

    categoryPosterFeed.innerHTML =

    const groups =
        groupPromotionsByCategory();


    if(
        groups.length === 0
    ){

    groups.forEach(

            const section =

                    group

            categoryPosterFeed.appendChild(
                section

        }
    );

}


/* =====================================================
   CREATE CATEGORY POSTER SECTION
===================================================== */

function createCategoryPosterSection(
    group
){

    const section =
        document.createElement(
            "section"
        );


    section.className =
        "poster-category-section";


    const header =
        document.createElement(
            "div"
        );


    header.className =
        "poster-category-header";


    const categoryName =
        document.createElement(
            "div"
        );


    categoryName.className =
        "poster-category-name";


    const icon =
        document.createElement(
            "div"
        );


    icon.className =
        "poster-category-icon";


    icon.textContent =
        group.icon;


    const title =
        document.createElement(
            "h2"
        );


    title.className =
        "poster-category-title";


    title.textContent =
        group.name;


    categoryName.appendChild(
        icon
    );


    categoryName.appendChild(
        title
    );


    const viewAll =
        document.createElement(
            "a"
        );


    viewAll.className =
        "poster-category-link";


    viewAll.href =
        "promotion-category.html?category=" +
        encodeURIComponent(
            group.name
        );


    viewAll.textContent =
        "See all →";


    header.appendChild(
        categoryName
    );


    header.appendChild(
        viewAll
    );


    const row =
        document.createElement(
            "div"
        );


    row.className =
        "poster-row";


    row.dataset.category =
        group.name;


    group.posters.forEach(
        function(
            promotion,
            index
        ){

            const card =
                createPosterCard(
                    promotion,
                    index
                );


            row.appendChild(
                card
            );

        }
    );


    section.appendChild(
        header
    );


    section.appendChild(
        row
    );


    return section;

}

  /* =====================================================
   CREATE POSTER CARD
===================================================== */

function createPosterCard(
    promotion,
    index
){

    const card =
        document.createElement(
            "article"
        );


    card.className =
        "poster-card";


    /*
       IMPORTANT:

       There is NO <a> tag here.

       So touching the image will NOT:
       - open image
       - open new tab
       - open poster URL

       User can simply swipe the poster row.

       "See all →" is the only clickable
       navigation for category posters.
    */


    const image =
        document.createElement(
            "img"
        );


    image.className =
        "poster-card-image";


    image.src =
        promotion.poster_url;


    image.alt =
        (
            promotion.category
                ? promotion.category
                : "Pyncode Promotion"
        ) +
        " poster";


    image.loading =
        index === 0
            ? "eager"
            : "lazy";


    image.decoding =
        "async";


    image.draggable =
        false;


    image.onerror =
        function(){

            card.remove();

        };


    card.appendChild(
        image
    );


    const footer =
        document.createElement(
            "div"
        );


    footer.className =
        "poster-card-footer";


    const category =
        document.createElement(
            "div"
        );


    category.className =
        "poster-card-category";


    category.textContent =
        getCategoryDisplayName(
            promotion.category
        );


    footer.appendChild(
        category
    );


    const dateText =
        formatPromotionDate(
            promotion.created_at
        );


    if(dateText){

        const date =
            document.createElement(
                "div"
            );


        date.className =
            "poster-card-date";


        date.textContent =
            dateText;


        footer.appendChild(
            date
        );

    }


    card.appendChild(
        footer
    );


    return card;

}


/* =====================================================

===================================================== */

let allPosterTimer =
    null;


let allPosterTouching =
    false;


let allPosterMouseInside =
    false;


/* =====================================================
   STOP ALL PROMOTIONS AUTO SCROLL
===================================================== */

function stopAllPosterAutoScroll(){

    clearInterval(
        allPosterTimer
    );


    allPosterTimer =
        null;

}


/* =====================================================
   SETUP ALL PROMOTIONS AUTO SCROLL
===================================================== */

function setupAllPosterAutoScroll(){

    if(!allPosterRow){

        return;

    }


    stopAllPosterAutoScroll();


    if(
        allPosterRow.scrollWidth <=
        allPosterRow.clientWidth + 5
    ){

        return;

    }


    allPosterRow.ontouchstart =
        function(){

            allPosterTouching =
                true;

            stopAllPosterAutoScroll();

        };


    allPosterRow.ontouchend =
        function(){

            allPosterTouching =
                false;


            setTimeout(
                function(){

                    setupAllPosterAutoScroll();

                },
                1000
            );

        };


    allPosterRow.ontouchcancel =
        function(){

            allPosterTouching =
                false;


            setTimeout(
                function(){

                    setupAllPosterAutoScroll();

                },
                1000
            );

        };


    allPosterRow.onmouseenter =
        function(){

            allPosterMouseInside =
                true;

        };


    allPosterRow.onmouseleave =
        function(){

            allPosterMouseInside =
                false;

        };


    allPosterTimer =
        setInterval(
            function(){

                if(
                    allPosterTouching ||
                    allPosterMouseInside
                ){

                    return;

                }


                const maxScroll =
                    allPosterRow.scrollWidth -
                    allPosterRow.clientWidth;


                if(
                    maxScroll <= 5
                ){

                    return;

                }


                const current =
                    allPosterRow.scrollLeft;


                const step =
                    window.innerWidth <= 360
                        ? 164
                        : 200;


                const next =
                    current + step;


                if(
                    next >=
                    maxScroll - 5
                ){

                    allPosterRow.scrollTo({

                        left:0,

                        behavior:"smooth"

                    });

                }

                else{

                    allPosterRow.scrollTo({

                        left:next,

                        behavior:"smooth"

                    });

                }

            },

            2800
        );

}


/* =====================================================
   CATEGORY POSTER ROW AUTO SCROLL
===================================================== */

let posterRowTimers =
    [];


/* =====================================================
   STOP CATEGORY POSTER TIMERS
===================================================== */

function stopPosterRowAutoScroll(){

    posterRowTimers.forEach(
        function(timer){

            clearInterval(
                timer
            );

        }
    );


    posterRowTimers =
        [];

}


/* =====================================================
   START CATEGORY POSTER AUTO SCROLL
===================================================== */

function setupPosterRowAutoScroll(){

    stopPosterRowAutoScroll();


    const rows =
        document.querySelectorAll(
            ".poster-row"
        );


    rows.forEach(
        function(row){

            if(
                row.scrollWidth <=
                row.clientWidth + 5
            ){

                return;

            }


            let userTouching =
                false;


            let mouseInside =
                false;


            row.addEventListener(
                "touchstart",
                function(){

                    userTouching =
                        true;

                },
                {
                    passive:true
                }
            );


            row.addEventListener(
                "touchend",
                function(){

                    userTouching =
                        false;

                },
                {
                    passive:true
                }
            );


            row.addEventListener(
                "touchcancel",
                function(){

                    userTouching =
                        false;

                },
                {
                    passive:true
                }
            );


            row.addEventListener(
                "mouseenter",
                function(){

                    mouseInside =
                        true;

                }
            );


            row.addEventListener(
                "mouseleave",
                function(){

                    mouseInside =
                        false;

                }
            );


            const timer =
                setInterval(
                    function(){

                        if(
                            userTouching ||
                            mouseInside
                        ){

                            return;

                        }


                        const maxScroll =
                            row.scrollWidth -
                            row.clientWidth;


                        if(
                            maxScroll <= 5
                        ){

                            return;

                        }


                        const current =
                            row.scrollLeft;


                        const step =
                            window.innerWidth <= 360
                                ? 164
                                : 200;


                        const next =
                            current + step;


                        if(
                            next >=
                            maxScroll - 5
                        ){

                            row.scrollTo({

                                left:0,

                                behavior:"smooth"

                            });

                        }

                        else{

                            row.scrollTo({

                                left:next,

                                behavior:"smooth"

                            });

                        }

                    },

                    2800
                );


            posterRowTimers.push(
                timer
            );

        }
    );

}
