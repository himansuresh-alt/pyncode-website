<html lang="en">

<head>

<meta charset="UTF-8">

Pyncode Local - Post Details

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:
        -apple-system,

        "Segoe UI",

}

button,
input,
textarea{

}

button{
    cursor:pointer;
}

.page{
    min-height:100vh;
}

.topbar{
    position:sticky;
    top:0;
    z-index:1000;

    height:74px;

    display:flex;
    align-items:center;

    padding:0 18px;

    background:rgba(
        255,
        255,
        255,

    border-bottom:
        1px solid #eeeeee;

}

.topbar-inner{
    width:100%;
    max-width:760px;
    margin:0 auto;

    display:flex;
    align-items:center;
    justify-content:space-between;
}

.back-button{
    width:48px;
    height:48px;

    border:0;
    border-radius:16px;

    background:#fff4ee;

    color:#ef5b3f;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:22px;

    transition:

}

.back-button:active{

}

.page-title{
    position:absolute;
    left:50%;
    transform:translateX(-50%);

    font-size:20px;

}

.header-spacer{
    width:48px;
    height:48px;
}

main{
    width:100%;
    max-width:760px;

        18px
        100px;
}

.loading-box{
    min-height:
        calc(100vh - 180px);

    display:flex;
    flex-direction:column;

    align-items:center;
    justify-content:center;

    gap:16px;

    color:#777;

    font-size:16px;
}

.spinner{
    width:58px;
    height:58px;

    border-radius:50%;

    border:
        6px solid #ffe2d8;

    border-top-color:#ef5b3f;

    animation:
        spin .8s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);

.empty-box{
    display:none;

    margin-top:40px;

    padding:34px 24px;

    text-align:center;

    background:#ffffff;

    border:
        1px solid #eeeeee;

    border-radius:24px;

}

.empty-title{

    font-weight:800;

}

.empty-text{
    color:#777;

}

.empty-button{
    margin-top:20px;

    border:0;

    border-radius:14px;

    padding:13px 20px;

    background:#ef5b3f;
    color:#fff;

    font-weight:700;
}

#postContainer{
    display:none;
}

.post-card{
    background:#ffffff;

    border:
        1px solid #eeeeee;

    border-radius:24px;

    overflow:hidden;

    box-shadow:
        0 12px 35px
        rgba(0,0,0,.06);
}

.post-image-wrap{
    width:100%;

    background:#f3f3f3;

    position:relative;
}

.post-image{
    display:block;

    width:100%;

    max-height:520px;

    object-fit:cover;
}

.post-image-placeholder{
    min-height:240px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        linear-gradient(

            #fff1eb,

}

}

    display:inline-flex;

    align-items:center;

}

.post-title{

}

}

.price-box{

}

.price-label{

}

.price-value{

}

.meta-grid{
    display:grid;

    gap:10px;

}

.meta-item{

    background:#fafafa;

}

.meta-label{
    display:block;

}

}

.location-box{

    padding:15px;

    border-radius:17px;

}

.location-title{

}

.location-text{

}

.seller-title{

}

.seller-name{

.status-box{

.status-box.error{

.action-area{

.main-action{

    background:#ef5b3f;

    font-size:16px;

}

.secondary-button{

<body>

            or may no longer be available.

        </button>

        id="postContainer"
    ></section>

</main>

<script>

"use strict";

/* ==========================================
   SUPABASE CONFIG
   ========================================== */

const SUPABASE_URL =
    "https://mtuspuehsxsjoaxoenen.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_JpopjwDVjFvsDjXeG_56NQ_k3nA2mU6";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY,
        {
            auth: {
                persistSession: true,
                autoRefreshToken: true,
                detectSessionInUrl: true,
                storageKey: "pyncode-local-auth"
            }
        }
    );


/* ==========================================
   API CONFIG
   ========================================== */

const PUBLIC_API =
    SUPABASE_URL +
    "/functions/v1/pyncode-local-public";


const CONFIG = {

    homePage:
        "index.html",

    accountPage:
        "current-account.html",

    bookingPage:
        "current-booking.html",

    postDetailsPage:
        "current-post-details.html"

};


/* ==========================================
   DOM
   ========================================== */

const loadingBox =
    document.getElementById(
        "loadingBox"
    );

const emptyBox =
    document.getElementById(
        "emptyBox"
    );

const postContainer =
    document.getElementById(
        "postContainer"
    );

const statusBox =
    document.getElementById(
        "statusBox"
    );

const backButton =
    document.getElementById(
        "backButton"
    );

const emptyHomeButton =
    document.getElementById(
        "emptyHomeButton"
    );


/* ==========================================
   STATE
   ========================================== */

let currentPost =
    null;

let currentUser =
    null;

let actionLocked =
    false;


/* ==========================================
   STATUS
   ========================================== */

function setStatus(
    message,
    type
){

    if(!statusBox){
        return;
    }

    statusBox.textContent =
        message || "";

    statusBox.className =
        "status-box";

    if(message){
        statusBox.classList.add(
            "show"
        );
    }

    if(
        type === "success" ||
        type === "error"
    ){

        statusBox.classList.add(
            type
        );

    }

}


/* ==========================================
   HTML ESCAPE
   ========================================== */

function escapeHtml(
    value
){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* ==========================================
   GET URL POST ID
   ========================================== */

function getPostId(){

    const params =
        new URLSearchParams(
            window.location.search
        );

    return params.get(
        "id"
    ) || params.get(
        "post_id"
    );

}


/* ==========================================
   LOCATION
   ========================================== */

function getUserLocation(){

    return new Promise(
        function(resolve){

            try{

                const saved =
                    localStorage.getItem(
                        "pyncode_local_location"
                    );

                if(saved){

                    const location =
                        JSON.parse(saved);

                    const latitude =
                        Number(
                            location.latitude
                        );

                    const longitude =
                        Number(
                            location.longitude
                        );

                    if(
                        Number.isFinite(latitude) &&
                        Number.isFinite(longitude)
                    ){

                        resolve({

                            latitude:
                                latitude,

                            longitude:
                                longitude

                        });

                        return;

                    }

                }

            }catch(error){

                console.warn(
                    "Saved location error:",
                    error
                );

            }


            if(
                !navigator.geolocation
            ){

                resolve(null);

                return;

            }

            navigator.geolocation.getCurrentPosition(

                function(position){

                    resolve({

                        latitude:
                            Number(
                                position.coords.latitude
                            ),

                        longitude:
                            Number(
                                position.coords.longitude
                            )

                    });

                },

                function(){

                    resolve(null);

                },

                {
                    enableHighAccuracy:true,

                    timeout:10000,

                    maximumAge:300000

                }

            );

        }
    );

}


/* ==========================================
   GET CURRENT USER
   ========================================== */

async function getCurrentUser(){

    try{

        const {
            data,
            error
        } =
        await supabaseClient
            .auth
            .getSession();

        if(error){

            console.error(
                "Supabase session error:",
                error
            );

            return null;

        }

        return (
            data &&
            data.session &&
            data.session.user
        ) || null;

    }catch(error){

        console.error(
            "Supabase user error:",
            error
        );

        return null;

    }

}

/* ==========================================
   FETCH POST
   ========================================== */

async function findPost(
    postId
){

    if(
        postId === null ||
        postId === undefined ||
        postId === ""
    ){

        return null;

    }


    try{

        /*
         * Directly get the post from Supabase RPC.
         * Location is NOT required here.
         */

        const {
            data,
            error
        } = await supabaseClient
            .rpc(
                "pyncode_local_get_post_by_id",
                {
                    p_post_id:
                        Number(postId)
                }
            );


        if(error){

            console.error(
                "Post RPC error:",
                error
            );

            setStatus(
                error.message ||
                "Unable to load this post.",
                "error"
            );

            return null;

        }


        return data || null;


    }catch(error){

        console.error(
            "Post fetch error:",
            error
        );

        setStatus(
            "Unable to load this post. Please try again.",
            "error"
        );

        return null;

    }

}


  /* ==========================================
   DATE HELPERS
   ========================================== */

function isPostExpired(
    post
){

    if(
        !post ||
        !post.expires_at
    ){

        return false;

    }

    const expiry =
        new Date(
            post.expires_at
        ).getTime();

    if(
        !Number.isFinite(
            expiry
        )
    ){

        return false;

    }

    return (
        expiry <= Date.now()
    );

}


function isPostAvailable(
    post
){

    if(!post){

        return false;

    }

    if(
        post.status &&
        String(
            post.status
        ).toLowerCase() !==
        "published"
    ){

        return false;

    }

    if(
        isPostExpired(
            post
        )
    ){

        return false;

    }

    return true;

}


/* ==========================================
   POST OWNER CHECK
   ========================================== */

function isPostOwner(
    post
){

    if(
        !post ||
        !currentUser
    ){

        return false;

    }

    if(
        !post.user_id ||
        !currentUser.id
    ){

        return false;

    }

    return (
        String(
            post.user_id
        ) ===
        String(
            currentUser.id
        )
    );

}


/* ==========================================
   ACTION SAFETY
   ========================================== */

function canInteractWithPost(
    post
){

    if(!post){

        return {
            allowed:false,
            message:
                "Post information is missing."
        };

    }

    if(
        post.status &&
        String(
            post.status
        ).toLowerCase() !==
        "published"
    ){

        return {
            allowed:false,
            message:
                "This post is currently unavailable."
        };

    }

    if(
        isPostExpired(
            post
        )
    ){

        return {
            allowed:false,
            message:
                "This post has expired."
        };

    }

    if(
        isPostOwner(
            post
        )
    ){

        return {
            allowed:false,
            message:
                "You cannot request your own post."
        };

    }

    return {
        allowed:true,
        message:""
    };

}


/* ==========================================
   ACTION LABEL
   ========================================== */

function getActionLabel(
    action
){

    const value =
        String(
            action || "enquire"
        ).toLowerCase();

    if(
        value === "order"
    ){

        return "Order Now";

    }

    if(
        value === "book"
    ){

        return "Book Now";

    }

    if(
        value === "apply"
    ){

        return "Apply Now";

    }

    if(
        value === "contact"
    ){

        return "Contact";

    }

    return "Send Enquiry";

}


/* ==========================================
   FORMAT PRICE
   ========================================== */

function formatPrice(
    price
){

    if(
        price === null ||
        price === undefined ||
        price === ""
    ){

        return "";

    }

    const numeric =
        Number(
            price
        );

    if(
        !Number.isFinite(
            numeric
        )
    ){

        return String(
            price
        );

    }

    return new Intl.NumberFormat(
        "en-IN",
        {
            style:"currency",
            currency:"INR",
            maximumFractionDigits:2
        }
    ).format(
        numeric
    );

}


/* ==========================================
   FORMAT DATE
   ========================================== */

function formatDate(
    value
){

    if(!value){

        return "";

    }

    const date =
        new Date(
            value
        );

    if(
        Number.isNaN(
            date.getTime()
        )
    ){

        return "";

    }

    return date.toLocaleDateString(
        "en-IN",
        {
            day:"numeric",
            month:"short",
            year:"numeric"
        }
    );

}


/* ==========================================
   CATEGORY LABEL
   ========================================== */

function formatCategory(
    category
){

    const value =
        String(
            category || ""
        )
        .trim();

    if(!value){

        return "Local";

    }

    return value
        .replace(
            /[_-]+/g,
            " "
        )
        .replace(
            /\b\w/g,
            function(letter){
                return letter.toUpperCase();
            }
        );

}


/* ==========================================
   IMAGE CHECK
   ========================================== */

function hasValidImage(
    post
){

    return !!(
        post &&
        post.image_url &&
        String(
            post.image_url
        ).trim()
    );

}


/* ==========================================
   LOCATION TEXT
   ========================================== */

function getLocationText(
    post
){

    if(!post){

        return "Local area";

    }

    const parts = [];

    if(post.area){

        parts.push(
            String(
                post.area
            )
        );

    }

    if(
        post.city &&
        String(
            post.city
        ) !==
        String(
            post.area || ""
        )
    ){

        parts.push(
            String(
                post.city
            )
        );

    }

    if(
        post.pincode
    ){

        parts.push(
            String(
                post.pincode
            )
        );

    }

    if(!parts.length){

        if(
            post.public_location
        ){

            return String(
                post.public_location
            );

        }

        return "Local area";

    }

    return parts.join(
        ", "
    );

}


/* ==========================================
   DISTANCE TEXT
   ========================================== */

function getDistanceText(
    post
){

    if(
        !post ||
        post.distance_km === null ||
        post.distance_km === undefined
    ){

        return "";

    }

    const distance =
        Number(
            post.distance_km
        );

    if(
        !Number.isFinite(
            distance
        )
    ){

        return "";

    }

    if(
        distance < 1
    ){

        return (
            Math.round(
                distance * 1000
            ) +
            " m away"
        );

    }

    return (
        distance.toFixed(1) +
        " km away"
    );

}


/* ==========================================
   POST IMAGE HTML
   ========================================== */

function getPostImageHtml(
    post
){

    if(
        hasValidImage(
            post
        )
    ){

        return `
            <div class="post-image-wrap">

                <img
                    class="post-image"
                    src="${escapeHtml(post.image_url)}"
                    alt="${escapeHtml(post.title || "Local post")}"
                    loading="eager"
                    onerror="
                        this.style.display='none';
                        this.nextElementSibling.style.display='flex';
                    "
                >

                <div
                    class="post-image-placeholder"
                    style="display:none;"
                >
                    📍
                </div>

            </div>
        `;

    }

    return `
        <div class="post-image-wrap">

            <div class="post-image-placeholder">
                📍
            </div>

        </div>
    `;

}


/* ==========================================
   RENDER POST
   ========================================== */

function renderPost(
    post
){

    if(!post){

        return;

    }

    const category =
        formatCategory(
            post.category
        );

    const title =
        escapeHtml(
            post.title ||
            "Local Post"
        );

    const description =
        escapeHtml(
            post.description ||
            ""
        );

    const location =
        escapeHtml(
            getLocationText(
                post
            )
        );

    const distance =
        getDistanceText(
            post
        );

    const actionLabel =
        getActionLabel(
            post.action_type
        );

    const price =
        formatPrice(

/* ==========================================
   UPDATE ACTION BUTTON
   ========================================== */

function updateActionState(){

    if(!currentPost){

        return;

    }

    const button =
        document.getElementById(
            "mainActionButton"
        );

    if(!button){

        return;

    }

    const result =
        canInteractWithPost(
            currentPost
        );

    if(
        !result.allowed
    ){

        button.disabled =
            true;

        button.textContent =
            result.message;

        return;

    }

    button.disabled =
        false;

    button.textContent =
        getActionLabel(
            currentPost.action_type
        );

}


/* ==========================================
   ATTACH POST ACTIONS
   ========================================== */

function attachPostActions(){

    const mainActionButton =
        document.getElementById(
            "mainActionButton"
        );

    const shareButton =
        document.getElementById(
            "shareButton"
        );

    const homeActionButton =
        document.getElementById(
            "homeActionButton"
        );


    if(
        mainActionButton
    ){

        mainActionButton.onclick =
            handleMainAction;

    }


    if(
        shareButton
    ){

        shareButton.onclick =
            sharePost;

    }


    if(
        homeActionButton
    ){

        homeActionButton.onclick =
            goHome;

    }

}

  /* ==========================================
   MAIN ACTION
   ========================================== */

async function handleMainAction(){

    if(actionLocked){

        return;

    }

    if(!currentPost){

        setStatus(
            "This post is not available.",
            "error"
        );

        return;

    }

    const result =
        canInteractWithPost(
            currentPost
        );

    if(
        !result.allowed
    ){

        setStatus(
            result.message,
            "error"
        );

        return;

    }

    actionLocked =
        true;

    const button =
        document.getElementById(
            "mainActionButton"
        );

    if(button){

        button.disabled =
            true;

    }

    try{

        const action =
            String(
                currentPost.action_type ||
                "enquire"
            ).toLowerCase();

        /*
         * ORDER / BOOK / ENQUIRE /
         * APPLY / CONTACT
         *
         * All customer actions now use
         * the simple guest customer request
         * flow.
         *
         * Existing booking function is kept
         * below and is NOT deleted.
         */

        const postId =
            currentPost.id;

        window.location.href =
            "current-customer-request.html" +
            "?post_id=" +
            encodeURIComponent(
                String(postId)
            ) +
            "&action=" +
            encodeURIComponent(
                action
            );

    }finally{

        actionLocked =
            false;

        updateActionState();

    }

}


/* ==========================================
   OPEN BOOKING PAGE
   ========================================== */

async function openBookingPage(){

    const postId =
        currentPost &&
        currentPost.id;

    if(
        postId === null ||
        postId === undefined ||
        postId === ""
    ){

        setStatus(
            "Post information is missing.",
            "error"
        );

        return;

    }

    currentUser =
        await getCurrentUser();

    if(!currentUser){

        setStatus(
            "Please login to continue.",
            "error"
        );

        setTimeout(
            function(){

                window.location.href =
                    CONFIG.accountPage;

            },
            700
        );

        return;

    }

    /*
     * Backup post ID.
     * This helps booking page recover
     * the selected post even if the URL
     * query is lost.
     */

    sessionStorage.setItem(
        "pyncode_booking_post_id",
        String(postId)
    );

    window.location.href =
        CONFIG.bookingPage +
        "?post_id=" +
        encodeURIComponent(
            String(postId)
        );

}


/* ==========================================
   SHARE POST
   ========================================== */

async function sharePost(){

    if(!currentPost){

        return;

    }

    const shareUrl =
        window.location.href;

    const shareTitle =
        currentPost.title ||
        "Pyncode Local Post";

    const shareText =
        "Check this local post on Pyncode.in";

    try{

        if(
            navigator.share
        ){

            await navigator.share({

                title:
                    shareTitle,

                text:
                    shareText,

                url:
                    shareUrl

            });

            return;

        }

        if(
            navigator.clipboard &&
            navigator.clipboard.writeText
        ){

            await navigator.clipboard.writeText(
                shareUrl
            );

            setStatus(
                "Post link copied.",
                "success"
            );

            return;

        }

        setStatus(
            shareUrl,
            "success"
        );

    }catch(error){

        if(
            error &&
            error.name ===
            "AbortError"
        ){

            return;

        }

        console.error(
            "Share error:",
            error
        );

        setStatus(
            "Unable to share this post.",
            "error"
        );

    }

}


/* ==========================================
   GO HOME
   ========================================== */

function goHome(){

    window.location.href =
        CONFIG.homePage;

}


/* ==========================================
   BACK BUTTON
   ========================================== */

if(backButton){

    backButton.onclick =
        function(){

            if(
                window.history.length > 1
            ){

                window.history.back();

                return;

            }

            goHome();

        };

}


/* ==========================================
   EMPTY HOME BUTTON
   ========================================== */

if(emptyHomeButton){

    emptyHomeButton.onclick =
        goHome;

}


/* ==========================================
   INITIALISE POST DETAILS
   ========================================== */

async function initialisePage(){

    loadingBox.style.display =
        "flex";

    emptyBox.style.display =
        "none";

    postContainer.style.display =
        "none";

    setStatus(
        "",
        ""
    );

    const postId =
        getPostId();

    if(
        postId === null ||
        postId === undefined ||
        postId === ""
    ){

        loadingBox.style.display =
            "none";

        emptyBox.style.display =
            "block";

        setStatus(
            "Post information is missing.",
            "error"
        );

        return;

    }

    try{

        currentUser =
            await getCurrentUser();

        const post =
            await findPost(
                postId
            );

        if(!post){

            loadingBox.style.display =
                "none";

            emptyBox.style.display =
                "block";

            return;

        }

        if(
            !isPostAvailable(
                post
            )
        ){

            loadingBox.style.display =
                "none";

            emptyBox.style.display =
                "block";

            setStatus(
                "This post is no longer available.",
                "error"
            );

            return;

        }

        currentPost =
            post;

        renderPost(
            post
        );

        loadingBox.style.display =
            "none";

        emptyBox.style.display =
            "none";

        postContainer.style.display =
            "block";

        updateActionState();

        attachPostActions();

    }catch(error){

        console.error(
            "Post details error:",
            error
        );

        loadingBox.style.display =
            "none";

        emptyBox.style.display =
            "block";

        setStatus(
            "Unable to load this post. Please try again.",
            "error"
        );

    }

}


/* ==========================================
   DOM READY
   ========================================== */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        initialisePage();

    }
);

</script>
