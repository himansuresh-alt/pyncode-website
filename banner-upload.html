/* =====================================================
   RESET
===================================================== */

/* =====================================================
   HEADER
===================================================== */

}

   MAIN
===================================================== */

===================================================== */

.field-group label{

===================================================== */

/* =====================================================

===================================================== */

.select-btn{

/* =====================================================
   PREVIEW
===================================================== */

.preview img{

<script>

  /* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://mtuspuehsxsjoaxoenen.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_JpopjwDVjFvsDjXeG_56NQ_k3nA2mU6";

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =====================================================
   SETTINGS
===================================================== */

const BUCKET =
    "banners";

const TABLE =
    "banners";


/* =====================================================
   ELEMENTS
===================================================== */

const input =
    document.getElementById(
        "bannerInput"
    );

const preview =
    document.getElementById(
        "preview"
    );

const previewImage =
    document.getElementById(
        "previewImage"
    );

const fileName =
    document.getElementById(
        "fileName"
    );

const uploadBtn =
    document.getElementById(
        "uploadBtn"
    );

const message =
    document.getElementById(
        "message"
    );

const logoutButton =
    document.getElementById(
        "logoutButton"
    );

const categoryInput =
    document.getElementById(
        "category"
    );

const pincodeInput =
    document.getElementById(
        "pincode"
    );


/* =====================================================
   ADMIN SESSION CHECK
===================================================== */

async function checkAdmin(){

    try{

        const {
            data,
            error
        } =
        await supabaseClient
            .auth
            .getUser();


        if(
            error ||
            !data ||
            !data.user
        ){

            window.location.replace(
                "admin-login.html"
            );

            return;

        }

    }
    catch(error){

        console.error(
            "ADMIN CHECK ERROR:",
            error
        );

        window.location.replace(
            "admin-login.html"
        );

    }

}


/* =====================================================
   DASHBOARD
===================================================== */

function goDashboard(){

    window.location.href =
        "admin-dashboard.html";

}


/* =====================================================
   LOGOUT
===================================================== */

logoutButton.addEventListener(
    "click",
    async function(){

        logoutButton.disabled =
            true;

        logoutButton.textContent =
            "Logging out...";


        const {
            error
        } =
        await supabaseClient
            .auth
            .signOut();


        if(error){

            console.error(
                "LOGOUT ERROR:",
                error
            );

            alert(
                "Unable to logout. Please try again."
            );

            logoutButton.disabled =
                false;

            logoutButton.textContent =
                "Logout";

            return;

        }


        window.location.replace(
            "admin-login.html"
        );

    }
);


/* =====================================================
   PINCODE INPUT
   NUMBERS ONLY
===================================================== */

pincodeInput.addEventListener(
    "input",
    function(){

        this.value =
            this.value
                .replace(/\D/g,"")
                .slice(0,6);

    }
);


/* =====================================================
   SELECT IMAGE
===================================================== */

input.addEventListener(
    "change",
    function(){

        const file =
            input.files[0];


        message.className =
            "message";

        message.textContent =
            "";


        if(!file){

            preview.style.display =
                "none";

            return;

        }


        if(
            !file.type.startsWith(
                "image/"
            )
        ){

            showMessage(
                "Please select an image.",
                "error"
            );

            input.value = "";

            return;

        }


        previewImage.src =
            URL.createObjectURL(
                file
            );


        fileName.textContent =
            file.name;


        preview.style.display =
            "block";

    }
);


/* =====================================================
   UPLOAD BANNER
===================================================== */

uploadBtn.addEventListener(
    "click",
    async function(){

        const file =
            input.files[0];


        /* ---------------------------------------------
           FILE CHECK
        --------------------------------------------- */

        if(!file){

            showMessage(
                "Please select an image.",
                "error"
            );

            return;

        }


        /* ---------------------------------------------
           CATEGORY
        --------------------------------------------- */

        const category =
            categoryInput.value.trim();


        if(!category){

            showMessage(
                "Please select a category.",
                "error"
            );

            return;

        }


        /* ---------------------------------------------
           PINCODE
        --------------------------------------------- */

        const pincode =
            pincodeInput.value.trim();


        if(!/^\d{6}$/.test(pincode)){

            showMessage(
                "Please enter a valid 6 digit pincode.",
                "error"
            );

            return;

        }


        /* ---------------------------------------------
           START UPLOAD
        --------------------------------------------- */

        uploadBtn.disabled =
            true;

        uploadBtn.textContent =
            "Uploading...";


        try{

            /* -----------------------------------------
               FILE EXTENSION
            ----------------------------------------- */

            const extension =
                file.name
                    .split(".")
                    .pop()
                    .toLowerCase();


            /* -----------------------------------------
               UNIQUE STORAGE PATH
            ----------------------------------------- */

            const filePath =
                "banner-" +
                Date.now() +
                "." +
                extension;


            /* -----------------------------------------
               STORAGE UPLOAD
            ----------------------------------------- */

            const storageResult =
                await supabaseClient
                    .storage
                    .from(BUCKET)
                    .upload(
                        filePath,
                        file,
                        {
                            cacheControl:"3600",
                            upsert:false
                        }
                    );


            if(storageResult.error){

                throw storageResult.error;

            }


            /* -----------------------------------------
               PUBLIC URL
            ----------------------------------------- */

            const urlResult =
                supabaseClient
                    .storage
                    .from(BUCKET)
                    .getPublicUrl(
                        filePath
                    );


            const imageUrl =
                urlResult
                    .data
                    .publicUrl;


            if(!imageUrl){

                throw new Error(
                    "Unable to create image URL."
                );

            }


            /* -----------------------------------------
               DATABASE INSERT
            ----------------------------------------- */

            const databaseResult =
                await supabaseClient
                    .from(TABLE)
                    .insert({

                        name:
                            file.name,

                        image_url:
                            imageUrl,

                        category:
                            category,

                        pincode:
                            pincode,

                        is_active:
                            true

                    });


            if(databaseResult.error){

                throw databaseResult.error;

            }


            /* -----------------------------------------
               SUCCESS
            ----------------------------------------- */

            showMessage(
                "Banner uploaded successfully!",
                "success"
            );


            /* -----------------------------------------
               RESET FORM
            ----------------------------------------- */

            input.value = "";

            categoryInput.value = "";

            pincodeInput.value = "";

            preview.style.display =
                "none";

            previewImage.src =
                "";

            fileName.textContent =
                "";


        }
        catch(error){

            console.error(
                "BANNER UPLOAD ERROR:",
                error
            );


            showMessage(
                error.message ||
                "Upload failed. Please try again.",
                "error"
            );

        }


        uploadBtn.disabled =
            false;

        uploadBtn.textContent =
            "Upload Banner";

    }
);


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
    text,
    type
){

    message.textContent =
        text;

    message.className =
        "message " +
        type;

}


/* =====================================================
   START
===================================================== */

checkAdmin();

</script>
