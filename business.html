/* =========================

========================= */

.hero::before{

.hero::after{
    content:"";

.hero-inner{

.hero h1{

/* =========================
   PAGE
========================= */

.page{
  width:100%;
  max-width:760px;

/* =========================
   CARD
========================= */

.card{

  border-radius:18px;

.step-title{

}

.card h2{

}

.muted{
  margin:0 0 16px;
  color:#64748b;
  font-size:13px;
  line-height:1.55;

/* =========================
   OPTIONS
========================= */

.options{
  display:grid;
  grid-template-columns:
    repeat(2,minmax(0,1fr));
  gap:10px;
}

.option{
  min-height:52px;

  color:#334155;
  font-size:13px;
  font-weight:850;
  transition:.18s ease;
  box-shadow:
    0 3px 10px
    rgba(15,23,42,.035);
}

.option:hover{
  border-color:#fb923c;
  background:#fff7ed;
  transform:translateY(-1px);
}

.option:active{
  transform:scale(.97);
}

.option.selected{
  border-color:#f97316;
  background:#fff7ed;
  color:#c2410c;
  box-shadow:
    inset 0 0 0 1px
    rgba(249,115,22,.10);
}


/* =========================
   SELECTED BOX
========================= */

.selected-box{

/* =========================

========================= */

}

.field textarea{

.field textarea:focus,

}


/* =========================
   COUNTER
========================= */

.counter{

}

.counter-value{

  color:#111827;

}


/* =========================

========================= */

.date-btn{

.date-btn:focus{

/* =========================

========================= */

.preview-box{

}

.preview-row{

}

.preview-row:last-child{

}

.preview-label{
  color:#64748b;
  font-weight:750;
}

.preview-value{
  max-width:65%;
  text-align:right;
  color:#111827;
  font-weight:850;
  white-space:pre-wrap;
}


/* =========================
   POST
========================= */

.post-btn{
  width:100%;
  min-height:52px;
  margin-top:16px;
  border:0;
  border-radius:13px;

      135deg,

  font-size:15px;

}

.post-btn:active{

}

.post-btn:disabled{

/* =========================
   BOTTOM
========================= */

.bottom{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:90;

  justify-content:center;
  padding:10px 14px;

}

.bottom button{
  width:100%;
  max-width:500px;
  height:49px;
  border:0;
  border-radius:13px;
  background:#111827;
  color:#ffffff;
  font-size:14px;
  font-weight:950;
  box-shadow:
    0 7px 20px
    rgba(15,23,42,.14);
}

.bottom button:active{
  transform:scale(.98);
}


/* =========================
   LOGIN MODAL
========================= */

.modal{
  position:fixed;
  inset:0;
  z-index:300;
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;

.modal.show{

.modal-box{

.modal-box p{

.modal-actions{

.modal-actions button{

.cancel-btn{

}

.save-btn{

/* =========================

.calendar-box{

.calendar-head{

  align-items:center;
  justify-content:space-between;

.calendar-head strong{

}

.calendar-head button{
  width:38px;
  height:38px;

  background:#ffffff;
  color:#334155;
  font-size:18px;
  font-weight:950;
}

.calendar-week{
  display:grid;
  grid-template-columns:

  gap:4px;

}

.calendar-week div{
  padding:6px 0;
  text-align:center;
  color:#94a3b8;
  font-size:10px;

}

.calendar-grid{
  display:grid;
  grid-template-columns:
    repeat(7,1fr);

}

.calendar-day{
  min-height:38px;
  border:1px solid transparent;
  border-radius:9px;
  background:#f8fafc;
  color:#334155;
  font-size:12px;
  font-weight:800;
}

.calendar-day.today{
  border-color:#fdba74;
}

.calendar-day.selected{
  background:#f97316;
  color:#ffffff;
}

.calendar-day.disabled{
  opacity:.3;
  pointer-events:none;
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

  .hero{
    padding:34px 15px 30px;
  }

  .hero h1{

  }

  }

  .page{
    padding:
      15px

  }

  }

}

  .options{
    grid-template-columns:1fr;
  }

  }

</style>

<script>

  /* =========================

========================= */

const SUPABASE_URL =
  "https://mtuspuehsxsjoaxoenen.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_JpopjwDVjFvsDjXeG_56NQ_k3nA2mU6";


/* =========================
   STATE
========================= */

const state = {

  businessNeeds:[],

  businessDetails:{},

  budget:"",

  requiredDate:"",

  location:"",

  additional:""

};


let calendarDate =
  new Date();

let selectedCalendarDate =
  null;


/* =========================
   HELPER
========================= */

function $(id){

  return document.getElementById(id);

}

/* =========================
   BUSINESS NEEDS
========================= */

const businessNeeds = [

  "Start a New Business",

  "Buy an Existing Business",

  "Franchise",

  "Business Partner",

  "Investment / Funding",

  "Business Loan",

  "Distributor / Dealership",

  "Wholesale / Supplier",

  "Manufacturer",

  "Business Property",

  "Business Services",

  "Other"

];


/* =========================
   BUSINESS DETAIL OPTIONS
========================= */

const detailOptions = {

  "Start a New Business":[

    "Manufacturing",

    "Trading",

    "Retail Shop",

    "Food Business",

    "Service Business",

    "Online Business",

    "Other"

  ],

  "Buy an Existing Business":[

    "Shop",

    "Restaurant",

    "Manufacturing Unit",

    "Service Business",

    "Online Business",

    "Other"

  ],

  "Franchise":[

    "Food & Beverage",

    "Retail",

    "Education",

    "Service",

    "Healthcare",

    "Fitness",

    "Other"

  ],

  "Business Partner":[

    "Investment Partner",

    "Working Partner",

    "Marketing Partner",

    "Technical Partner",

    "Sales Partner",

    "Other"

  ],

  "Investment / Funding":[

    "Need Investment",

    "Looking for Investor",

    "Joint Venture",

    "Business Expansion",

    "Startup Funding",

    "Other"

  ],

  "Business Loan":[

    "Working Capital",

    "Business Expansion",

    "Equipment Loan",

    "Property Loan",

    "Startup Loan",

    "Other"

  ],

  "Distributor / Dealership":[

    "FMCG",

    "Cleaning Products",

    "Food Products",

    "Electronics",

    "Automobile",

    "Industrial Products",

    "Other"

  ],

  "Wholesale / Supplier":[

    "FMCG",

    "Food Products",

    "Cleaning Products",

    "Clothing",

    "Electronics",

    "Industrial Products",

    "Other"

  ],

  "Manufacturer":[

    "Own Manufacturing",

    "Contract Manufacturing",

    "Private Label",

    "OEM",

    "Packaging",

    "Other"

  ],

  "Business Property":[

    "Shop",

    "Office",

    "Warehouse",

    "Factory",

    "Commercial Building",

    "Land",

    "Other"

  ],

  "Business Services":[

    "Accounting",

    "Digital Marketing",

    "Website / App",

    "Legal Services",

    "GST / Tax",

    "Consulting",

    "HR / Recruitment",

    "Other"

  ],

  "Other":[

    "Other Business Requirement"

  ]

};


/* =========================
   OPTION
========================= */

function option(
  text,
  selected,
  onclick
){

  const safeOnclick =
    onclick.replace(
      /"/g,
      "&quot;"
    );

  return `

    <button
      type="button"
      class="option ${
        selected
          ? "selected"
          : ""
      }"
      onclick="${safeOnclick}"
    >

      ${
        selected
          ? "✓ "
          : ""
      }

      ${escapeHtml(text)}

    </button>

  `;

}


/* =========================
   RENDER BUSINESS NEEDS
========================= */

function renderBusinessSelection(){

  $("formArea").innerHTML = `

    <div class="card">

      <div class="step-title">
        Step 1
      </div>

      <h2>
        What business help do you need?
      </h2>

      <p class="muted">
        Select one or more options
      </p>

      <div class="options">

        ${
          businessNeeds
            .map(need => {

              const selected =
                state.businessNeeds
                  .includes(need);

              return option(
                need,
                selected,
                `selectBusinessNeed(${JSON.stringify(need)})`
              );

            })
            .join("")
        }

      </div>

      ${
        state.businessNeeds.length
          ? `

            <div class="selected-box">

              <strong>
                Selected:
              </strong>

              <br>

              ${
                state.businessNeeds
                  .join(", ")
              }

            </div>

          `
          : ""
      }

    </div>

  `;

}

  /* =========================
   BUSINESS NEED SELECT
========================= */

function selectBusinessNeed(
  need
){

  const index =
    state.businessNeeds
      .indexOf(need);


  if(index === -1){

    state.businessNeeds
      .push(need);

  }else{

    state.businessNeeds
      .splice(index,1);

  }


  renderBusinessSelection();

  renderBusinessDetails();

  updatePreview();

}


/* =========================
   BUSINESS DETAILS
========================= */

function renderBusinessDetails(){

  if(
    !state.businessNeeds.length
  ){

    return;

  }


  const existing =
    $("businessDetailsCard");


  let html = `

    <div
      class="card"
      id="businessDetailsCard"
    >

      <div class="step-title">
        Step 2
      </div>

      <h2>
        Business Details
      </h2>

      <p class="muted">
        Select the relevant details for
        your business requirement.
      </p>

  `;


  state.businessNeeds
    .forEach(need => {

      const options =
        detailOptions[need] || [];


      if(!options.length){

        return;

      }


      const selected =
        state.businessDetails[need] || [];


      html += `

        <div
          style="
            margin-top:18px;
          "
        >

          <div
            style="
              margin-bottom:9px;
              color:#334155;
              font-size:12px;
              font-weight:900;
            "
          >

            ${escapeHtml(need)}

          </div>

          <div class="options">

            ${
              options
                .map(detail => {

                  const isSelected =
                    selected
                      .includes(detail);

                  return option(
                    detail,
                    isSelected,
                    `selectBusinessDetail(${JSON.stringify(need)},${JSON.stringify(detail)})`
                  );

                })
                .join("")
            }

          </div>

        </div>

      `;

    });


  html += `

      <div class="field">

        <label>
          Business Name / Product / Brand
        </label>

        <input
          id="businessNameInput"
          type="text"
          value="${
            escapeAttribute(
              state.businessDetails.businessName || ""
            )
          }"
          placeholder="Optional"
          oninput="
            state.businessDetails.businessName=this.value;
            updatePreview();
          "
        >

      </div>

      <div class="field">

        <label>
          Business Experience / Requirement
        </label>

        <textarea
          id="businessExperienceInput"
          placeholder="Tell us briefly about your business requirement"
          oninput="
            state.businessDetails.experience=this.value;
            updatePreview();
          "
        >${
          escapeHtml(
            state.businessDetails.experience || ""
          )
        }</textarea>

      </div>

    </div>

  `;


  if(existing){

    existing.outerHTML =
      html;

  }else{

    $("formArea")
      .insertAdjacentHTML(
        "beforeend",
        html
      );

  }


  renderCommonFields();

}


/* =========================
   BUSINESS DETAIL SELECT
========================= */

function selectBusinessDetail(
  need,
  detail
){

  if(
    !state.businessDetails[need]
  ){

    state.businessDetails[need] = [];

  }


  const list =
    state.businessDetails[need];


  const index =
    list.indexOf(detail);


  if(index === -1){

    list.push(detail);

  }else{

    list.splice(index,1);

  }


  renderBusinessDetails();

  updatePreview();

}

/* =========================
   DATE PICKER
========================= */

function openDatePicker(){

  calendarDate =
    new Date();


  if(
    state.requiredDate
  ){

    const parts =
      state.requiredDate
        .split("-");


    if(
      parts.length === 3
    ){

      calendarDate =
        new Date(
          Number(parts[0]),
          Number(parts[1]) - 1,
          Number(parts[2])
        );

    }

  }


  renderCalendar();

  $("dateModal")
    .classList
    .add("show");

}


function closeDatePicker(){

  $("dateModal")
    .classList
    .remove("show");

}


function changeMonth(
  amount
){

  calendarDate =
    new Date(
      calendarDate.getFullYear(),
      calendarDate.getMonth() + amount,
      1
    );

  renderCalendar();

}


function renderCalendar(){

  const year =
    calendarDate.getFullYear();

  const month =
    calendarDate.getMonth();


  $("calendarTitle")
    .textContent =
      calendarDate.toLocaleDateString(
        "en-IN",
        {
          month:"long",
          year:"numeric"
        }
      );


  const firstDay =
    new Date(
      year,
      month,
      1
    ).getDay();


  const totalDays =
    new Date(
      year,
      month + 1,
      0
    ).getDate();


  const today =
    new Date();

  today.setHours(
    0,0,0,0
  );


  let html = "";


  for(
    let i=0;
    i<firstDay;
    i++
  ){

    html += `
      <div></div>
    `;

  }


  for(
    let day=1;
    day<=totalDays;
    day++
  ){

    const date =
      new Date(
        year,
        month,
        day
      );


    date.setHours(
      0,0,0,0
    );


    const disabled =
      date < today;


    const selected =
      selectedCalendarDate &&
      date.getTime() ===
      selectedCalendarDate.getTime();


    const todayClass =
      date.getTime() ===
      today.getTime()
        ? "today"
        : "";


    html += `

      <button
        type="button"
        class="
          calendar-day
          ${disabled ? "disabled" : ""}
          ${selected ? "selected" : ""}
          ${todayClass}
        "
        ${
          disabled
            ? ""
            : `onclick="selectCalendarDate(${day})"`
        }
      >
        ${day}
      </button>

    `;

  }


  $("calendarGrid")
    .innerHTML =
      html;

}


function selectCalendarDate(
  day
){

  selectedCalendarDate =
    new Date(
      calendarDate.getFullYear(),
      calendarDate.getMonth(),
      day
    );


  selectedCalendarDate
    .setHours(
      0,0,0,0
    );


  renderCalendar();

}


function confirmDate(){

  if(
    !selectedCalendarDate
  ){

    alert(
      "Please select a date."
    );

    return;

  }


  const year =
    selectedCalendarDate
      .getFullYear();

  const month =
    String(
      selectedCalendarDate
        .getMonth()+1
    )
    .padStart(2,"0");

  const day =
    String(
      selectedCalendarDate
        .getDate()
    )
    .padStart(2,"0");


  state.requiredDate =
    `${year}-${month}-${day}`;


  $("dateButton")
    .textContent =
      formatDisplayDate(
        state.requiredDate
      );


  closeDatePicker();

  updatePreview();

}


function formatDisplayDate(
  value
){

  if(!value){

    return "";

  }


  const parts =
    value.split("-");


  if(
    parts.length !== 3
  ){

    return value;

  }


  return `${parts[2]}/${parts[1]}/${parts[0]}`;

}

  /* =========================
   ESCAPE HTML
========================= */

function escapeHtml(
  value
){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


function escapeAttribute(
  value
){

  return escapeHtml(
    value
  );

}

            ${
              state.businessDetails.businessName
                ? escapeHtml(
                    state.businessDetails.businessName
                  )
                : "Not specified"
            }

          </div>

        </div>

        <div class="preview-row">

          <div class="preview-label">
            Budget
          </div>

          <div class="preview-value">

            ${
              state.budget
                ? escapeHtml(
                    state.budget
                  )
                : "Not specified"
            }

          </div>

        </div>

        <div class="preview-row">

          <div class="preview-label">
            Required Date
          </div>

          <div class="preview-value">

            ${
              state.requiredDate
                ? formatDisplayDate(
                    state.requiredDate
                  )
                : "Not specified"
            }

          </div>

        </div>

        <div class="preview-row">

          <div class="preview-label">
            Location
          </div>

          <div class="preview-value">

              state.location

/* =========================
   VALIDATION
========================= */

function validateRequirement(){

  if(
    !state.businessNeeds.length
  ){

    return {
      valid:false,
      message:
        "Please select at least one business requirement."
    };

  }


  if(
    !state.location.trim()
  ){

    return {
      valid:false,
      message:
        "Please enter your location."
    };

  }


  return {
    valid:true,
    message:""
  };

}


/* =========================
   BUILD DESCRIPTION
========================= */

function buildDescription(){

  const lines = [];


  lines.push(
    "Business Need: " +
    state.businessNeeds
      .join(", ")
  );


  state.businessNeeds
    .forEach(need => {

      const details =
        state.businessDetails[need] || [];


      if(details.length){

        lines.push(
          need +
          ": " +
          details.join(", ")
        );

      }

    });


  if(
    state.businessDetails.businessName
  ){

    lines.push(
      "Business / Brand: " +
      state.businessDetails.businessName
    );

  }


  if(
    state.businessDetails.experience
  ){

    lines.push(
      "Business Experience / Requirement: " +
      state.businessDetails.experience
    );

  }


  if(
    state.budget.trim()
  ){

    lines.push(
      "Budget / Investment: " +
      state.budget.trim()
    );

  }


  if(
    state.requiredDate
  ){

    lines.push(
      "Required Date: " +
      state.requiredDate
    );

  }


  if(
    state.additional.trim()
  ){

    lines.push(
      "Additional Requirement: " +
      state.additional.trim()
    );

  }


  return lines.join("\n");

}

  /* =========================
   LOGIN
========================= */

function openLogin(){

  if(
    isLoggedIn()
  ){

    return;

  }


  $("loginModal")
    .classList
    .add("show");


  setTimeout(
    function(){

      $("loginMobile")
        .focus();

    },
    100
  );

}


function closeLogin(){

  $("loginModal")
    .classList
    .remove("show");

}


function isLoggedIn(){

  return Boolean(
    localStorage.getItem(
      "pyncode_mobile"
    )
  );

}


function saveLogin(){

  const input =
    $("loginMobile");


  const mobile =
    input.value.trim();


  if(
    !/^[6-9]\d{9}$/.test(
      mobile
    )
  ){

    alert(
      "Please enter a valid 10 digit mobile number."
    );

    return;

  }


  localStorage.setItem(
    "pyncode_mobile",
    mobile
  );


  closeLogin();

  updateLoginButton();

  alert(
    "Login successful."
  );

}


function updateLoginButton(){

  const button =
    $("topLoginBtn");


  if(!button){

    return;

  }


  if(
    isLoggedIn()
  ){

    button.textContent =
      "Logged In";

    button.style.background =
      "#ecfdf5";

    button.style.color =
      "#047857";

    button.style.borderColor =
      "#a7f3d0";

  }else{

    button.textContent =
      "Login";

    button.style.background =
      "";

    button.style.color =
      "";

    button.style.borderColor =
      "";

  }

}


/* =========================
   POST REQUIREMENT
========================= */

async function postRequirement(){

  const validation =
    validateRequirement();


  if(
    !validation.valid
  ){

    alert(
      validation.message
    );

    return;

  }


  if(
    !isLoggedIn()
  ){

    openLogin();

    return;

  }


  const mobile =
    localStorage.getItem(
      "pyncode_mobile"
    );


  if(!mobile){

    openLogin();

    return;

  }


  const button =
    document.querySelector(
      ".post-btn"
    );


  if(button){

    button.disabled =
      true;

    button.textContent =
      "Posting...";

  }


  const firstNeed =
    state.businessNeeds[0];


  const title =
    firstNeed +
    (
      state.businessNeeds.length > 1
        ? " + " +
          (
            state.businessNeeds.length - 1
          ) +
          " more"
        : ""
    );


  const payload = {

    mobile:

      mobile,

    category:

      "business",

    location:

      state.location.trim(),

    title:

      title,

    description:

      buildDescription(),

    required_date:

      state.requiredDate ||
      null,

    quantity:

      "1"

  };


  try{

    const response =
      await fetch(
        `${SUPABASE_URL}/rest/v1/requirements`,
        {

          method:"POST",

          headers:{

            apikey:
              SUPABASE_KEY,

            Authorization:
              `Bearer ${SUPABASE_KEY}`,

            "Content-Type":
              "application/json",

            Prefer:
              "return=minimal"

          },

          body:
            JSON.stringify(
              payload
            )

        }
      );


    if(
      !response.ok
    ){

      const errorText =
        await response.text();


      console.error(
        "Supabase error:",
        errorText
      );


      throw new Error(
        "Post failed"
      );

    }


    alert(
      "Requirement posted successfully."
    );


    window.location.href =
      "enquiry.html";

  }
  catch(error){

    console.error(
      error
    );


    alert(
      "Something went wrong while posting. Please try again."
    );


    if(button){

      button.disabled =
        false;

      button.textContent =
        "Post Requirement";

    }

  }

}

  /* =========================
   MOBILE INPUT
========================= */

document.addEventListener(
  "input",
  function(event){

    if(
      event.target &&
      event.target.id ===
      "loginMobile"
    ){

      event.target.value =
        event.target.value
          .replace(
            /\D/g,
            ""
          )
          .slice(
            0,
            10
          );

    }

  }
);


/* =========================
   ENTER LOGIN
========================= */

document.addEventListener(
  "keydown",
  function(event){

    if(
      event.key === "Enter" &&
      event.target &&
      event.target.id ===
      "loginMobile"
    ){

      saveLogin();

    }

  }
);


/* =========================
   ESC KEY
========================= */

document.addEventListener(
  "keydown",
  function(event){

    if(
      event.key === "Escape"
    ){

      closeLogin();

      closeDatePicker();

    }

  }
);


/* =========================
   BACKDROP
========================= */

document.addEventListener(
  "click",
  function(event){

    if(
      event.target ===
      $("loginModal")
    ){

      closeLogin();

    }


    if(
      event.target ===
      $("dateModal")
    ){

      closeDatePicker();

    }

  }
);


/* =========================
   STORAGE CHANGE
========================= */

window.addEventListener(
  "storage",
  function(event){

    if(
      event.key ===
      "pyncode_mobile"
    ){

      updateLoginButton();

      updatePreview();

    }

  }
);


/* =========================
   PAGE SHOW
========================= */

window.addEventListener(
  "pageshow",
  function(){

    updateLoginButton();

    updatePreview();

  }
);


/* =========================
   VISIBILITY
========================= */

document.addEventListener(
  "visibilitychange",
  function(){

    if(
      !document.hidden
    ){

      updateLoginButton();

      updatePreview();

    }

  }
);

  /* =========================
   INITIALIZE
========================= */

document.addEventListener(
  "DOMContentLoaded",
  function(){

    renderBusinessSelection();

    updateLoginButton();

  }
);


/* =========================
   FINAL REFRESH
========================= */

setTimeout(
  function(){

    try{

      renderBusinessSelection();

      updateLoginButton();

      updatePreview();

    }
    catch(error){

      console.error(
        "Pyncode Business error:",
        error
      );

    }

  },
  100
);
