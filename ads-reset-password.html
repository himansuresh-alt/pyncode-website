
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#e0e9dc">
<title>Reset Password | Pyncode Ads</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --cream:#faf7f0;
  --green:#496650;
  --sage:#e0e9dc;
  --dark:#293a30;
  --muted:#788078;
  --border:#e1e3dc;
  --white:#fff;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Arial,Helvetica,sans-serif;
  background:var(--cream);
  color:var(--dark);
  min-height:100vh;
  display:flex;
  flex-direction:column;
}
header{
  background:var(--sage);
  padding:22px 20px;
  border-bottom:1px solid var(--border);
}
.header-inner{
  max-width:1050px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}
h1{font-size:25px}
.header-inner p{color:var(--muted);font-size:13px;margin-top:5px}
a{color:var(--green);font-weight:bold;text-decoration:none}
main{
  width:100%;
  max-width:460px;
  margin:auto;
  padding:35px 18px;
}
.card{
  background:var(--white);
  border:1px solid var(--border);
  border-radius:20px;
  padding:28px 23px;
  box-shadow:0 8px 30px rgba(41,58,48,.04);
}
.icon{
  width:54px;height:54px;
  display:grid;place-items:center;
  background:var(--sage);
  border-radius:16px;
  font-size:25px;
  margin-bottom:20px;
}
h2{font-size:27px;margin-bottom:10px}
.description{
  font-size:14px;
  line-height:1.7;
  color:var(--muted);
  margin-bottom:24px;
}
.field{margin-bottom:18px}
label{
  display:block;
  font-size:13px;
  font-weight:bold;
  margin-bottom:8px;
}
input{
  width:100%;
  padding:14px 12px;
  border:1px solid var(--border);
  border-radius:10px;
  font-size:15px;
  outline:none;
}
input:focus{
  border-color:var(--green);
  box-shadow:0 0 0 3px rgba(73,102,80,.1);
}
.password-wrap{position:relative}
.password-wrap input{padding-right:68px}
.toggle{
  position:absolute;
  right:8px;
  top:50%;
  transform:translateY(-50%);
  border:0;
  background:transparent;
  color:var(--green);
  font-weight:bold;
  padding:8px;
  cursor:pointer;
}
button.submit{
  width:100%;
  border:0;
  border-radius:11px;
  padding:15px;
  background:var(--green);
  color:white;
  font-weight:bold;
  font-size:15px;
  cursor:pointer;
}
button:disabled{opacity:.6}
.notice{
  display:none;
  padding:12px;
  border-radius:10px;
  margin-bottom:17px;
  font-size:13px;
  line-height:1.6;
  overflow-wrap:anywhere;
}
.notice.error{display:block;background:#fff0ed;color:#9b3528}
.notice.success{display:block;background:#e8f3e8;color:#315c39}
.back{
  text-align:center;
  font-size:14px;
  margin-top:22px;
}
footer{
  text-align:center;
  padding:20px;
  font-size:12px;
  color:var(--muted);
}
</style>
</head>

<body>
<header>
  <div class="header-inner">
    <div>
      <h1>Pyncode Ads</h1>
      <p>Business advertising made simple</p>
    </div>
    <a href="ads-login.html">Login</a>
  </div>
</header>

<main>
  <section class="card">
    <div class="icon">🔐</div>
    <h2>Set new password</h2>
    <p class="description">
      Choose a new password for your Pyncode Ads account.
      Use at least 8 characters.
    </p>

    <div id="notice" class="notice" role="status"
         aria-live="polite"></div>

    <form id="resetForm">
      <div class="field">
        <label for="password">New Password</label>
        <div class="password-wrap">
          <input id="password" type="password"
                 minlength="8" autocomplete="new-password"
                 placeholder="Enter new password" required>
          <button class="toggle" id="showPassword"
                  type="button">Show</button>
        </div>
      </div>

      <div class="field">
        <label for="confirmPassword">Confirm New Password</label>
        <div class="password-wrap">
          <input id="confirmPassword" type="password"
                 minlength="8" autocomplete="new-password"
                 placeholder="Enter password again" required>
          <button class="toggle" id="showConfirm"
                  type="button">Show</button>
        </div>
      </div>

      <button class="submit" id="submitBtn" type="submit">
        Update Password
      </button>
    </form>

    <p class="back">
      Remember your password?
      <a href="ads-login.html">Back to Login</a>
    </p>
  </section>
</main>

<footer>© 2026 Pyncode Ads</footer>

<script>
(function(){
  "use strict";

  const SUPABASE_URL =
    "https://mtuspuehsxsjoaxoenen.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_JpopjwDVjFvsDjXeG_56NQ_k3nA2mU6";

  const notice = document.getElementById("notice");
  const form = document.getElementById("resetForm");
  const button = document.getElementById("submitBtn");
  const password = document.getElementById("password");
  const confirmPassword = document.getElementById("confirmPassword");

  function showNotice(message,type){
    notice.textContent = message;
    notice.className = "notice " + type;
  }

  if(!window.supabase){
    showNotice("Internet connection check pannunga.","error");
    button.disabled = true;
    return;
  }

  const client = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  function toggle(input,btn){
    btn.addEventListener("click",function(){
      const visible = input.type === "password";
      input.type = visible ? "text" : "password";
      btn.textContent = visible ? "Hide" : "Show";
    });
  }

  toggle(password,document.getElementById("showPassword"));
  toggle(confirmPassword,document.getElementById("showConfirm"));

  let recoveryReady = false;

  client.auth.onAuthStateChange(function(event,session){
    if(event === "PASSWORD_RECOVERY" && session){
      recoveryReady = true;
      showNotice("Reset link verified. Set your new password below.","success");
    }
  });

  // Support recovery sessions restored after page load.
  client.auth.getSession().then(function(result){
    if(result.data && result.data.session){
      recoveryReady = true;
    }
  });

  form.addEventListener("submit",async function(event){
    event.preventDefault();

    if(password.value.length < 8){
      showNotice("Password minimum 8 characters irukkanum.","error");
      return;
    }

    if(password.value !== confirmPassword.value){
      showNotice("Passwords match aagala.","error");
      return;
    }

    button.disabled = true;
    button.textContent = "Updating...";

    try{
      const sessionResult = await client.auth.getSession();
      const session = sessionResult.data && sessionResult.data.session;

      if(!session || !session.access_token){
        throw new Error(
          "Reset link invalid or expired. Login page-la Forgot Password click panni pudhu link request pannunga."
        );
      }

      const result = await client.auth.updateUser({
        password:password.value
      });

      if(result.error) throw result.error;

      await client.auth.signOut();

      showNotice(
        "Password updated successfully! Login page-ku redirect aagudhu.",
        "success"
      );

      form.reset();

      setTimeout(function(){
        window.location.href = "ads-login.html";
      },1800);

    }catch(error){
      showNotice(
        error.message || "Password update panna mudiyala. Reset link check pannunga.",
        "error"
      );
    }finally{
      button.disabled = false;
      button.textContent = "Update Password";
    }
  });
})();
</script>
</body>
</html>
