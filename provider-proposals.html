<script>

/* Supabase */

const SUPABASE_URL =
  "https://mtuspuehsxsjoaxoenen.supabase.co";


/*
 Use the SAME existing Pyncode
 Supabase publishable key.
*/

const SUPABASE_KEY =
  "sb_publishable_JpopjwDVjFvsDjXeG_56NQ_k3nA2mU6";


/* State */

let providerProfile = null;

let proposals = [];


/* DOM */

const statusArea =
  document.getElementById(
    "statusArea"
  );

const proposalsList =
  document.getElementById(
    "proposalsList"
  );

const proposalModal =
  document.getElementById(
    "proposalModal"
  );

const modalTitle =
  document.getElementById(
    "modalTitle"
  );

const modalContent =
  document.getElementById(
    "modalContent"
  );


/* Escape HTML */

function escapeHtml(value){

  if(
    value === null ||
    value === undefined
  ){

    return "";

  }

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* Date */

function formatDate(value){

  if(!value){

    return "-";

  }


  const date =
    new Date(value);


  if(
    Number.isNaN(
      date.getTime()
    )
  ){

    return "-";

  }


  return date.toLocaleDateString(
    "en-IN",
    {
      day:"2-digit",
      month:"short",
      year:"numeric"
    }
  );

}


/* Amount */

function formatAmount(value){

  if(
    value === null ||
    value === undefined ||
    value === ""
  ){

    return "Not specified";

  }


  const number =
    Number(value);


  if(Number.isNaN(number)){

    return escapeHtml(value);

  }


  return "₹" +
    number.toLocaleString(
      "en-IN",
      {
        minimumFractionDigits:0,
        maximumFractionDigits:2
      }
    );

}


/* Loading */

function showLoading(message){

  statusArea.innerHTML = `

    <div class="status-box loading">
      ${escapeHtml(message)}
    </div>

  `;

}


/* Error */

function showError(message){

  statusArea.innerHTML = `

    <div class="status-box error">
      ${escapeHtml(message)}
    </div>

  `;

}


/* Back */

function goBack(){

  if(document.referrer){

    history.back();

    return;

  }


  window.location.href =
    "provider-enquiry.html";

}

  /* ================================
   PROVIDER SESSION
================================ */

let providerAccessToken = "";


async function getProviderSession(){

  providerAccessToken = "";


  try{

    const projectRef =
      "mtuspuehsxsjoaxoenen";


    const possibleKeys = [

      "sb-" +
      projectRef +
      "-auth-token",

      "supabase.auth.token"

    ];


    let sessionData = null;


    /*
      First try the standard
      Supabase v2 storage key
    */

    for(
      const key of possibleKeys
    ){

      const raw =
        localStorage.getItem(
          key
        );


      if(!raw){

        continue;

      }


      try{

        sessionData =
          JSON.parse(raw);

      }
      catch(error){

        sessionData = null;

      }


      if(sessionData){

        break;

      }

    }


    /*
      Fallback:
      Search Supabase auth
      storage keys.
    */

    if(!sessionData){

      for(
        let i = 0;
        i < localStorage.length;
        i++
      ){

        const key =
          localStorage.key(i);


        if(
          !key ||
          !key.startsWith("sb-") ||
          !key.endsWith("-auth-token")
        ){

          continue;

        }


        const raw =
          localStorage.getItem(
            key
          );


        if(!raw){

          continue;

        }


        try{

          const parsed =
            JSON.parse(raw);


          if(
            parsed &&
            (
              parsed.access_token ||
              parsed.user
            )
          ){

            sessionData =
              parsed;

            break;

          }

        }
        catch(error){

          continue;

        }

      }

    }


    if(
      !sessionData ||
      !sessionData.access_token
    ){

      console.error(
        "Supabase session not found."
      );

      return null;

    }


    providerAccessToken =
      sessionData.access_token;


    /*
      Get current authenticated
      Supabase user.
    */

    const response =
      await fetch(
        SUPABASE_URL +
        "/auth/v1/user",
        {
          method:"GET",

          headers:{

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer " +
              providerAccessToken

          }

        }
      );


    if(!response.ok){

      console.error(
        "Unable to verify provider session."
      );

      providerAccessToken =
        "";

      return null;

    }


    const user =
      await response.json();


    if(
      !user ||
      !user.id
    ){

      providerAccessToken =
        "";

      return null;

    }


    return {

      user:user,

      access_token:
        providerAccessToken

    };

  }
  catch(error){

    console.error(
      "Session error:",
      error
    );

    providerAccessToken =
      "";

    return null;

  }

}


/* ================================
   LOAD PROVIDER PROFILE
================================ */

async function loadProviderProfile(
  userId
){

  if(
    !providerAccessToken
  ){

    throw new Error(
      "Provider session expired. Please login again."
    );

  }


  const url =
    SUPABASE_URL +
    "/rest/v1/provider_profiles" +
    "?auth_user_id=eq." +
    encodeURIComponent(
      userId
    ) +
    "&select=*";


  const response =
    await fetch(
      url,
      {
        method:"GET",

        headers:{

          "apikey":
            SUPABASE_KEY,

          "Authorization":
            "Bearer " +
            providerAccessToken,

          "Content-Type":
            "application/json"

        }

      }
    );


  if(!response.ok){

    const errorText =
      await response.text();


    console.error(
      "Provider profile error:",
      errorText
    );


    throw new Error(
      "Unable to load provider profile."
    );

  }


  const data =
    await response.json();


  if(
    !Array.isArray(data) ||
    data.length === 0
  ){

    return null;

  }


  return data[0];

}


/* ================================
   LOAD PROVIDER PROPOSALS
================================ */

async function loadProviderProposals(
  userId
){

  if(
    !providerAccessToken
  ){

    throw new Error(
      "Provider session expired. Please login again."
    );

  }


  showLoading(
    "Loading your proposals..."
  );


  const url =
    SUPABASE_URL +
    "/rest/v1/requirement_proposals" +
    "?provider_auth_user_id=eq." +
    encodeURIComponent(
      userId
    ) +
    "&select=*,requirements(*)" +
    "&order=created_at.desc";


  const response =
    await fetch(
      url,
      {
        method:"GET",

        headers:{

          "apikey":
            SUPABASE_KEY,

          "Authorization":
            "Bearer " +
            providerAccessToken,

          "Content-Type":
            "application/json"

        }

      }
    );


  if(!response.ok){

    const errorText =
      await response.text();


    console.error(
      "Provider proposals error:",
      errorText
    );


    throw new Error(
      "Unable to load your proposals."
    );

  }


  const data =
    await response.json();


  proposals =
  Array.isArray(data)
    ? data
    : [];

renderProposals();

/* Hide loading message after successful load */
if(statusArea){

  statusArea.innerHTML = "";

  statusArea.style.display =
    "none";

}

}


/* ================================
   STATUS CLASS
================================ */

function getStatusClass(
  status
){

  const value =
    String(
      status ||
      "pending"
    )
    .toLowerCase()
    .trim();


  if(
    value === "accepted"
  ){

    return "status-accepted";

  }


  if(
    value === "rejected"
  ){

    return "status-rejected";

  }


  if(
    value === "viewed"
  ){

    return "status-viewed";

  }


  if(
    value === "withdrawn"
  ){

    return "status-withdrawn";

  }


  if(
    value === "closed"
  ){

    return "status-closed";

  }


  return "status-pending";

}


/* ================================
   REQUIREMENT HELPER
================================ */

function getRequirementFromProposal(
  proposal
){

  if(
    !proposal
  ){

    return null;

  }


  return (
    proposal.requirements ||
    proposal.requirement ||
    null
  );

}


/* ================================
   LOCATION HELPER
================================ */

function getRequirementLocation(
  requirement
){

  if(
    !requirement
  ){

    return "Not specified";

  }


  return (
    requirement.location ||
    requirement.area ||
    requirement.city ||
    "Not specified"
  );

}


/* ================================
   RENDER PROPOSALS
================================ */

function renderProposals(){

  if(
    !proposals ||
    proposals.length === 0
  ){

    proposalsList.innerHTML = `

      <div class="empty-state">

        <div class="empty-icon">
          📩
        </div>

        <h3>
          No proposals yet
        </h3>

        <p>
          Proposals you send to customers
          will appear here.
        </p>

      </div>

    `;

    return;

  }


  proposalsList.innerHTML =
    proposals
      .map(
        createProposalCard
      )
      .join("");


  document
    .querySelectorAll(
      "[data-proposal-id]"
    )
    .forEach(
      function(button){

        button.addEventListener(
          "click",
          function(){

            const id =
              this.getAttribute(
                "data-proposal-id"
              );


            openProposalModal(
              id
            );

          }
        );

      }
    );

}


/* ================================
   CREATE PROPOSAL CARD
================================ */

function createProposalCard(
  proposal
){

  const requirement =
    getRequirementFromProposal(
      proposal
    );


  const requirementTitle =
    requirement &&
    requirement.title
      ? requirement.title
      : "Customer Requirement";


  const category =
    requirement &&
    requirement.category
      ? requirement.category
      : "Not specified";


  const location =
    getRequirementLocation(
      requirement
    );


  const title =
    proposal.proposal_title ||
    "Provider Proposal";


  const message =
    proposal.proposal_message ||
    "No proposal message provided.";


  const amount =
    formatAmount(
      proposal.quoted_amount
    );


  const availability =
    proposal.availability ||
    "Not specified";


  const status =
    String(
      proposal.status ||
      "pending"
    )
    .toLowerCase()
    .trim();


  const createdAt =
    formatDate(
      proposal.created_at
    );


  return `

    <div class="proposal-card">

      <div class="proposal-top">

        <div>

          <h3 class="proposal-title">
            ${escapeHtml(title)}
          </h3>

          <div class="proposal-date">
            Sent ${escapeHtml(createdAt)}
          </div>

        </div>


        <span
          class="status-badge ${getStatusClass(status)}"
        >
          ${escapeHtml(status)}
        </span>

      </div>


      <div class="requirement-box">

        <div class="requirement-label">
          Customer Requirement
        </div>

        <div class="requirement-title">
          ${escapeHtml(requirementTitle)}
        </div>

        <div class="requirement-meta">

          <span>
            ${escapeHtml(category)}
          </span>

          <span>
            ${escapeHtml(location)}
          </span>

        </div>

      </div>


      <div class="proposal-message">

        ${escapeHtml(message)}

      </div>


      <div class="proposal-info">

        <div>

          <span class="info-label">
            Quote
          </span>

          <strong>
            ${amount}
          </strong>

        </div>


        <div>

          <span class="info-label">
            Availability
          </span>

          <strong>
            ${escapeHtml(availability)}
          </strong>

        </div>

      </div>


      ${
        status === "accepted"
        ? `

          <div class="accepted-note">

            ✓ Customer accepted this proposal.

          </div>

        `
        : ""
      }


      <button
        type="button"
        class="view-button"
        data-proposal-id="${proposal.id}"
      >
        View Details
      </button>


      <div class="private-note">

        🔒 Customer contact details are private.

      </div>

    </div>

  `;

}

  /* Open proposal modal */

function openProposalModal(
  proposalId
){

  const proposal =
    proposals.find(
      function(item){

        return Number(item.id) ===
          Number(proposalId);

      }
    );


  if(!proposal){

    return;

  }


  const status =
    String(
      proposal.status ||
      "pending"
    )
    .toLowerCase()
    .trim();


  const title =
    proposal.proposal_title ||
    "Provider Proposal";


  const message =
    proposal.proposal_message ||
    "No proposal message provided.";


  const amount =
    formatAmount(
      proposal.quoted_amount
    );


  const availability =
    proposal.availability ||
    "Not specified";


  const createdAt =
    formatDate(
      proposal.created_at
    );


  const requirement =
    getRequirementFromProposal(
      proposal
    );


  const requirementTitle =
    requirement &&
    requirement.title
      ? requirement.title
      : "Customer Requirement";


  const category =
    requirement &&
    requirement.category
      ? requirement.category
      : "Not specified";


  const location =
    getRequirementLocation(
      requirement
    );


  const requiredDate =
    requirement &&
    requirement.required_date
      ? requirement.required_date
      : "Not specified";


  const description =
    requirement &&
    requirement.description
      ? requirement.description
      : "No requirement description provided.";


  modalTitle.textContent =
    title;


  modalContent.innerHTML = `

    <div class="modal-section">

      <span class="modal-label">
        Proposal Status
      </span>

      <div class="modal-value">
        ${escapeHtml(status)}
      </div>

    </div>


    <div class="modal-section">

      <span class="modal-label">
        Proposal Message
      </span>

      <div class="modal-value">
        ${escapeHtml(message)}
      </div>

    </div>


    <div class="modal-section">

      <span class="modal-label">
        Quoted Amount
      </span>

      <div class="modal-value">
        ${amount}
      </div>

    </div>


    <div class="modal-section">

      <span class="modal-label">
        Availability
      </span>

      <div class="modal-value">
        ${escapeHtml(
          availability
        )}
      </div>

    </div>


    <div class="modal-section">

      <span class="modal-label">
        Sent On
      </span>

      <div class="modal-value">
        ${escapeHtml(
          createdAt
        )}
      </div>

    </div>


    <div
      style="
        margin-top:18px;
        padding-top:17px;
        border-top:1px solid #e5e7eb;
      "
    >

      <div
        style="
          font-size:15px;
          font-weight:800;
          color:#111827;
          margin-bottom:13px;
        "
      >
        Customer Requirement
      </div>


      <div class="modal-section">

        <span class="modal-label">
          Requirement
        </span>

        <div class="modal-value">
          ${escapeHtml(
            requirementTitle
          )}
        </div>

      </div>


      <div class="modal-section">

        <span class="modal-label">
          Category
        </span>

        <div class="modal-value">
          ${escapeHtml(
            category
          )}
        </div>

      </div>


      <div class="modal-section">

        <span class="modal-label">
          Location
        </span>

        <div class="modal-value">
          ${escapeHtml(
            location
          )}
        </div>

      </div>


      <div class="modal-section">

        <span class="modal-label">
          Required Date
        </span>

        <div class="modal-value">
          ${escapeHtml(
            requiredDate
          )}
        </div>

      </div>


      <div class="modal-section">

        <span class="modal-label">
          Description
        </span>

        <div class="modal-value">
          ${escapeHtml(
            description
          )}
        </div>

      </div>

    </div>


    ${
      status === "accepted"
      ? `

        <div
          style="
            margin-top:16px;
            padding:13px;
            background:#ecfdf5;
            border:1px solid #a7f3d0;
            border-radius:11px;
            color:#047857;
            font-size:13px;
            line-height:1.5;
            font-weight:700;
          "
        >
          ✓ Customer has accepted this proposal.
        </div>

      `
      : ""
    }


    <div
      style="
        margin-top:15px;
        padding:12px;
        background:#f9fafb;
        border-radius:10px;
        color:#6b7280;
        font-size:12px;
        line-height:1.5;
      "
    >
      🔒 Customer contact details are kept private.
    </div>

  `;


  proposalModal.classList.add(
    "show"
  );

}


/* Close modal */

function closeProposalModal(){

  proposalModal.classList.remove(
    "show"
  );

}


/* Modal background click */

proposalModal.addEventListener(
  "click",
  function(event){

    if(
      event.target ===
      proposalModal
    ){

      closeProposalModal();

    }

  }
);


/* Escape key */

document.addEventListener(
  "keydown",
  function(event){

    if(
      event.key === "Escape"
    ){

      closeProposalModal();

    }

  }
);


/* Refresh */

async function refreshProposals(){

  if(
    !providerProfile ||
    !providerProfile.auth_user_id
  ){

    return;

  }


  await loadProviderProposals(
    providerProfile.auth_user_id
  );

}

  /* Close button */



/* Load everything */

async function init(){

  showLoading(
    "Checking provider account..."
  );


  try{

    const session =
      await getProviderSession();


    if(!session){

      window.location.href =
        "provider-login.html?return=provider-proposals.html";

      return;

    }


    const userId =
      session.user.id;


    showLoading(
      "Loading provider profile..."
    );


    providerProfile =
      await loadProviderProfile(
        userId
      );


    if(!providerProfile){

      showError(
        "Provider profile not found. Please complete your provider profile first."
      );

      return;

    }


    showLoading(
      "Loading your proposals..."
    );


    await loadProviderProposals(
      userId
    );

  }
  catch(error){

    console.error(
      "Provider proposals error:",
      error
    );


    showError(
      error.message ||
      "Unable to load your proposals."
    );

  }

}


/* Start page */

init();

</script>
