<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Pyncode.in - Live QR Login</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f7fb;
    color:#172033;
}

.header{
    width:100%;
    background:#ffffff;
    border-bottom:1px solid #e5e7eb;
    position:sticky;
    top:0;
    z-index:10;
}

.header-inner{
    max-width:1100px;
    margin:auto;
    min-height:64px;
    padding:0 18px;

    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    text-decoration:none;
    color:#111827;
    font-size:23px;
    font-weight:800;
    letter-spacing:-.5px;
}

.logo span{
    color:#2563eb;
}

.header-label{
    font-size:13px;
    font-weight:700;
    color:#64748b;
}

.page{
    min-height:calc(100vh - 64px);

    display:flex;
    justify-content:center;
    align-items:center;

    padding:30px 16px 50px;
}

.login-card{
    width:100%;
    max-width:430px;

    background:#ffffff;
    border-radius:20px;
    padding:28px 24px;

    box-shadow:
        0 10px 35px rgba(15,23,42,.08);
}

.login-icon{
    width:62px;
    height:62px;

    margin:0 auto 16px;

    border-radius:16px;

    background:#eff6ff;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:30px;
}

.login-title{
    text-align:center;

    font-size:25px;
    font-weight:800;

    color:#111827;

    margin-bottom:7px;
}

.login-subtitle{
    text-align:center;

    color:#64748b;

    font-size:14px;

    line-height:1.5;

    margin-bottom:24px;
}

.message{
    display:none;

    padding:12px 14px;

    border-radius:10px;

    margin-bottom:16px;

    font-size:13px;

    line-height:1.4;
}

.message.show{
    display:block;
}

.message.error{
    background:#fee2e2;
    color:#991b1b;
}

.message.success{
    background:#dcfce7;
    color:#166534;
}

.field{
    margin-bottom:16px;
}

.field label{
    display:block;

    margin-bottom:7px;

    font-size:13px;

    font-weight:700;

    color:#374151;
}

.field input{
    width:100%;

    padding:13px 14px;

    border:1px solid #d1d5db;

    border-radius:10px;

    outline:none;

    background:#ffffff;

    color:#111827;

    font-size:15px;

    transition:.2s;
}

.field input:focus{
    border-color:#2563eb;

    box-shadow:
        0 0 0 3px rgba(37,99,235,.10);
}

.password-wrap{
    position:relative;
}

.password-wrap input{
    padding-right:78px;
}

.password-toggle{
    position:absolute;

    right:8px;
    top:50%;

    transform:translateY(-50%);

    border:0;

    background:transparent;

    color:#2563eb;

    font-size:12px;

    font-weight:700;

    padding:7px;

    cursor:pointer;
}

.login-button{
    width:100%;

    border:0;

    border-radius:11px;

    padding:13px 16px;

    background:#2563eb;

    color:#ffffff;

    font-size:15px;

    font-weight:800;

    cursor:pointer;

    transition:.2s;
}

.login-button:hover{
    background:#1d4ed8;
}

.login-button:disabled{
    opacity:.6;

    cursor:not-allowed;
}

.info-box{
    margin-top:20px;

    padding:13px 14px;

    background:#f8fafc;

    border-radius:10px;

    color:#64748b;

    font-size:12px;

    line-height:1.6;

    text-align:center;
}

@media(max-width:600px){

    .header-inner{
        min-height:58px;
    }

    .logo{
        font-size:21px;
    }

    .header-label{
        font-size:12px;
    }

    .page{
        padding:22px 14px 35px;
    }

    .login-card{
        padding:25px 18px;
        border-radius:17px;
    }

    .login-title{
        font-size:23px;
    }

}

</style>

</head>

<body>

<header class="header">

    <div class="header-inner">

        <a
            href="index.html"
            class="logo"
        >
            Pyncode<span>.in</span>
        </a>

        <div class="header-label">
            Live QR
        </div>

    </div>

</header>


<main class="page">

    <section class="login-card">

        <div class="login-icon">
            📱
        </div>

        <div class="login-title">
            Live QR Login
        </div>

        <div class="login-subtitle">
            Login to manage your shop's
            Live QR products and prices.
        </div>

        <div
            id="message"
            class="message"
        ></div>

        <form id="loginForm">

            <div class="field">

                <label for="email">
                    Email Address
                </label>

                <input
                    id="email"
                    type="email"
                    autocomplete="email"
                    placeholder="Enter your email"
                    required
                >

            </div>

            <div class="field">

                <label for="password">
                    Password
                </label>

                <div class="password-wrap">

                    <input
                        id="password"
                        type="password"
                        autocomplete="current-password"
                        placeholder="Enter your password"
                        required
                    >

                    <button
                        type="button"
                        id="togglePassword"
                        class="password-toggle"
                    >
                        Show
                    </button>

                </div>

            </div>

            <button
                type="submit"
                id="loginButton"
                class="login-button"
            >
                Login
            </button>

        </form>

        <div class="info-box">
            This login is only for the Pyncode
            Live QR module.
        </div>

    </section>

</main>


<script>

/* =====================================================
   SUPABASE CONFIG
===================================================== */

const SUPABASE_URL =
    "https://mtuspuehsxsjoaxoenen.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_JpopjwDVjFvsDjXeG_56NQ_k3nA2mU6";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =====================================================
   ELEMENTS
===================================================== */

const loginForm =
    document.getElementById(
        "loginForm"
    );

const emailInput =
    document.getElementById(
        "email"
    );

const passwordInput =
    document.getElementById(
        "password"
    );

const loginButton =
    document.getElementById(
        "loginButton"
    );

const message =
    document.getElementById(
        "message"
    );

const togglePassword =
    document.getElementById(
        "togglePassword"
    );


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
    text,
    type
){

    message.textContent =
        text;

    message.className =
        "message show " + type;

}


/* =====================================================
   PASSWORD SHOW / HIDE
===================================================== */

togglePassword.addEventListener(
    "click",
    function(){

        if(
            passwordInput.type ===
            "password"
        ){

            passwordInput.type =
                "text";

            togglePassword.textContent =
                "Hide";

        }
        else{

            passwordInput.type =
                "password";

            togglePassword.textContent =
                "Show";

        }

    }
);

  /* =====================================================
   LOGIN
===================================================== */

loginForm.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();

        message.className =
            "message";


        const email =
            emailInput.value
                .trim()
                .toLowerCase();


        const password =
            passwordInput.value;


        if(!email){

            showMessage(
                "Please enter your email address.",
                "error"
            );

            emailInput.focus();

            return;

        }


        if(!password){

            showMessage(
                "Please enter your password.",
                "error"
            );

            passwordInput.focus();

            return;

        }


        loginButton.disabled =
            true;

        loginButton.textContent =
            "Logging in...";


        try{

            /* -----------------------------------------
               SUPABASE AUTH LOGIN
            ----------------------------------------- */

            const {
                data,
                error
            } =
            await supabaseClient
                .auth
                .signInWithPassword({

                    email:
                        email,

                    password:
                        password

                });


            if(error){

                throw error;

            }


            if(
                !data ||
                !data.user
            ){

                throw new Error(
                    "Login failed. Please try again."
                );

            }


            const authUser =
                data.user;


            /* -----------------------------------------
               VERIFY LIVE QR OWNER ACCOUNT
            ----------------------------------------- */

            const {
                data: ownerAccount,
                error: ownerError
            } =
            await supabaseClient
                .from(
                    "live_qr_owner_accounts"
                )
                .select(
                    "id, shop_id, auth_user_id, is_active"
                )
                .eq(
                    "auth_user_id",
                    authUser.id
                )
                .maybeSingle();


            if(ownerError){

                throw ownerError;

            }


            if(!ownerAccount){

                await supabaseClient
                    .auth
                    .signOut();


                throw new Error(
                    "This account is not registered for Pyncode Live QR."
                );

            }


            /* -----------------------------------------
               CHECK ACCOUNT STATUS
            ----------------------------------------- */

            if(
                ownerAccount.is_active !== true
            ){

                await supabaseClient
                    .auth
                    .signOut();


                throw new Error(
                    "Your Live QR account is inactive."
                );

            }


            /* -----------------------------------------
               VERIFY SHOP LINK
            ----------------------------------------- */

            if(
                !ownerAccount.shop_id
            ){

                await supabaseClient
                    .auth
                    .signOut();


                throw new Error(
                    "No shop is linked to this Live QR account."
                );

            }


            /* -----------------------------------------
               VERIFY SHOP
            ----------------------------------------- */

            const {
                data: shop,
                error: shopError
            } =
            await supabaseClient
                .from(
                    "shops"
                )
                .select(
                    "id, shop_name, live_qr_token, live_qr_enabled, live_qr_status"
                )
                .eq(
                    "id",
                    ownerAccount.shop_id
                )
                .maybeSingle();


            if(shopError){

                throw shopError;

            }


            if(!shop){

                await supabaseClient
                    .auth
                    .signOut();


                throw new Error(
                    "Your registered shop could not be found."
                );

            }


            /* -----------------------------------------
               LIVE QR ACCESS CHECK
            ----------------------------------------- */

            if(
                shop.live_qr_enabled !== true ||
                shop.live_qr_status !== "active"
            ){

                await supabaseClient
                    .auth
                    .signOut();


                throw new Error(
                    "Live QR access is not enabled for this shop."
                );

            }


            /* -----------------------------------------
               STORE SESSION DATA
            ----------------------------------------- */

            sessionStorage.setItem(
                "pyncode_live_qr_owner_id",
                String(
                    ownerAccount.id
                )
            );


            sessionStorage.setItem(
                "pyncode_live_qr_shop_id",
                String(
                    ownerAccount.shop_id
                )
            );


            sessionStorage.setItem(
                "pyncode_live_qr_token",
                String(
                    shop.live_qr_token
                )
            );


            sessionStorage.setItem(
                "pyncode_live_qr_logged_in",
                "true"
            );


            /* -----------------------------------------
               SUCCESS
            ----------------------------------------- */

            showMessage(
                "Login successful. Opening Live QR...",
                "success"
            );


            loginButton.textContent =
                "Login Successful";


            setTimeout(
                function(){

                    window.location.href =
                        "live-qr-owner.html";

                },
                700
            );

        }
        catch(error){

            console.error(
                "Live QR Login Error:",
                error
            );


            showMessage(
                error &&
                error.message
                    ? error.message
                    : "Unable to login. Please try again.",
                "error"
            );


            loginButton.disabled =
                false;

            loginButton.textContent =
                "Login";

        }

    }
);

  /* =====================================================
   AUTH SESSION CHECK
===================================================== */

async function checkExistingSession(){

    try{

        const {
            data,
            error
        } =
        await supabaseClient
            .auth
            .getSession();


        if(error){

            console.error(
                "Session check error:",
                error
            );

            return;

        }


        if(
            !data ||
            !data.session ||
            !data.session.user
        ){

            return;

        }


        const authUser =
            data.session.user;


        /* ---------------------------------------------
           CHECK LIVE QR OWNER ACCOUNT
        --------------------------------------------- */

        const {
            data: ownerAccount,
            error: ownerError
        } =
        await supabaseClient
            .from(
                "live_qr_owner_accounts"
            )
            .select(
                "id, shop_id, auth_user_id, is_active"
            )
            .eq(
                "auth_user_id",
                authUser.id
            )
            .maybeSingle();


        if(ownerError){

            console.error(
                "Live QR owner account check error:",
                ownerError
            );

            return;

        }


        if(!ownerAccount){

            return;

        }


        if(
            ownerAccount.is_active !== true
        ){

            return;

        }


        if(
            !ownerAccount.shop_id
        ){

            return;

        }


        /* ---------------------------------------------
           CHECK SHOP
        --------------------------------------------- */

        const {
            data: shop,
            error: shopError
        } =
        await supabaseClient
            .from(
                "shops"
            )
            .select(
                "id, shop_name, live_qr_token, live_qr_enabled, live_qr_status"
            )
            .eq(
                "id",
                ownerAccount.shop_id
            )
            .maybeSingle();


        if(shopError){

            console.error(
                "Shop session check error:",
                shopError
            );

            return;

        }


        if(!shop){

            return;

        }


        /* ---------------------------------------------
           LIVE QR ACCESS CHECK
        --------------------------------------------- */

        if(
            shop.live_qr_enabled !== true ||
            shop.live_qr_status !== "active"
        ){

            return;

        }


        /* ---------------------------------------------
           STORE SESSION DATA
        --------------------------------------------- */

        sessionStorage.setItem(
            "pyncode_live_qr_owner_id",
            String(
                ownerAccount.id
            )
        );


        sessionStorage.setItem(
            "pyncode_live_qr_shop_id",
            String(
                ownerAccount.shop_id
            )
        );


        sessionStorage.setItem(
            "pyncode_live_qr_token",
            String(
                shop.live_qr_token
            )
        );


        sessionStorage.setItem(
            "pyncode_live_qr_logged_in",
            "true"
        );


        /* ---------------------------------------------
           OPEN OWNER PAGE
        --------------------------------------------- */

        window.location.href =
            "live-qr-owner.html";

    }
    catch(error){

        console.error(
            "Existing Live QR session check failed:",
            error
        );

    }

}

  /* =====================================================
   AUTH STATE LISTENER
===================================================== */

supabaseClient
    .auth
    .onAuthStateChange(
        function(event){

            if(
                event ===
                "SIGNED_OUT"
            ){

                sessionStorage.removeItem(
                    "pyncode_live_qr_owner_id"
                );

                sessionStorage.removeItem(
                    "pyncode_live_qr_shop_id"
                );

                sessionStorage.removeItem(
                    "pyncode_live_qr_token"
                );

                sessionStorage.removeItem(
                    "pyncode_live_qr_logged_in"
                );

            }

        }
    );


/* =====================================================
   CHECK SESSION ON PAGE LOAD
===================================================== */

checkExistingSession();


/* =====================================================
   PREVENT DOUBLE LOGIN
===================================================== */

let loginInProgress =
    false;


loginForm.addEventListener(
    "submit",
    function(){

        if(loginInProgress){

            return;

        }

        loginInProgress =
            true;

        setTimeout(
            function(){

                loginInProgress =
                    false;

            },
            2000
        );

    },
    true
);

</script>

</body>

</html>
