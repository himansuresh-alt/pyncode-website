<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Housewarming Planner | Pyncode.in</title>

  <style>

    /* =========================================
       RESET
    ========================================= */

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }


    /* =========================================
       VARIABLES
    ========================================= */

    :root{

      --primary:#6750e8;

      --text:#202124;

      --muted:#70757d;

      --border:#ececf2;

      --white:#ffffff;

      --shadow:
        0 8px 30px
        rgba(40,35,80,0.08);

    }


    /* =========================================
       BODY
    ========================================= */

    body{

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

      background:
        linear-gradient(
          180deg,
          #ffffff 0%,
          #faf9ff 45%,
          #f8f8fc 100%
        );

      color:var(--text);

      min-height:100vh;

      padding-bottom:30px;
    }


    button,
    a{
      font-family:inherit;
    }


    a{
      text-decoration:none;
      color:inherit;
    }


    /* =========================================
       MAIN PAGE
    ========================================= */

    .planner-page{

      width:100%;

      max-width:720px;

      margin:0 auto;

      padding:
        18px 15px 80px;
    }


    /* =========================================
       PREMIUM HEADER
    ========================================= */

    .planner-header{

      position:sticky;

      top:0;

      z-index:1000;

      height:64px;

      margin:
        -18px -15px 18px;

      padding:
        0 16px;

      background:#ffffff;

      border-bottom:
        1px solid #eeeeee;

      display:flex;

      align-items:center;

      justify-content:space-between;

      gap:12px;

      box-shadow:
        0 2px 12px
        rgba(20,20,40,0.04);
    }


    /* =========================================
       PYNCODE BRAND
    ========================================= */

    .brand{

      font-size:21px;

      font-weight:800;

      letter-spacing:-0.5px;

      text-decoration:none;

      white-space:nowrap;
    }


    .pyn-text{

      color:#ef603e;
    }


    .code-text{

      color:#151923;
    }


    /* =========================================
       ADD BUSINESS
    ========================================= */

    .add-business-btn{

      display:inline-flex;

      align-items:center;

      justify-content:center;

      gap:6px;

      background:#000000;

      color:#ffffff;

      border:none;

      padding:10px 13px;

      border-radius:12px;

      font-size:13px;

      font-weight:700;

      box-shadow:
        0 5px 16px
        rgba(0,0,0,0.14);

      white-space:nowrap;

      transition:
        transform 0.15s ease,
        box-shadow 0.15s ease;
    }


    .add-business-btn:active{

      transform:
        scale(0.97);

      box-shadow:
        0 3px 10px
        rgba(0,0,0,0.12);
    }


    /* =========================================
       BACK BUTTON
    ========================================= */

    .back-btn{

      display:inline-flex;

      align-items:center;

      gap:7px;

      background:#ffffff;

      color:#34363b;

      padding:9px 13px;

      border:
        1px solid #e8e8ed;

      border-radius:12px;

      font-size:13px;

      font-weight:700;

      margin-bottom:18px;

      box-shadow:
        0 4px 12px
        rgba(30,30,50,0.06);

      text-decoration:none;

      transition:
        transform 0.15s ease,
        box-shadow 0.15s ease;
    }


    .back-btn:active{

      transform:
        scale(0.97);

      box-shadow:
        0 2px 7px
        rgba(30,30,50,0.05);
    }


    /* =========================================
       HERO
    ========================================= */

    .planner-hero{

      position:relative;

      overflow:hidden;

      background:
        linear-gradient(
          135deg,
          #fff7ed 0%,
          #fffaf5 50%,
          #f3efff 100%
        );

      border:
        1px solid #eee5f6;

      border-radius:24px;

      padding:24px 20px;

      margin-bottom:18px;

      box-shadow:var(--shadow);
    }


    .planner-hero::after{

      content:"";

      position:absolute;

      width:120px;

      height:120px;

      border-radius:50%;

      background:
        rgba(224,150,70,0.08);

      right:-45px;

      top:-45px;
    }


    .planner-icon{

      position:relative;

      z-index:1;

      width:58px;

      height:58px;

      display:flex;

      align-items:center;

      justify-content:center;

      background:#ffffff;

      border-radius:18px;

      font-size:29px;

      margin-bottom:15px;

      box-shadow:
        0 6px 18px
        rgba(80,55,110,0.10);
    }


    .planner-hero h1{

      position:relative;

      z-index:1;

      font-size:25px;

      line-height:1.2;

      font-weight:800;

      letter-spacing:-0.6px;

      margin-bottom:7px;

      color:#30293b;
    }


    .planner-hero p{

      position:relative;

      z-index:1;

      color:#716a78;

      font-size:14px;

      line-height:1.55;

      max-width:500px;
    }


    /* =========================================
       ACTION BUTTONS
    ========================================= */

    .action-row{

      display:grid;

      grid-template-columns:
        1fr 1fr;

      gap:10px;

      margin-bottom:28px;
    }


    .action-btn{

      min-height:52px;

      border-radius:15px;

      padding:13px 10px;

      font-size:14px;

      font-weight:750;

      cursor:pointer;

      text-align:center;

      display:flex;

      align-items:center;

      justify-content:center;

      gap:8px;

      transition:
        transform 0.15s ease,
        box-shadow 0.15s ease;
    }


    .action-btn:active{

      transform:
        scale(0.97);
    }


    .pdf-btn{

      background:#ffffff;

      color:#4f3dc4;

      border:
        1px solid #e3defd;

      box-shadow:
        0 5px 18px
        rgba(70,55,150,0.07);
    }


    .whatsapp-btn{

      background:#20b86b;

      color:#ffffff;

      border:none;

      box-shadow:
        0 7px 18px
        rgba(32,184,107,0.20);
    }


    /* =========================================
       SECTION HEADING
    ========================================= */

    .section-title{

      display:flex;

      align-items:center;

      gap:8px;

      font-size:18px;

      font-weight:800;

      color:#30293b;

      margin-bottom:13px;
    }


    .section-title::first-letter{
      font-size:17px;
    }


    .section-subtitle{

      display:none;
    }


    /* =========================================
       SERVICES
    ========================================= */

    .services-list{

      display:flex;

      flex-direction:column;

      gap:9px;
    }


    .service-item{

      background:#ffffff;

      border:
        1px solid var(--border);

      border-radius:16px;

      overflow:hidden;

      box-shadow:
        0 4px 16px
        rgba(40,35,80,0.045);

      transition:
        box-shadow 0.2s ease;
    }


    .service-item.active{

      box-shadow:
        0 7px 22px
        rgba(40,35,80,0.07);
    }


    .service-btn{

      width:100%;

      border:none;

      background:transparent;

      padding:15px 14px;

      display:flex;

      align-items:center;

      justify-content:space-between;

      gap:10px;

      cursor:pointer;

      color:#342e3e;

      font-size:14px;

      font-weight:700;

      text-align:left;
    }


    .service-name{

      flex:1;

      display:flex;

      align-items:center;

      gap:12px;

      min-width:0;
    }


    .service-icon{

      width:42px;

      height:42px;

      min-width:42px;

      display:inline-flex;

      align-items:center;

      justify-content:center;

      background:#f7f3ff;

      border-radius:13px;

      font-size:20px;
    }


    .service-arrow{

      color:#8a8d94;

      font-size:20px;

      transition:
        transform 0.2s ease;
    }


    .service-item.active
    .service-arrow{

      transform:
        rotate(180deg);
    }


    /* =========================================
       PROVIDERS
    ========================================= */

    .providers-box{

      display:none;

      padding:
        0 11px 11px;
    }


    .service-item.active
    .providers-box{

      display:block;
    }


    .provider-loading,
    .no-provider{

      background:#fafafe;

      border:
        1px solid #ececf5;

      border-radius:14px;

      padding:16px 10px;

      color:#858990;

      font-size:13px;

      text-align:center;
    }


    /* =========================================
       PROVIDER CARD
    ========================================= */

    .provider-card{

      background:#fafafe;

      border:
        1px solid #ececf5;

      border-radius:14px;

      padding:14px;

      margin-top:8px;
    }


    .provider-card:first-child{

      margin-top:0;
    }


    .provider-name{

      font-size:15px;

      font-weight:800;

      color:#332d3d;

      margin-bottom:4px;
    }


    .provider-owner{

      font-size:12px;

      color:#666a72;

      margin-bottom:5px;
    }


    .provider-location{

      font-size:12px;

      color:#777b83;

      margin-bottom:12px;
    }


    .provider-actions{

      display:grid;

      grid-template-columns:
        1fr 1fr;

      gap:8px;
    }


    .provider-action{

      min-height:39px;

      text-decoration:none;

      display:flex;

      align-items:center;

      justify-content:center;

      gap:6px;

      border-radius:10px;

      font-size:12px;

      font-weight:750;
    }


    .call-action{

      background:#eef5ff;

      color:#2873cf;
    }


    .wa-action{

      background:#eafaf2;

      color:#159457;
    }


    /* =========================================
       MOBILE
    ========================================= */

    @media (max-width:420px){

      .planner-page{

        padding:
          18px 12px 40px;
      }


      .planner-header{

        margin:
          -18px -12px 18px;

        height:62px;

        padding:
          0 12px;
      }


      .brand{

        font-size:19px;
      }


      .add-business-btn{

        padding:
          9px 10px;

        font-size:12px;

        border-radius:11px;
      }


      .back-btn{

        font-size:13px;

        margin-bottom:16px;
      }


      .planner-hero{

        padding:
          21px 17px;

        border-radius:21px;
      }


      .planner-icon{

        width:54px;

        height:54px;

        border-radius:17px;

        font-size:27px;
      }


      .planner-hero h1{

        font-size:23px;
      }


      .planner-hero p{

        font-size:13px;
      }


      .action-btn{

        min-height:50px;

        font-size:13px;
      }


      .section-title{

        font-size:17px;
      }

    }

    /* =========================================
   FIXED BACK TO PLANNER
========================================= */

.planner-fixed-back {

    position: fixed;

    left: 14px;
    right: 14px;

    bottom: calc(
        12px + env(safe-area-inset-bottom, 0px)
    );

    z-index: 2000;

    padding: 0;

    background: transparent;

    border: none;

    box-shadow: none;
}


.planner-fixed-back a {

    width: 100%;

    min-height: 50px;

    padding: 14px 20px;

    display: flex;

    align-items: center;

    justify-content: center;

    box-sizing: border-box;

    background:
        linear-gradient(
            135deg,
            #151d30,
            #252e43
        );

    color: #ffffff;

    border: none;

    border-radius: 14px;

    font-size: 13px;

    font-weight: 800;

    line-height: 1.2;

    text-decoration: none;

    box-shadow:
        0 5px 16px
        rgba(20,28,50,.18);

    transition:
        transform .12s ease,
        box-shadow .12s ease;
}


.planner-fixed-back a:active {

    transform: scale(.98);

    box-shadow:
        0 3px 10px
        rgba(20,28,50,.14);
}


/* No icon */

.planner-fixed-back-icon {

    display: none;
}

  </style>

</head>

  <body>


  <!-- =========================================
       MAIN PAGE
  ========================================= -->

  <main class="planner-page">


    <!-- =========================================
         HEADER
    ========================================= -->

    <header class="planner-header">


      <a
        href="planner.html"
        class="brand"
      >

        <span class="pyn-text">Pyn</span><span class="code-text">code.in</span>

      </a>


      <a
        href="add-business.html?return=housewarming-planner.html"
        class="add-business-btn"
      >

        <span>＋</span>

        Add Your Business

      </a>


    </header>

    <!-- =========================================
         HERO
    ========================================= -->

    <section class="planner-hero">


      <div class="planner-icon">

        🏠

      </div>


      <h1>

        Housewarming Planner

      </h1>


      <p>

        Plan your housewarming celebration easily
        and find useful service providers for your
        special day.

      </p>


    </section>


    <!-- =========================================
         ACTION BUTTONS
    ========================================= -->

    <div class="action-row">


      <button
        type="button"
        class="action-btn pdf-btn"
        onclick="downloadPlannerPDF()"
      >

        <span>📄</span>

        Download PDF

      </button>


      <button
        type="button"
        class="action-btn whatsapp-btn"
        onclick="sharePlannerWhatsApp()"
      >

        <span>💬</span>

        Share on WhatsApp

      </button>


    </div>


    <!-- =========================================
         SERVICES
    ========================================= -->

    <section>


      <h2 class="section-title">

        <span>🔎</span>

        Related Service Providers

      </h2>


      <div
        id="servicesList"
        class="services-list"
      >
      </div>


    </section>


  </main>


  <!-- =========================================
       JAVASCRIPT
  ========================================= -->

  <script>


    /* =========================================
       HOUSEWARMING SERVICES
    ========================================= */

    const HOUSEWARMING_SERVICES = [

      "Equipment Rental shops",

      "Catering",

      "Lighting & Sounds",

      "Digital Invitation",

      "Invitation Printing",

      "Pooja Matireals",

      "Return Gifts",

      "Photography & Videography"

    ];


    /* =========================================
       SERVICE ICONS
    ========================================= */

    const HOUSEWARMING_ICONS = [

      "🪑",

      "🍽️",

      "💡",

      "📱",

      "💌",

      "🪔",

      "🎁",

      "📸"

    ];


    /* =========================================
       SUPABASE
    ========================================= */

    const SUPABASE_URL =
      "https://mtuspuehsxsjoaxoenen.supabase.co";


    const SUPABASE_KEY =
      "sb_publishable_JpopjwDVjFvsDjXeG_56NQ_k3nA2mU6";


    let providerCache = {};


    /* =========================================
       NORMALIZE SERVICE
    ========================================= */

    function normalizeService(value){

      return String(value || "")

        .toLowerCase()

        .replace(/&/g, "and")

        .replace(/[^a-z0-9]+/g, " ")

        .trim()

        .replace(/\s+/g, " ");

    }


    /* =========================================
       CLEAN PHONE
    ========================================= */

    function cleanPhone(value){

      return String(value || "")

        .replace(/\D/g, "");

    }


    /* =========================================
       ESCAPE HTML
    ========================================= */

    function escapeHtml(value){

      return String(value ?? "")

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

    }


    /* =========================================
       RENDER SERVICES
    ========================================= */

    function renderServices(){

      const container =
        document.getElementById(
          "servicesList"
        );


      if(!container) return;


      container.innerHTML = "";


      HOUSEWARMING_SERVICES.forEach(

        (service,index) => {


          const item =
            document.createElement("div");


          item.className =
            "service-item";


          item.innerHTML = `

            <button
              type="button"
              class="service-btn"
              onclick="toggleService(${index})"
            >


              <span class="service-name">


                <span class="service-icon">

                  ${HOUSEWARMING_ICONS[index]}

                </span>


                <span>

                  ${escapeHtml(service)}

                </span>


              </span>


              <span class="service-arrow">

                ⌄

              </span>


            </button>


            <div
              class="providers-box"
              id="providers-${index}"
            >
            </div>

          `;


          container.appendChild(item);

        }

      );

    }


    /* =========================================
       TOGGLE SERVICE
    ========================================= */

    async function toggleService(index){

      const container =
        document.getElementById(
          "servicesList"
        );


      if(!container) return;


      const items =
        container.querySelectorAll(
          ".service-item"
        );


      const item =
        items[index];


      if(!item) return;


      const providersBox =
        document.getElementById(
          `providers-${index}`
        );


      if(!providersBox) return;


      const wasActive =
        item.classList.contains(
          "active"
        );


      /* Close all other services */

      items.forEach(
        serviceItem => {

          serviceItem.classList.remove(
            "active"
          );

        }
      );


      /* Close current service */

      if(wasActive){

        return;

      }


      /* Open selected service */

      item.classList.add(
        "active"
      );


      providersBox.innerHTML = `

        <div class="provider-loading">

          Finding service providers...

        </div>

      `;


      await loadProviders(

        HOUSEWARMING_SERVICES[index],

        providersBox

      );

    }


    /* =========================================
       LOAD PROVIDERS
    ========================================= */

    async function loadProviders(

      service,

      container

    ){

      const key =
        normalizeService(service);


      /* Use cached providers */

      if(

        Object.prototype.hasOwnProperty.call(

          providerCache,

          key

        )

      ){

        renderProviders(

          providerCache[key],

          container

        );

        return;

      }


      try{


        const response =

          await fetch(

            `${SUPABASE_URL}/rest/v1/planner_service_providers?active=eq.true&select=id,business_name,owner_name,mobile,whatsapp,area,city,services`,

            {

              method:"GET",

              headers:{

                "apikey":
                  SUPABASE_KEY,

                "Authorization":
                  `Bearer ${SUPABASE_KEY}`

              }

            }

          );


        if(!response.ok){

          throw new Error(

            `HTTP ${response.status}`

          );

        }


        const providers =
          await response.json();


        const matchingProviders =

          providers.filter(
            provider => {


              if(

                !Array.isArray(
                  provider.services
                )

              ){

                return false;

              }


              return provider.services.some(

                registeredService => {

                  return(

                    normalizeService(
                      registeredService
                    ) === key

                  );

                }

              );

            }

          );


        providerCache[key] =
          matchingProviders;


        renderProviders(

          matchingProviders,

          container

        );


      }catch(error){

        console.error(

          "Provider loading error:",

          error

        );


        container.innerHTML = `

          <div class="no-provider">

            Unable to load providers right now.
            Please try again.

          </div>

        `;

      }

    }

        /* =========================================
       RENDER PROVIDERS
    ========================================= */

    function renderProviders(

      providers,

      container

    ){

      if(

        !providers ||
        providers.length === 0

      ){

        container.innerHTML = `

          <div class="no-provider">

            No service providers available yet.

          </div>

        `;

        return;

      }


      container.innerHTML = "";


      providers.forEach(

        provider => {


          const businessName =

            escapeHtml(
              provider.business_name
            );


          const ownerName =

            escapeHtml(
              provider.owner_name
            );


          const area =

            escapeHtml(
              provider.area
            );


          const city =

            escapeHtml(
              provider.city
            );


          const mobile =

            cleanPhone(
              provider.mobile
            );


          const whatsapp =

            cleanPhone(

              provider.whatsapp ||
              provider.mobile

            );


          const card =

            document.createElement(
              "div"
            );


          card.className =
            "provider-card";


          card.innerHTML = `

            <div class="provider-name">

              ${businessName}

            </div>


            <div class="provider-owner">

              Owner: ${ownerName}

            </div>


            <div class="provider-location">

              📍 ${area}, ${city}

            </div>


            <div class="provider-actions">


              <a
                class="provider-action call-action"
                href="tel:${mobile}"
              >

                📞 Call

              </a>


              <a
                class="provider-action wa-action"
                href="https://wa.me/${whatsapp}"
                target="_blank"
                rel="noopener"
              >

                💬 WhatsApp

              </a>


            </div>

          `;


          container.appendChild(card);

        }

      );

    }


    /* =========================================
       DOWNLOAD PDF
    ========================================= */

    function downloadPlannerPDF(){

      const link =
        document.createElement("a");


      link.href =
        "Pyncode_Housewarming_Planner_Checklist.pdf";


      link.download =
        "Pyncode_Housewarming_Planner_Checklist.pdf";


      document.body.appendChild(link);


      link.click();


      link.remove();

    }


    /* =========================================
       WHATSAPP SHARE
    ========================================= */

    function sharePlannerWhatsApp(){

      const message =

        "🏠 Housewarming Planner - Pyncode.in\n\n" +

        "Plan your housewarming and find " +

        "related service providers easily.\n\n" +

        window.location.href;


      const whatsappUrl =

        `https://wa.me/?text=${encodeURIComponent(
          message
        )}`;


      window.open(

        whatsappUrl,

        "_blank"

      );

    }


    /* =========================================
       AUTO OPEN SERVICE
       AFTER ADD BUSINESS REDIRECT
    ========================================= */

    function openServiceFromURL(){

      const params =

        new URLSearchParams(

          window.location.search

        );


      const requestedService =

        params.get("service");


      if(!requestedService){

        return;

      }


      const requestedKey =

        normalizeService(
          requestedService
        );


      const index =

        HOUSEWARMING_SERVICES.findIndex(

          service => {

            return(

              normalizeService(
                service
              ) === requestedKey

            );

          }

        );


      if(index === -1){

        return;

      }


      setTimeout(() => {


        toggleService(index);


        const container =

          document.getElementById(
            "servicesList"
          );


        const items =

          container?.querySelectorAll(
            ".service-item"
          );


        const selectedItem =
          items?.[index];


        if(selectedItem){

          selectedItem.scrollIntoView({

            behavior:"smooth",

            block:"center"

          });

        }


      },250);

    }


    /* =========================================
       INITIALIZE
    ========================================= */

    document.addEventListener(

      "DOMContentLoaded",

      () => {


        renderServices();


        openServiceFromURL();


      }

    );
