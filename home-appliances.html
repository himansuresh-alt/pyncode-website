<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Pyncode - Home Appliances</title>

<style>

/* =========================
   RESET
========================= */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{

  font-family:
    Inter,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  background:#f8fafc;

  color:#0f172a;

  min-height:100vh;

  padding-bottom:90px;

}

button,
input,
textarea{

  font:inherit;

}

button{

  cursor:pointer;

}


/* =========================
   HEADER
========================= */

.topbar{

  position:sticky;

  top:0;

  z-index:100;

  height:62px;

  display:flex;

  align-items:center;

  justify-content:space-between;

  padding:0 16px;

  background:#ffffff;

  border-bottom:
    1px solid #e2e8f0;

}

.brand{

  position:relative;

  font-size:21px;
  font-weight:950;
  letter-spacing:-.7px;
  color:#111827;

}

.brand-pyn{
    color:#f97316;
}

.brand-code{
    color:#111827;
}

.login-top{

  height:38px;
  padding:0 17px;
  border:0;
  border-radius:999px;
  background:#f97316;
  color:#ffffff;
  font-size:12px;
  font-weight:900;
  box-shadow:0 6px 16px rgba(249,115,22,.22);

}

.login-top:active{
  transform:scale(.96);
}


/* =========================
   HERO
========================= */
.hero{
    position:relative;
    overflow:hidden;
    margin:14px 12px 0;
    padding:30px 22px;
    border-radius:22px;
    background:
        linear-gradient(135deg,#111827 0%,#1e293b 65%,#273449 100%);
    color:#fff;
    box-shadow:
        0 12px 30px rgba(15,23,42,.16);
}

.hero::before{
    content:"";
    position:absolute;
    width:180px;
    height:180px;
    border-radius:50%;
    background:rgba(249,115,22,.18);
    right:-55px;
    top:-75px;
}

.hero::after{
    content:"";
    position:absolute;
    width:90px;
    height:90px;
    border-radius:50%;
    border:1px solid rgba(249,115,22,.35);
    right:55px;
    bottom:-45px;
}

.hero-inner{
    position:relative;
    z-index:2;
    width:100%;
    max-width:720px;
    margin:0 auto;
}

.hero h1{
    font-size:28px;
    line-height:1.18;
    font-weight:950;
    letter-spacing:-.8px;
}

.hero p{
    margin-top:10px;
    max-width:600px;
    font-size:13px;
    line-height:1.6;
    color:rgba(255,255,255,.82);
}

/* =========================
   MAIN
========================= */

.container{

  width:100%;

  max-width:720px;

  margin:0 auto;

  padding:18px 14px 30px;

}


/* =========================
   CARD
========================= */

.card{
  position:relative;
  background:#ffffff;
  border:1px solid #e5e7eb;
  border-radius:18px;
  padding:20px;
  margin-bottom:16px;
  box-shadow:0 8px 28px rgba(15,23,42,.055);
}

.card-title{
  font-size:18px;
  font-weight:950;
  letter-spacing:-.3px;
  color:#111827;
}

.card-subtitle{
  margin-top:6px;
  color:#64748b;
  font-size:12px;
  line-height:1.55;
}


/* =========================
   OPTIONS
========================= */

.options{

  display:grid;

  grid-template-columns:
    repeat(2,minmax(0,1fr));

  gap:10px;

  margin-top:16px;

}

.option{
  min-height:56px;
  padding:11px 13px;
  border:1px solid #e2e8f0;
  border-radius:13px;
  background:#ffffff;
  color:#1e293b;
  font-size:13px;
  font-weight:850;
  text-align:left;
  transition:.18s ease;
  box-shadow:0 3px 10px rgba(15,23,42,.035);
}

.option:hover{
  border-color:#fb923c;
  background:#fff7ed;
  transform:translateY(-1px);
}

.option:active{
  transform:scale(.97);
}

.option.selected{
  border-color:#f97316;
  background:#fff7ed;
  color:#c2410c;
  box-shadow:0 4px 14px rgba(249,115,22,.12);
}


/* =========================
   FIELD
========================= */

.field{

  margin-top:16px;

}

.field label{

  display:block;

  margin-bottom:7px;

  font-size:12px;

  font-weight:900;

  color:#334155;

}

.field input,
.field textarea{

  width:100%;

  border:
    1px solid #dbe3ef;

  border-radius:9px;

  background:#ffffff;

  color:#0f172a;

  padding:12px;

  outline:none;

  font-size:13px;

}

.field input:focus,
.field textarea:focus{

  border-color:#60a5fa;

  box-shadow:
    0 0 0 3px
    rgba(59,130,246,.10);

}

.field textarea{

  min-height:90px;

  resize:vertical;

}


/* =========================
   TWO FIELDS
========================= */

.two-fields{

  display:grid;

  grid-template-columns:
    repeat(2,minmax(0,1fr));

  gap:10px;

}


/* =========================
   COUNTER
========================= */

.counter{

  display:flex;

  align-items:center;

  justify-content:space-between;

  width:100%;

  min-height:48px;

  padding:5px;

  border:
    1px solid #dbe3ef;

  border-radius:10px;

  background:#f8fafc;

}

.counter button{

  width:40px;

  height:38px;

  border:0;

  border-radius:8px;

  background:#ffffff;

  color:#2563eb;

  font-size:20px;

  font-weight:900;

  box-shadow:
    0 2px 7px
    rgba(15,23,42,.08);

}

.counter span{

  min-width:80px;

  text-align:center;

  font-size:15px;

  font-weight:950;

}


/* =========================
   DATE BUTTON
========================= */

.date-button{

  width:100%;

  min-height:48px;

  padding:0 13px;

  display:flex;

  align-items:center;

  justify-content:space-between;

  border:
    1px solid #dbe3ef;

  border-radius:10px;

  background:#ffffff;

  color:#334155;

  font-size:13px;

  font-weight:750;

}

.date-button span:last-child{

  color:#2563eb;

  font-weight:900;

}


/* =========================
   PREVIEW
========================= */

.preview-box{

  margin-top:14px;

  padding:16px;

  border:
    1px solid #dbeafe;

  border-radius:12px;

  background:#f8fbff;

}

.preview-label{

  font-size:10px;

  font-weight:950;

  color:#64748b;

  text-transform:uppercase;

  letter-spacing:.6px;

}

.preview-title{

  margin-top:6px;

  font-size:18px;

  font-weight:950;

}

.preview-subtitle{

  margin-top:5px;

  color:#2563eb;

  font-size:13px;

  font-weight:900;

}

.preview-details{

  margin-top:12px;

  padding-top:11px;

  border-top:
    1px solid #e2e8f0;

  font-size:13px;

  line-height:1.8;

  color:#334155;

}


/* =========================
   POST BUTTON
========================= */

.post-btn{

  width:100%;

  min-height:50px;

  margin-top:14px;

  border:0;

  border-radius:10px;

  background:#2563eb;

  color:#ffffff;

  font-size:14px;

  font-weight:950;

  box-shadow:
    0 8px 20px
    rgba(37,99,235,.20);

}

.post-btn:disabled{

  opacity:.45;

  cursor:not-allowed;

}


/* =========================
   BOTTOM BAR
========================= */

.bottom{

  position:fixed;

  left:0;

  right:0;

  bottom:0;

  z-index:90;

  padding:10px 14px;

  background:
    rgba(255,255,255,.96);

  border-top:
    1px solid #e2e8f0;

  backdrop-filter:
    blur(10px);

}

.bottom-btn{

  width:100%;

  max-width:720px;

  margin:auto;

  display:block;

  min-height:48px;

  border:0;

  border-radius:10px;

  background:#0f172a;

  color:#ffffff;

  font-size:14px;

  font-weight:950;

}


/* =========================
   LOGIN MODAL
========================= */

.modal{

  position:fixed;

  inset:0;

  z-index:200;

  display:none;

  align-items:center;

  justify-content:center;

  padding:18px;

  background:
    rgba(15,23,42,.48);

}

.modal.show{

  display:flex;

}

.modal-box{

  width:100%;

  max-width:390px;

  padding:20px;

  border-radius:15px;

  background:#ffffff;

  box-shadow:
    0 20px 60px
    rgba(15,23,42,.22);

}

.modal-title{

  font-size:20px;

  font-weight:950;

}

.modal-text{

  margin-top:6px;

  color:#64748b;

  font-size:12px;

  line-height:1.5;

}

.modal-actions{

  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:9px;

  margin-top:14px;

}

.modal-cancel,
.modal-save{

  height:44px;

  border-radius:9px;

  font-size:13px;

  font-weight:900;

}

.modal-cancel{

  border:
    1px solid #dbe3ef;

  background:#ffffff;

  color:#475569;

}

.modal-save{

  border:0;

  background:#2563eb;

  color:#ffffff;

}


/* =========================
   DATE MODAL
========================= */

.date-modal{

  position:fixed;

  inset:0;

  z-index:300;

  display:flex;

  align-items:center;

  justify-content:center;

  padding:18px;

  background:
    rgba(15,23,42,.48);

}

.date-box{

  width:100%;

  max-width:370px;

  padding:17px;

  border-radius:15px;

  background:#ffffff;

  box-shadow:
    0 20px 60px
    rgba(15,23,42,.22);

}

.date-head{

  display:grid;

  grid-template-columns:
    42px 1fr 42px;

  align-items:center;

  gap:8px;

}

.month-btn{

  width:40px;

  height:38px;

    border:
    1px solid #e2e8f0;

  border-radius:8px;

  background:#ffffff;

  font-size:22px;

  color:#334155;

}

.month-title{

  text-align:center;

  font-size:15px;

  font-weight:950;

}

.weekdays{

  display:grid;

  grid-template-columns:
    repeat(7,1fr);

  gap:4px;

  margin-top:15px;

}

.weekday{

  text-align:center;

  font-size:9px;

  font-weight:900;

  color:#94a3b8;

}

.calendar-days{

  display:grid;

  grid-template-columns:
    repeat(7,1fr);

  gap:4px;

  margin-top:6px;

}

.day-btn{

  height:40px;

  border:0;

  border-radius:8px;

  background:#ffffff;

  color:#334155;

  font-size:12px;

  font-weight:800;

}

.day-btn.today{

  border:
    1px solid #93c5fd;

}

.day-btn.selected{

  background:#2563eb;

  color:#ffffff;

}

.date-actions{

  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:9px;

  margin-top:14px;

}

.date-cancel,
.date-ok{

  height:44px;

  border-radius:9px;

  font-size:13px;

  font-weight:900;

}

.date-cancel{

  border:
    1px solid #dbe3ef;

  background:#ffffff;

  color:#475569;

}

.date-ok{

  border:0;

  background:#2563eb;

  color:#ffffff;

}


.field input:focus,
.field textarea:focus{
  border-color:#f97316;
  box-shadow:0 0 0 3px rgba(249,115,22,.10);
}

.counter{ border-color:#e5e7eb; background:#f8fafc; }
.counter button{ color:#f97316; }
.date-button{ border-color:#e5e7eb; }
.date-button span:last-child{ color:#f97316; }
.preview-box{ border-color:#fed7aa; background:#fffaf5; }
.preview-subtitle{ color:#ea580c; }
.post-btn{ border:0; border-radius:13px; background:linear-gradient(135deg,#f97316,#ea580c); color:#fff; font-size:14px; font-weight:950; box-shadow:0 9px 22px rgba(249,115,22,.22); }
.modal-save{ background:#f97316; }
.date-ok{ background:#f97316; }
.day-btn.selected{ background:#f97316; }
.bottom-btn{ border-radius:13px; background:#111827; box-shadow:0 8px 22px rgba(15,23,42,.16); }


/* =========================
   MOBILE
========================= */

@media(max-width:480px){

  .hero h1{

    font-size:25px;

  }

  .options{

    grid-template-columns:
      1fr 1fr;

  }

  .two-fields{

    grid-template-columns:1fr;

  }

  .card{

    padding:15px;

  }

}

</style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header class="topbar">

  <div class="brand">
    <span class="brand-pyn">Pyn</span><span class="brand-code">code.in</span>
  </div>

  <button
    type="button"
    class="login-top"
    onclick="openLogin()"
  >
    Login
  </button>

</header>


<!-- =========================
     HERO
========================= -->

<section class="hero">

  <div class="hero-inner">

    <h1>
      Home Appliances
    </h1>

    <p>
      Tell us what appliance you
      need and what service you are
      looking for.
    </p>

  </div>

</section>


<!-- =========================
     MAIN
========================= -->

<main>

  <div class="container">

    <div id="formArea"></div>

    <div id="previewArea"></div>

  </div>

</main>


<!-- =========================
     BOTTOM
========================= -->

<div class="bottom">

  <button
    type="button"
    class="bottom-btn"
    onclick="scrollToForm()"
  >
    ＋ Add Requirement
  </button>

</div>


<!-- =========================
     LOGIN MODAL
========================= -->

<div
  id="loginModal"
  class="modal"
>

  <div class="modal-box">

    <div class="modal-title">
      Login to Pyncode
    </div>

    <div class="modal-text">
      Enter your mobile number to
      post your appliance requirement.
    </div>

    <div class="field">

      <label>
        Mobile Number
      </label>

      <input
        id="loginMobile"
        type="tel"
        inputmode="numeric"
        maxlength="10"
        placeholder="10 digit mobile number"
      >

    </div>

    <div class="modal-actions">

      <button
        type="button"
        class="modal-cancel"
        onclick="closeLogin()"
      >
        Cancel
      </button>

      <button
        type="button"
        class="modal-save"
        onclick="saveLogin()"
      >
        Continue
      </button>

    </div>

  </div>

</div>


<script>


/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
  "https://mtuspuehsxsjoaxoenen.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_JpopjwDVjFvsDjXeG_56NQ_k3nA2mU6";


/* =========================
   STATE
========================= */

const state = {

  appliance:"",

  requirementType:"",

  applianceDetails:{},

  quantity:1,

  requiredDate:"",

  location:"",

  additional:""

};


let calendarDate =
  new Date();

let selectedCalendarDate =
  null;


/* =========================
   HELPER
========================= */

function $(id){

  return document.getElementById(id);

}

/* =========================
   SCROLL
========================= */

function scrollToForm(){

  window.scrollTo({

    top:0,

    behavior:"smooth"

  });

}


/* =========================
   INITIAL
========================= */

renderApplianceSelection();


/* =========================
   APPLIANCE SELECTION
========================= */

function renderApplianceSelection(){

  $("formArea").innerHTML = `

    <section class="card">

      <div class="card-title">
        What appliance do you need?
      </div>

      <div class="card-subtitle">
        Select one home appliance.
      </div>

      <div class="options">

        ${option(
          "AC",
          "selectAppliance('AC')"
        )}

        ${option(
          "Refrigerator",
          "selectAppliance('Refrigerator')"
        )}

        ${option(
          "Washing Machine",
          "selectAppliance('Washing Machine')"
        )}

        ${option(
          "TV",
          "selectAppliance('TV')"
        )}

        ${option(
          "Microwave Oven",
          "selectAppliance('Microwave Oven')"
        )}

        ${option(
          "Water Heater / Geyser",
          "selectAppliance('Water Heater / Geyser')"
        )}

        ${option(
          "Water Purifier",
          "selectAppliance('Water Purifier')"
        )}

        ${option(
          "Air Cooler",
          "selectAppliance('Air Cooler')"
        )}

        ${option(
          "Dishwasher",
          "selectAppliance('Dishwasher')"
        )}

        ${option(
          "Chimney",
          "selectAppliance('Chimney')"
        )}

        ${option(
          "Induction Stove",
          "selectAppliance('Induction Stove')"
        )}

        ${option(
          "Mixer Grinder",
          "selectAppliance('Mixer Grinder')"
        )}

        ${option(
          "Other Appliance",
          "selectAppliance('Other Appliance')"
        )}

      </div>

    </section>

    <section
      id="detailsArea"
    ></section>

  `;

}


/* =========================
   OPTION BUTTON
========================= */

function option(
  text,
  callback
){

  return `

    <button
      type="button"
      class="option"
      onclick="${callback}"
    >
      ${text}
    </button>

  `;

}


/* =========================
   SELECT APPLIANCE
========================= */

function selectAppliance(
  appliance
){

  state.appliance =
    appliance;

  state.requirementType =
    "";

  state.applianceDetails =
    {};

  state.quantity =
    1;

  state.requiredDate =
    "";

  state.location =
    "";

  state.additional =
    "";


  renderRequirementTypes();

  updatePreview();

}

  /* =========================
   REQUIREMENT TYPES
========================= */

function renderRequirementTypes(){

  const area =
    $("detailsArea");

  let options = [];


  if(state.appliance === "AC"){

    options = [
      "New AC",
      "Used AC",
      "AC Service",
      "AC Repair",
      "AC Installation",
      "AC Uninstallation",
      "AC AMC"
    ];

  }

  else if(
    state.appliance ===
    "Refrigerator"
  ){

    options = [
      "New",
      "Used",
      "Service",
      "Repair",
      "Installation",
      "Uninstallation",
      "AMC / Maintenance"
    ];

  }

  else if(
    state.appliance ===
    "Washing Machine"
  ){

    options = [
      "New",
      "Used",
      "Service",
      "Repair",
      "Installation",
      "Uninstallation",
      "AMC / Maintenance"
    ];

  }

  else if(
    state.appliance === "TV"
  ){

    options = [
      "New",
      "Used",
      "Service",
      "Repair",
      "Installation",
      "Uninstallation",
      "AMC / Maintenance"
    ];

  }

  else if(
    state.appliance ===
    "Microwave Oven"
  ){

    options = [
      "New",
      "Used",
      "Service",
      "Repair",
      "Installation",
      "AMC / Maintenance"
    ];

  }

  else{

    options = [
      "New",
      "Used",
      "Service",
      "Repair",
      "Installation",
      "Uninstallation",
      "AMC / Maintenance"
    ];

  }


  area.innerHTML = `

    <section class="card">

      <div class="card-title">
        What do you need?
      </div>

      <div class="card-subtitle">
        Select your requirement for
        ${escapeHtml(
          state.appliance
        )}.
      </div>

      <div class="options">

        ${options.map(
          item =>
            option(
              item,
              `selectRequirement('${escapeJs(item)}')`
            )
        ).join("")}

      </div>

    </section>

  `;

}


/* =========================
   SELECT REQUIREMENT
========================= */

function selectRequirement(
  requirement
){

  state.requirementType =
    requirement;

  state.applianceDetails =
    {};

  state.quantity =
    1;

  state.requiredDate =
    "";

  state.location =
    "";

  state.additional =
    "";


  renderApplianceDetails();

  updatePreview();

}


/* =========================
   APPLIANCE DETAILS
========================= */

function renderApplianceDetails(){

  const area =
    $("detailsArea");


  let html = `

    <section class="card">

      <div class="card-title">
        ${escapeHtml(
          state.appliance
        )} Details
      </div>

      <div class="card-subtitle">
        Select the details that match
        your requirement.
      </div>

  `;


  /* =========================
     AC
  ========================= */

  if(state.appliance === "AC"){

    html += `

      <div class="field">

        <label>
          AC Type
        </label>

        <div class="options">

          ${option(
            "Split",
            "chooseDetail('acType','Split')"
          )}

          ${option(
            "Window",
            "chooseDetail('acType','Window')"
          )}

          ${option(
            "Cassette",
            "chooseDetail('acType','Cassette')"
          )}

          ${option(
            "Ductable",

                        "chooseDetail('acType','Ductable')"
          )}

          ${option(
            "Any",
            "chooseDetail('acType','Any')"
          )}

        </div>

      </div>


      <div class="field">

        <label>
          Capacity
        </label>

        <div class="options">

          ${option(
            "1 Ton",
            "chooseDetail('capacity','1 Ton')"
          )}

          ${option(
            "1.5 Ton",
            "chooseDetail('capacity','1.5 Ton')"
          )}

          ${option(
            "2 Ton",
            "chooseDetail('capacity','2 Ton')"
          )}

          ${option(
            "2.5 Ton",
            "chooseDetail('capacity','2.5 Ton')"
          )}

          ${option(
            "3 Ton",
            "chooseDetail('capacity','3 Ton')"
          )}

          ${option(
            "Any",
            "chooseDetail('capacity','Any')"
          )}

        </div>

      </div>

    `;

  }


  /* =========================
     REFRIGERATOR
  ========================= */

  else if(
    state.appliance ===
    "Refrigerator"
  ){

    html += `

      <div class="field">

        <label>
          Refrigerator Type
        </label>

        <div class="options">

          ${option(
            "Single Door",
            "chooseDetail('applianceType','Single Door')"
          )}

/* =========================
   RENDER CALENDAR
========================= */

function renderCalendar(){

  const monthElement =
    $("calendarMonth");

  const daysElement =
    $("calendarDays");


  if(
    !monthElement ||
    !daysElement
  ){

    return;

  }


  const year =
    calendarDate.getFullYear();

  const month =
    calendarDate.getMonth();


  const monthName =
    calendarDate.toLocaleString(
      "en-IN",
      {
        month:"long",
        year:"numeric"
      }
    );


  monthElement.textContent =
    monthName;


  daysElement.innerHTML =
    "";


  const firstDay =
    new Date(
      year,
      month,
      1
    ).getDay();


  const totalDays =
    new Date(
      year,
      month + 1,
      0
    ).getDate();


  const today =
    new Date();

  today.setHours(
    0,0,0,0
  );


  /* Empty spaces */

  for(
    let i = 0;
    i < firstDay;
    i++
  ){

    const empty =
      document.createElement(
        "div"
      );

    empty.className =
      "day-empty";

    daysElement.appendChild(
      empty
    );

  }


  /* Days */

  for(
    let day = 1;
    day <= totalDays;
    day++
  ){

    const button =
      document.createElement(
        "button"
      );

    button.type =
      "button";

    button.className =
      "day-btn";

    button.textContent =
      day;


    const current =
      new Date(
        year,
        month,
        day
      );

    current.setHours(
      0,0,0,0
    );


    /* Disable past dates */

    if(
      current < today
    ){

      button.disabled =
        true;

      button.classList.add(
        "disabled"
      );

    }


    /* Today */

    if(
      current.getTime() ===
      today.getTime()
    ){

      button.classList.add(
        "today"
      );

    }


    /* Selected date */

    if(
      selectedCalendarDate &&
      current.getFullYear() ===
        selectedCalendarDate.getFullYear() &&
      current.getMonth() ===
        selectedCalendarDate.getMonth() &&
      current.getDate() ===
        selectedCalendarDate.getDate()
    ){

      button.classList.add(
        "selected"
      );

          }


    button.onclick =
      function(){

        if(
          this.disabled
        ){

          return;

        }

        selectedCalendarDate =
          new Date(current);

        renderCalendar();

      };


    daysElement.appendChild(
      button
    );

  }

}

/* =========================

========================= */

function formatDisplayDate(
  value
){

  if(!value){

    return "";

  }


  const date =
    new Date(
      value + "T00:00:00"
    );


  if(
    Number.isNaN(
      date.getTime()
    )
  ){

    return value;

  }


  return date.toLocaleDateString(
    "en-IN",
    {
      day:"2-digit",
      month:"short",
      year:"numeric"
    }
  );

}

/* =========================
   PRETTIFY KEY
========================= */

function prettifyKey(
  key
){

  const map = {

    acType:
      "AC Type",

    capacity:
      "Capacity",

    applianceType:
      "Appliance Type",

    tvType:
      "TV Type",

    screenSize:
      "Screen Size"

  };


  return map[key] ||
    key
      .replace(
        /([A-Z])/g,
        " $1"
      )
      .replace(
        /^./,
        char =>
          char.toUpperCase()
      );

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(
  value
){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


/* =========================
   ESCAPE JS
========================= */

function escapeJs(
  value
){

  return String(
    value
  )
  .replace(
    /\\/g,
    "\\\\"
  )
  .replace(
    /'/g,
    "\\'"
  );

}

      );

========================= */

  const mobile =
    localStorage.getItem(
      "pyncode_mobile"
    );

  return !!(
    mobile &&
    /^\d{10}$/.test(
      mobile
    )
  );

}


/* =========================
   POST REQUIREMENT
========================= */

async function postRequirement(){

  /* Appliance required */

  if(
    !state.appliance
  ){

    alert(
      "Please select an appliance."
    );

    window.scrollTo({
      top:0,
      behavior:"smooth"
    });

    return;

  }


  /* Requirement type required */

  if(
    !state.requirementType
  ){

    alert(
      "Please select what you need."
    );

    const details =
      $("detailsArea");

    if(details){

      details.scrollIntoView({
        behavior:"smooth",
        block:"start"
      });

    }

    return;

  }


  /* Location required */

  if(
    !state.location.trim()
  ){

    const locationInput =
      $("locationInput");

    alert(
      "Please enter your location."
    );

    if(locationInput){

      locationInput.focus();

    }

    return;

  }


  /* Login check */

  if(
    !isLoggedIn()
  ){

    openLogin();

    return;

  }


  const mobile =
    localStorage.getItem(
      "pyncode_mobile"
    );


  /* Build description */

  const detailLines = [];


  Object.entries(
    state.applianceDetails
  ).forEach(
    ([key,value]) => {

      if(
        value !== undefined &&
        value !== null &&
        String(value).trim() !== ""
      ){

        detailLines.push(
          `${prettifyKey(key)}: ${value}`
        );

      }

    }
  );


  const descriptionParts = [

    `Appliance: ${state.appliance}`,

    `Requirement: ${state.requirementType}`,

    ...detailLines,

    `Quantity: ${state.quantity}`,

    state.requiredDate
      ? `Required Date: ${formatDisplayDate(state.requiredDate)}`
      : "Required Date: Not specified",

    `Location: ${state.location}`,

    state.additional.trim()
      ? `Additional Requirement: ${state.additional.trim()}`
      : ""

  ].filter(Boolean);


  const title =
    `${state.appliance} - ${state.requirementType}`;


  const payload = {

    mobile:
      mobile,

    category:
      "homeappliances",

    location:
      state.location.trim(),

    title:
      title,

    description:
      descriptionParts.join(
        "\n"
      ),

    required_date:
      state.requiredDate ||
      null,

    quantity:
      String(
        state.quantity
      )

  };


  const postButton =
    document.querySelector(
      ".post-btn"
    );


  if(postButton){

    postButton.disabled =
      true;

    postButton.textContent =
      "Posting...";

  }

    try{

    const response =
      await fetch(
        `${SUPABASE_URL}/rest/v1/requirements`,
        {
          method:"POST",

          headers:{
            "apikey":
              SUPABASE_KEY,

            "Authorization":
              `Bearer ${SUPABASE_KEY}`,

            "Content-Type":
              "application/json",

            "Prefer":
              "return=minimal"
          },

          body:
            JSON.stringify(
              payload
            )
        }
      );


    if(
      !response.ok
    ){

      let errorMessage =
        "Unable to post requirement.";

      try{

        const errorData =
          await response.json();

        if(
          errorData &&
          errorData.message
        ){

          errorMessage =
            errorData.message;

        }

        else if(
          errorData &&
          errorData.error_description
        ){

          errorMessage =
            errorData.error_description;

        }

      }catch(error){

        /* Keep default error message */

      }


      throw new Error(
        errorMessage
      );

    }


    alert(
      "Requirement posted successfully!"
    );


    window.location.href =
      "enquiry.html";


  }catch(error){

    console.error(
      "Post requirement error:",
      error
    );


    alert(
      error.message ||
      "Something went wrong while posting your requirement."
    );


    if(postButton){

      postButton.disabled =
        false;

      postButton.textContent =
        "Post Requirement";

    }

  }

}

  /* =========================
   OPTION SELECTION UI
========================= */

function refreshSelectedOptions(){

  const buttons =
    document.querySelectorAll(
      ".option"
    );


  buttons.forEach(
    button => {

      button.classList.remove(
        "selected"
      );

    }
  );


  /*
    Mark the currently selected
    appliance.
  */

  document
    .querySelectorAll(
      ".option"
    )
    .forEach(
      button => {

        const text =
          button.textContent
            .trim();


        if(
          text ===
          state.appliance
        ){

          button.classList.add(
            "selected"
          );

        }


        if(
          text ===
          state.requirementType
        ){

          button.classList.add(
            "selected"
          );

        }

      }
    );


  /*
    Appliance detail selections
  */

  Object.values(
    state.applianceDetails
  )
  .forEach(
    value => {

      document
        .querySelectorAll(
          ".option"
        )
        .forEach(
          button => {

            if(
              button.textContent
                .trim() ===
              String(value)
            ){

              button.classList.add(
                "selected"
              );

            }

          }
        );

    }
  );

}

/* =========================
   DATE BUTTON UPDATE
========================= */

function refreshDateButton(){

  const button =
    document.querySelector(
      ".date-button"
    );

  if(!button){
    return;
  }


  const span =
    button.querySelector(
      "span"
    );

    state.requiredDate
      ? formatDisplayDate(
          state.requiredDate

/* =========================
   LOCATION VALUE SYNC
========================= */

function syncLocationValue(){

  const input =
    $("locationInput");

  if(
    input &&
    input.value !==
    state.location
  ){

    state.location =
      input.value;

  }

}


/* =========================
   ADDITIONAL VALUE SYNC
========================= */

function syncAdditionalValue(){

  const input =
    $("additionalInput");

  if(
    input &&
    input.value !==
    state.additional
  ){

    state.additional =
      input.value;

  }

}


/* =========================
   BEFORE POST VALIDATION
========================= */

function validateRequirement(){

  if(
    !state.appliance
  ){

    return {
      valid:false,
      message:
        "Please select an appliance."
    };

  }


  if(
    !state.requirementType
  ){

    return {
      valid:false,
      message:
        "Please select what you need."
    };

  }


  syncLocationValue();

  syncAdditionalValue();


  if(
    !state.location.trim()
  ){

    return {
      valid:false,
      message:
        "Please enter your location."
    };

  }


  if(
    state.quantity < 1
  ){

    return {
      valid:false,
      message:
        "Please select a valid quantity."
    };

  }


  return {
    valid:true,
    message:""
  };

}


/* =========================
   PATCH POST VALIDATION
========================= */

const originalPostRequirement =
  postRequirement;


postRequirement =
  async function(){

    const validation =
      validateRequirement();


    if(
      !validation.valid
    ){

      alert(
        validation.message
      );

      return;

    }


    await originalPostRequirement();

  };

========================= */

    if(

========================= */

function focusRequirementForm(){

  if(

  ){

    });

  }

/* =========================
   PREVENT DOUBLE POST
========================= */

let postingInProgress =
  false;


const originalPostFunction =
  postRequirement;


postRequirement =
  async function(){

    if(
      postingInProgress
    ){

      return;

    }


    const validation =
      validateRequirement();


    if(
      !validation.valid
    ){

      alert(
        validation.message
      );

      return;

    }


    if(
      !isLoggedIn()
    ){

      openLogin();

      return;

    }


    postingInProgress =
      true;


    try{

      await originalPostFunction();

    }

    finally{

      postingInProgress =
        false;

    }

  };


/* =========================
   CLOSE MODALS ON BACKDROP
========================= */

document.addEventListener(
  "click",
  function(event){

    const loginModal =
      $("loginModal");

    if(
      loginModal &&
      event.target ===
      loginModal
    ){

      closeLogin();

    }


    const dateModal =
      $("dateModal");

    if(
      dateModal &&
      event.target ===
      dateModal
    ){

      closeDatePicker();

    }

  }
);
