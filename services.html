<script>

const serviceCategories = [

        icon: "⚖️"
    }

];



/* =====================================================
   ELEMENTS
===================================================== */

const serviceGrid =
    document.getElementById(
        "serviceGrid"
    );


/* =====================================================
   RENDER SERVICE CATEGORIES
===================================================== */

function renderServices(
    pincode = ""
){

    serviceGrid.innerHTML = "";


    serviceCategories.forEach(
        function(service){

            const card =
                document.createElement("a");


            card.className =
                "service-card";


            /*
               IMPORTANT:
               listingType parameter must match
               category.html
            */

            let url =
                "service-category.html?category=" +
                encodeURIComponent(
                    service.name
                );


            if(pincode){

                url +=
                    "&pincode=" +
                    encodeURIComponent(
                        pincode
                    );

            }


            card.href =
                url;


            card.innerHTML = `

                <span class="service-icon">
                    ${service.icon}
                </span>

                <span>
                    ${service.name}
                </span>

                <span class="service-arrow">
                    →
                </span>

            `;


            serviceGrid.appendChild(
                card
            );

        }
    );

}


/* =====================================================
   INITIAL LOAD
===================================================== */

renderServices();


/* =====================================================
   FINISH
===================================================== */

</script>

<script>

){

                "/service-worker.js"
            )
            .then(
                function(){

                    console.log(

                    );

                }
            )
            .catch(

                        error
                    );

                }
            );

        }
    );

}

</script>

  <script>
/* =====================================================
   AUTO ACTIVE FIXED NAVIGATION
===================================================== */

const currentPage =
    window.location.pathname
        .split("/")
        .pop()
        .toLowerCase();

document
    .querySelectorAll(".bottom-nav-item")
    .forEach(function(item){

        item.classList.remove("active");

        const link =
            item.getAttribute("href");

        if(!link){
            return;
        }

        const linkPage =
            link
                .split("?")[0]
                .split("#")[0]
                .toLowerCase();

        if(linkPage === currentPage){

            item.classList.add("active");

        }

    });
  </script>
