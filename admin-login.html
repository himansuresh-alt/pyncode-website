<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Admin Login - Pyncode.in</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

/* =====================================================
   RESET
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}


/* =====================================================
   BODY
===================================================== */

html,
body{
    min-height:100%;
}

body{

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:#f5f6f8;

    color:#111;

    min-height:100vh;

    display:flex;

    flex-direction:column;

}


/* =====================================================
   HEADER
===================================================== */

.header{

    width:100%;

    height:70px;

    background:#fff;

    border-bottom:1px solid #e5e5e5;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 5%;

    flex-shrink:0;

}


.logo{

    color:#111;

    text-decoration:none;

    font-size:22px;

    font-weight:800;

}


.home-btn{

    border:0;

    background:#111;

    color:#fff;

    padding:11px 18px;

    border-radius:10px;

    font-size:14px;

    font-weight:700;

    cursor:pointer;

}


/* =====================================================
   MAIN
===================================================== */

.main{

    width:100%;

    max-width:460px;

    margin:auto;

    padding:45px 18px;

    flex:1;

    display:flex;

    align-items:center;

}


/* =====================================================
   LOGIN CARD
===================================================== */

.login-card{

    width:100%;

    background:#fff;

    border:1px solid #e1e1e1;

    border-radius:22px;

    padding:30px;

}


/* =====================================================
   TITLE
===================================================== */

.login-icon{

    width:58px;

    height:58px;

    border-radius:16px;

    background:#111;

    color:#fff;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:26px;

    margin-bottom:22px;

}


.title{

    font-size:32px;

    line-height:1.2;

    font-weight:800;

    margin-bottom:8px;

}


.subtitle{

    color:#777;

    font-size:15px;

    line-height:1.5;

    margin-bottom:28px;

}


/* =====================================================
   FORM
===================================================== */

.form-group{

    margin-bottom:18px;

}


label{

    display:block;

    font-size:14px;

    font-weight:700;

    margin-bottom:8px;

}


input{

    width:100%;

    border:1px solid #d8d8d8;

    background:#fff;

    border-radius:11px;

    padding:14px;

    font-size:15px;

    font-family:inherit;

    outline:none;

}


input:focus{

    border-color:#111;

}


input::placeholder{

    color:#aaa;

}


/* =====================================================
   LOGIN BUTTON
===================================================== */

.login-btn{

    width:100%;

    border:0;

    background:#111;

    color:#fff;

    padding:15px;

    border-radius:11px;

    font-size:15px;

    font-weight:800;

    cursor:pointer;

    margin-top:5px;

}


.login-btn:hover{

    background:#222;

}


.login-btn:disabled{

    opacity:.5;

    cursor:not-allowed;

}


/* =====================================================
   MESSAGE
===================================================== */

.message{

    display:none;

    margin-top:17px;

    padding:13px;

    border-radius:10px;

    text-align:center;

    font-size:14px;

    line-height:1.4;

}


.message.show{

    display:block;

}


.message.error{

    background:#ffe8e8;

    color:#b00020;

}


.message.success{

    background:#e8f7ed;

    color:#137333;

}


/* =====================================================
   FOOTER
===================================================== */

.footer{

    width:100%;

    background:#111;

    color:#fff;

    text-align:center;

    padding:30px 20px;

    margin-top:auto;

    flex-shrink:0;

}


.footer-title{

    font-size:17px;

    font-weight:800;

}


.footer-text{

    color:#aaa;

    font-size:13px;

    margin-top:8px;

}


.footer-copy{

    color:#777;

    font-size:12px;

    margin-top:18px;

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

    .header{

        height:64px;

        padding:0 16px;

    }


    .logo{

        font-size:19px;

    }


    .home-btn{

        padding:10px 15px;

        font-size:12px;

    }


    .main{

        padding:30px 14px;

    }


    .login-card{

        padding:24px 20px;

        border-radius:19px;

    }


    .title{

        font-size:29px;

    }


    .subtitle{

        font-size:14px;

    }

}


/* =====================================================
   SMALL MOBILE
===================================================== */

@media(max-width:380px){

    .login-card{

        padding:21px 17px;

    }


    .title{

        font-size:27px;

    }

}

</style>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header class="header">

    <a
        href="index.html"
        class="logo"
    >

        Pyncode.in

    </a>


    <button
        type="button"
        class="home-btn"
        onclick="goHome()"
    >

        Home

    </button>

</header>



<!-- =====================================================
     MAIN
===================================================== -->

<main class="main">

    <section class="login-card">

        <div class="login-icon">
            🔐
        </div>


        <h1 class="title">
            Admin Login
        </h1>


        <p class="subtitle">
            Sign in to access the Pyncode.in admin panel.
        </p>


        <!-- =================================================
             LOGIN FORM
        ================================================= -->

        <form id="loginForm">


            <div class="form-group">

                <label for="email">
                    Email Address
                </label>


                <input
                    type="email"
                    id="email"
                    placeholder="Enter admin email"
                    autocomplete="email"
                    required
                >

            </div>



            <div class="form-group">

                <label for="password">
                    Password
                </label>


                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    autocomplete="current-password"
                    required
                >

            </div>



            <button
                type="submit"
                class="login-btn"
                id="loginButton"
            >

                Login

            </button>


            <div
                id="message"
                class="message"
            ></div>


        </form>

    </section>

</main>



<!-- =====================================================
     FOOTER
===================================================== -->

<footer class="footer">

    <div class="footer-title">
        Pyncode.in
    </div>


    <div class="footer-text">
        Admin access
    </div>


    <div class="footer-copy">
        © 2026 Pyncode.in. All rights reserved.
    </div>

</footer>



<script>

/* =====================================================
   SUPABASE CONNECTION
===================================================== */

const SUPABASE_URL =
    "https://mtuspuehsxsjoaxoenen.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_JpopjwDVjFvsDjXeG_56NQ_k3nA2mU6";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =====================================================
   ELEMENTS
===================================================== */

const loginForm =
    document.getElementById(
        "loginForm"
    );


const emailInput =
    document.getElementById(
        "email"
    );


const passwordInput =
    document.getElementById(
        "password"
    );


const loginButton =
    document.getElementById(
        "loginButton"
    );


const message =
    document.getElementById(
        "message"
    );


/* =====================================================
   HOME
===================================================== */

function goHome(){

    window.location.href =
        "index.html";

}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
    text,
    type
){

    message.textContent =
        text;

    message.className =
        "message show " +
        type;

}


/* =====================================================
   ADMIN VERIFICATION
===================================================== */

async function verifyAdmin(
    userId
){

    const {
        data: adminUser,
        error: adminError
    } =
        await supabaseClient
            .from("admin_users")
            .select("id")
            .eq(
                "auth_user_id",
                userId
            )
            .maybeSingle();


    if(adminError){

        console.error(
            "Admin verification error:",
            adminError
        );

        return false;

    }


    return !!adminUser;

}


/* =====================================================
   LOGIN
===================================================== */

loginForm.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        const email =
            emailInput.value.trim();


        const password =
            passwordInput.value;


        if(
            !email ||
            !password
        ){

            showMessage(
                "Please enter email and password.",
                "error"
            );

            return;

        }


        loginButton.disabled =
            true;


        loginButton.textContent =
            "Signing in...";


        message.className =
            "message";


        try{


            /* =============================================
               SUPABASE AUTH LOGIN
            ============================================= */

            const {
                data,
                error
            } =
                await supabaseClient
                    .auth
                    .signInWithPassword({

                        email:
                            email,

                        password:
                            password

                    });


            if(error){

                throw error;

            }


            if(
                !data ||
                !data.user
            ){

                throw new Error(
                    "Unable to login."
                );

            }


            /* =============================================
               ADMIN CHECK
            ============================================= */

            const isAdmin =
                await verifyAdmin(
                    data.user.id
                );


            if(!isAdmin){

                await supabaseClient
                    .auth
                    .signOut();


                showMessage(
                    "This account does not have admin access.",
                    "error"
                );


                loginButton.disabled =
                    false;


                loginButton.textContent =
                    "Login";


                return;

            }


            /* =============================================
               SUCCESS
            ============================================= */

            showMessage(
                "Login successful. Opening admin panel...",
                "success"
            );

                      /* =============================================
               OPEN ADMIN DASHBOARD
            ============================================= */

            setTimeout(
                function(){

                    window.location.replace(
                        "admin-dashboard.html"
                    );

                },
                700
            );


        }
        catch(error){

            console.error(
                "ADMIN LOGIN ERROR:",
                error
            );


            let errorMessage =
                "Invalid email or password.";


            if(
                error &&
                error.message
            ){

                const errorText =
                    error.message.toLowerCase();


                if(
                    errorText.includes(
                        "email not confirmed"
                    )
                ){

                    errorMessage =
                        "Please confirm the admin email first.";

                }

            }


            showMessage(
                errorMessage,
                "error"
            );


            loginButton.disabled =
                false;


            loginButton.textContent =
                "Login";

        }

    }
);

</script>


</body>

</html>
