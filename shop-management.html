<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Pyncode Shop Management</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        *{
            box-sizing:border-box;
            margin:0;
            padding:0;
        }

        body{
            font-family:Arial, Helvetica, sans-serif;
            background:#faf9f7;
            color:#171717;
            min-height:100vh;
        }

        .header{
            background:#fff;
            border-bottom:1px solid #e8e8e8;
            padding:22px 25px;
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:15px;
            position:sticky;
            top:0;
            z-index:10;
        }

        .brand{
            font-size:23px;
            font-weight:800;
        }

        .back-btn{
            border:none;
            background:#f2f2f2;
            color:#222;
            padding:11px 16px;
            border-radius:12px;
            font-size:14px;
            font-weight:700;
            cursor:pointer;
        }

        .container{
            width:100%;
            max-width:1000px;
            margin:auto;
            padding:35px 18px 60px;
        }

        .page-title{
            margin-bottom:25px;
        }

        .page-title h1{
            font-size:30px;
            margin-bottom:8px;
        }

        .page-title p{
            color:#777;
            font-size:15px;
            line-height:1.5;
        }

        .toolbar{
            background:#fff;
            border:1px solid #e5e5e5;
            border-radius:18px;
            padding:15px;
            margin-bottom:22px;
        }

        .search-box{
            width:100%;
            border:1px solid #ddd;
            border-radius:13px;
            padding:14px 15px;
            font-size:15px;
            outline:none;
        }

        .search-box:focus{
            border-color:#999;
        }

        .stats{
            display:flex;
            gap:10px;
            margin-top:12px;
            flex-wrap:wrap;
        }

        .stat{
            background:#f5f5f5;
            border-radius:10px;
            padding:8px 12px;
            font-size:13px;
            color:#666;
        }

        .shops{
            display:flex;
            flex-direction:column;
            gap:16px;
        }

        .shop-card{
            background:#fff;
            border:1px solid #e5e5e5;
            border-radius:20px;
            padding:22px;
            box-shadow:0 8px 25px rgba(0,0,0,.04);
        }

        .shop-top{
            display:flex;
            justify-content:space-between;
            gap:15px;
            align-items:flex-start;
        }

        .shop-name{
            font-size:21px;
            font-weight:800;
            margin-bottom:7px;
        }

        .shop-category{
            color:#777;
            font-size:14px;
        }

        .shop-id{
            background:#f1f1f1;
            color:#666;
            padding:7px 10px;
            border-radius:9px;
            font-size:12px;
            white-space:nowrap;
        }

        .details{
            margin-top:18px;
            display:grid;
            grid-template-columns:repeat(2,1fr);
            gap:10px;
        }

        .detail{
            background:#f8f8f8;
            border-radius:12px;
            padding:12px;
        }

        .detail-label{
            font-size:11px;
            color:#999;
            margin-bottom:4px;
            text-transform:uppercase;
        }

        .detail-value{
            font-size:14px;
            color:#333;
            word-break:break-word;
        }

        .actions{
            margin-top:18px;
            padding-top:16px;
            border-top:1px solid #eee;
            display:flex;
            justify-content:flex-end;
        }

        .delete-btn{
            border:none;
            background:#fff0f0;
            color:#c62828;
            padding:12px 18px;
            border-radius:12px;
            font-size:14px;
            font-weight:700;
            cursor:pointer;
        }

        .delete-btn:active{
            transform:scale(.98);
        }

        .empty{
            background:#fff;
            border:1px solid #e5e5e5;
            border-radius:18px;
            padding:35px 20px;
            text-align:center;
            color:#777;
        }

        .loading{
            text-align:center;
            padding:40px;
            color:#777;
        }

        .error{
            background:#fff0f0;
            color:#c62828;
            border-radius:14px;
            padding:15px;
            margin-bottom:20px;
            display:none;
        }

        @media(max-width:650px){

            .header{
                padding:18px;
            }

            .brand{
                font-size:19px;
            }

            .back-btn{
                padding:10px 13px;
            }

            .container{
                padding:28px 14px 50px;
            }

            .page-title h1{
                font-size:27px;
            }

            .shop-card{
                padding:18px;
            }

            .shop-top{
                flex-direction:column;
            }

            .details{
                grid-template-columns:1fr;
            }

            .actions{
                display:block;
            }

            .delete-btn{
                width:100%;
            }

        }

    </style>

</head>


<body>


<header class="header">

    <div class="brand">
        Pyncode Shop Management
    </div>

    <button
        type="button"
        class="back-btn"
        id="backBtn">
        ← Dashboard
    </button>

</header>


<main class="container">

    <div class="page-title">

        <h1>
            Registered Shops
        </h1>

        <p>
            View and manage shops registered on Pyncode.
        </p>

    </div>


    <div
        class="error"
        id="errorMessage">
    </div>


    <div class="toolbar">

        <input
            type="search"
            id="searchInput"
            class="search-box"
            placeholder="Search shop, owner, category, mobile or city...">

        <div class="stats">

            <div class="stat">
                Total Shops:
                <strong id="totalCount">0</strong>
            </div>

            <div class="stat">
                Showing:
                <strong id="showingCount">0</strong>
            </div>

        </div>

    </div>


    <div
        class="shops"
        id="shopsContainer">

        <div class="loading">
            Loading shops...
        </div>

    </div>

</main>


<script>

/* =========================================
   SUPABASE CONFIG
========================================= */

const SUPABASE_URL =
    "https://mtuspuehsxsjoaxoenen.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_JpopjwDVjFvsDjXeG_56NQ_k3nA2mU6";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================
   GLOBAL DATA
========================================= */

let allShops = [];


/* =========================================
   ELEMENTS
========================================= */

const shopsContainer =
    document.getElementById(
        "shopsContainer"
    );

const searchInput =
    document.getElementById(
        "searchInput"
    );

const totalCount =
    document.getElementById(
        "totalCount"
    );

const showingCount =
    document.getElementById(
        "showingCount"
    );

const errorMessage =
    document.getElementById(
        "errorMessage"
    );


/* =========================================
   ADMIN ACCESS CHECK
========================================= */

async function checkAdminAccess(){

    try{

        const {
            data: { session },
            error: sessionError
        } =
            await supabaseClient.auth.getSession();


        if(sessionError || !session){

            window.location.replace(
                "promotion-admin-login.html"
            );

            return false;
        }


        const {
            data: adminUser,
            error: adminError
        } =
            await supabaseClient
                .from("admin_users")
                .select("id")
                .eq(
                    "auth_user_id",
                    session.user.id
                )
                .maybeSingle();


        if(adminError || !adminUser){

            await supabaseClient.auth.signOut();

            alert(
                "Admin access required."
            );

            window.location.replace(
                "promotion-admin-login.html"
            );

            return false;
        }


        return true;

    }catch(error){

        console.error(
            "Admin access error:",
            error
        );

        window.location.replace(
            "promotion-admin-login.html"
        );

        return false;
    }

}


/* =========================================
   LOAD SHOPS
========================================= */

async function loadShops(){

    errorMessage.style.display =
        "none";

    shopsContainer.innerHTML = `
        <div class="loading">
            Loading shops...
        </div>
    `;

    try{

        const {
            data,
            error
        } =
            await supabaseClient
                .from("shops")
                .select(`
                    id,
                    shop_name,
                    category,
                    owner_name,
                    mobile,
                    whatsapp,
                    address,
                    area,
                    city,
                    pincode,
                    listing_type,
                    created_at
                `)
                .order(
                    "created_at",
                    {
                        ascending:false
                    }
                );


        if(error){

            throw error;
        }


        allShops =
            Array.isArray(data)
                ? data
                : [];


        totalCount.textContent =
            allShops.length;


        renderShops(
            allShops
        );


    }catch(error){

        console.error(
            "Load shops error:",
            error
        );

        errorMessage.textContent =
            "Unable to load shops. Please try again.";

        errorMessage.style.display =
            "block";

        shopsContainer.innerHTML = "";
    }

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHtml(value){

    if(value === null ||
       value === undefined){

        return "";
    }

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* =========================================
   RENDER SHOPS
========================================= */

function renderShops(
    shops
){

    showingCount.textContent =
        shops.length;


    if(!shops.length){

        shopsContainer.innerHTML = `
            <div class="empty">
                No shops found.
            </div>
        `;

        return;
    }


    shopsContainer.innerHTML =
        shops.map(
            shop => {

                const location =
                    [
                        shop.area,
                        shop.city,
                        shop.pincode
                    ]
                    .filter(Boolean)
                    .join(", ");


                return `

                    <article
                        class="shop-card">

                        <div
                            class="shop-top">

                            <div>

                                <div
                                    class="shop-name">

                                    ${escapeHtml(
                                        shop.shop_name
                                    )}

                                </div>

                                <div
                                    class="shop-category">

                                    ${escapeHtml(
                                        shop.category
                                    )}

                                </div>

                            </div>


                            <div
                                class="shop-id">

                                Shop ID:
                                ${escapeHtml(
                                    shop.id
                                )}

                            </div>

                        </div>


                        <div
                            class="details">

                            <div class="detail">

                                <div
                                    class="detail-label">
                                    Owner
                                </div>

                                <div
                                    class="detail-value">

                                    ${escapeHtml(
                                        shop.owner_name
                                    ) || "—"}

                                </div>

                            </div>


                            <div class="detail">

                                <div
                                    class="detail-label">
                                    Mobile
                                </div>

                                <div
                                    class="detail-value">

                                    ${escapeHtml(
                                        shop.mobile
                                    ) || "—"}

                                </div>

                            </div>


                            <div class="detail">

                                <div
                                    class="detail-label">
                                    Location
                                </div>

                                <div
                                    class="detail-value">

                                    ${escapeHtml(
                                        location
                                    ) || "—"}

                                </div>

                            </div>


                            <div class="detail">

                                <div
                                    class="detail-label">
                                    Listing Type
                                </div>

                                <div
                                    class="detail-value">

                                    ${escapeHtml(
                                        shop.listing_type ||
                                        "shop"
                                    )}

                                </div>

                            </div>

                        </div>


                        <div
                            class="actions">

                            <button
                                type="button"
                                class="delete-btn"
                                onclick="deleteShop(${Number(shop.id)})">

                                🗑️ Delete Shop

                            </button>

                        </div>

                    </article>

                `;

            }
        )
        .join("");

}


/* =========================================
   SEARCH
========================================= */

searchInput.addEventListener(
    "input",
    function(){

        const query =
            this.value
                .trim()
                .toLowerCase();


        if(!query){

            renderShops(
                allShops
            );

            return;
        }


        const filtered =
            allShops.filter(
                shop => {

                    const searchable = [

                        shop.shop_name,
                        shop.category,
                        shop.owner_name,
                        shop.mobile,
                        shop.whatsapp,
                        shop.address,
                        shop.area,
                        shop.city,
                        shop.pincode,
                        shop.listing_type

                    ]
                    .filter(Boolean)
                    .join(" ")
                    .toLowerCase();


                    return searchable
                        .includes(query);

                }
            );


        renderShops(
            filtered
        );

    }
);


/* =========================================
   DELETE SHOP
========================================= */

async function deleteShop(
    shopId
){

    const shop =
        allShops.find(
            item =>
                Number(item.id) ===
                Number(shopId)
        );


    if(!shop){

        alert(
            "Shop not found."
        );

        return;
    }


    const shopName =
        shop.shop_name ||
        "this shop";


    const firstConfirm =
        confirm(
            `Delete "${shopName}"?\n\nThis will permanently remove the shop, its owner mapping and its shop advertisements from the Pyncode database.`
        );


    if(!firstConfirm){

        return;
    }


    const typedName =
        prompt(
            `Safety confirmation:\n\nType the exact shop name to continue:\n\n${shopName}`
        );


    if(typedName === null){

        return;
    }


    if(
        typedName.trim() !==
        shopName.trim()
    ){

        alert(
            "Shop name did not match. Delete cancelled."
        );

        return;
    }


    const finalConfirm =
        confirm(
            `FINAL CONFIRMATION\n\nDelete "${shopName}" permanently?`
        );


    if(!finalConfirm){

        return;
    }


    try{

        const {
            data,
            error
        } =
            await supabaseClient
                .rpc(
                    "admin_delete_shop",
                    {
                        p_shop_id:
                            Number(shopId)
                    }
                );


        if(error){

            console.error(
                "Delete shop error:",
                error
            );

            throw error;
        }


        console.log(
            "Shop deleted:",
            data
        );


        alert(
            `"${shopName}" has been deleted successfully.`
        );


        await loadShops();


    }catch(error){

        console.error(
            "Shop deletion failed:",
            error
        );

        alert(
            "Shop deletion failed. No changes were made."
        );

    }

}


/* =========================================
   BACK TO DASHBOARD
========================================= */

document
    .getElementById("backBtn")
    .addEventListener(
        "click",
        function(){

            window.location.href =
                "admin-dashboard.html";

        }
    );


/* =========================================
   START
========================================= */

(async function(){

    const isAdmin =
        await checkAdminAccess();


    if(isAdmin){

        await loadShops();

    }

})();

</script>

</body>
</html>
