<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
>
<title>Pyncode Live QR</title>
<meta name="theme-color" content="#D96510">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:#FFF9F3;
    color:#24201D;
    min-height:100vh;
    padding-bottom:115px;
    -webkit-font-smoothing:antialiased;
}

button{
    font-family:inherit;
    border:0;
    cursor:pointer;
}

button:focus{
    outline:none;
}

button:active{
    transform:scale(.97);
}

.page{
    width:100%;
    max-width:680px;
    min-height:100vh;
    margin:0 auto;
}

.loading-screen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:25px;
}

.loading-content{
    width:100%;
    max-width:320px;
    text-align:center;
}

.loading-logo{
    width:58px;
    height:58px;
    margin:0 auto 18px;
    border-radius:18px;
    background:#D96510;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:23px;
    font-weight:850;
    box-shadow:0 15px 35px rgba(217,101,16,.22);
}

.loading-title{
    font-size:20px;
    font-weight:750;
    margin-bottom:7px;
}

.loading-text{
    color:#9A8D84;
    font-size:13px;
}

.loading-spinner{
    width:28px;
    height:28px;
    margin:20px auto 0;
    border:3px solid #F0DCCE;
    border-top-color:#D96510;
    border-radius:50%;
    animation:loadingSpin .8s linear infinite;
}

@keyframes loadingSpin{
    to{transform:rotate(360deg);}
}

.error-screen{
    min-height:100vh;
    display:none;
    align-items:center;
    justify-content:center;
    padding:25px;
}

.error-card{
    width:100%;
    max-width:390px;
    background:#FFFFFF;
    border-radius:25px;
    padding:34px 24px;
    text-align:center;
    border:1px solid #F1DED0;
    box-shadow:0 18px 50px rgba(120,65,25,.08);
}

.error-icon{
    width:60px;
    height:60px;
    margin:0 auto 18px;
    border-radius:50%;
    background:#FFF0E2;
    color:#C4570B;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:25px;
}

.error-title{
    font-size:20px;
    font-weight:800;
    margin-bottom:8px;
}

.error-text{
    color:#8C7D73;
    font-size:13px;
    line-height:1.6;
}

#mainContent{
    display:none;
}

.shop-hero{
    position:relative;
    overflow:hidden;
    min-height:265px;
    padding:24px 20px 30px;
    color:#fff;
    background:
        radial-gradient(circle at 88% 12%,rgba(255,255,255,.20),transparent 28%),
        radial-gradient(circle at 15% 90%,rgba(255,255,255,.10),transparent 30%),
        linear-gradient(145deg,#B94F0A 0%,#D96510 52%,#E87516 100%);
    border-radius:0 0 32px 32px;
    box-shadow:0 20px 48px rgba(180,76,8,.20);
}

.shop-hero::after{
    content:"";
    position:absolute;
    width:180px;
    height:180px;
    right:-70px;
    bottom:-80px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.12);
}

.brand-row{
    position:relative;
    z-index:2;
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:46px;
}

.pyncode-brand{
    font-size:11px;
    font-weight:850;
    letter-spacing:2.3px;
    color:rgba(255,255,255,.78);
}

.live-badge{
    display:flex;
    align-items:center;
    gap:7px;
    padding:7px 11px;
    border-radius:999px;
    border:1px solid rgba(255,255,255,.22);
    background:rgba(255,255,255,.12);
    color:#fff;
    font-size:9px;
    font-weight:800;
    letter-spacing:1px;
}

.live-dot{
    width:6px;
    height:6px;
    border-radius:50%;
    background:#FFFFFF;
    box-shadow:0 0 9px rgba(255,255,255,.9);
}

.shop-name{
    position:relative;
    z-index:2;
    max-width:580px;
    font-size:clamp(28px,7vw,42px);
    line-height:1.04;
    font-weight:850;
    letter-spacing:-1.1px;
    word-break:break-word;
    margin-bottom:11px;
}

.shop-category{
    position:relative;
    z-index:2;
    color:rgba(255,255,255,.72);
    font-size:13px;
    font-weight:550;
    margin-bottom:23px;
}

.shop-location{
    position:relative;
    z-index:2;
    display:flex;
    align-items:center;
    gap:7px;
    color:rgba(255,255,255,.84);
    font-size:13px;
    line-height:1.4;
}
  .products-section{
    margin:36px 18px 0;
}

.products-heading{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    margin-bottom:16px;
}

.products-title{
    font-size:24px;
    font-weight:820;
    letter-spacing:-.5px;
    color:#24201D;
}

.products-count{
    color:#A28F82;
    font-size:12px;
    font-weight:650;
}

.product-search-wrap{
    margin:0 0 16px;
}

.product-search{
    width:100%;
    height:48px;
    border:1px solid #F1DED0;
    border-radius:15px;
    background:#FFFFFF;
    color:#24201D;
    padding:0 15px;
    font:inherit;
    font-size:14px;
    outline:none;
    box-shadow:0 5px 18px rgba(120,65,25,.04);
}

.product-search:focus{
    border-color:#D96510;
    box-shadow:0 0 0 3px rgba(217,101,16,.10);
}

.products-list{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:10px;
}

.product-card{
    min-width:0;
    display:flex;
    flex-direction:column;
    align-items:stretch;
    gap:9px;
    background:#FFFFFF;
    border:1px solid #F1DED0;
    border-radius:18px;
    padding:8px;
    box-shadow:0 5px 18px rgba(120,65,25,.045);
    overflow:hidden;
}

.product-card.selected{
    border-color:#E9B98F;
    box-shadow:0 7px 20px rgba(180,76,8,.08);
}

.product-image-wrap{
    width:100%;
    aspect-ratio:1/1;
    border-radius:12px;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#FFF9F3;
}

.product-image{
    width:100%;
    height:100%;
    display:block;
    object-fit:cover;
    object-position:center;
}

.product-image-placeholder{
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#FFF0E2;
    color:#D96510;
    font-size:30px;
}

.product-details{
    width:100%;
    min-width:0;
    flex:1;
}

.product-name{
    font-size:12px;
    line-height:1.35;
    font-weight:750;
    overflow-wrap:anywhere;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
    min-height:32px;
}

.product-unit{
    font-size:10px;
    color:#9A8D84;
    margin-top:4px;
    min-height:14px;
}

.product-actions{
    display:flex;
    flex-direction:column;
    align-items:stretch;
    justify-content:flex-start;
    gap:7px;
    margin-top:auto;
}

.product-price{
    font-size:14px;
    line-height:1.2;
    font-weight:850;
    color:#24201D;
    text-align:center;
}

.add-button{
    width:100%;
    min-width:0;
    height:33px;
    padding:0 5px;
    border-radius:10px;
    background:#FFF0E2;
    border:1px solid #E9B98F;
    color:#C4570B;
    font-size:11px;
    font-weight:850;
}

.quantity-control{
    display:none;
    align-self:center;
    gap:0;
    border:1px solid #E9B98F;
    border-radius:10px;
    overflow:hidden;
    background:#FFF0E2;
}

.quantity-control.visible{
    display:flex;
}

.quantity-button{
    width:25px;
    height:31px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#FFF0E2;
    color:#C4570B;
    font-size:17px;
}

.quantity-value{
    min-width:23px;
    height:31px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#FFFFFF;
    color:#24201D;
    font-size:12px;
    font-weight:850;
}

.empty-products{
    display:none;
    background:#FFFFFF;
    border:1px solid #F1DED0;
    border-radius:20px;
    padding:38px 20px;
    text-align:center;
}

.empty-products-icon{
    font-size:28px;
    color:#D96510;
    margin-bottom:10px;
}

.empty-products-title{
    font-size:16px;
    font-weight:750;
    margin-bottom:6px;
}

.empty-products-text{
    color:#A28F82;
    font-size:12px;
}

.no-search-results{
    display:none;
    grid-column:1/-1;
    padding:26px 14px;
    text-align:center;
    color:#9A8D84;
    background:#FFFFFF;
    border:1px solid #F1DED0;
    border-radius:16px;
    font-size:13px;
}

.site-footer{
    padding:38px 20px 25px;
    text-align:center;
    color:#B1A097;
    font-size:10px;
    letter-spacing:.5px;
}

.site-footer strong{
    color:#C4570B;
}

/* Store cover and banner styles */

.store-cover-image{
    width:100%;
    max-height:260px;
    object-fit:cover;
    display:block;
}

.store-banners{
    margin:22px 18px 0;
    display:flex;
    flex-direction:column;
    gap:12px;
}

.store-banner{
    width:100%;
    display:block;
    object-fit:cover;
    border-radius:18px;
    border:1px solid #F1DED0;
    background:#FFFFFF;
}

.store-categories{
    margin:26px 18px 0;
}

.store-categories-heading{
    font-size:20px;
    font-weight:800;
    margin-bottom:14px;
}

.category-list{
    display:flex;
    gap:12px;
    overflow-x:auto;
    padding:2px 0 10px;
    scrollbar-width:thin;
}

.category-item{
    flex:0 0 88px;
    text-align:center;
    border:0;
    background:transparent;
    color:#24201D;
    padding:0;
}

.category-image-wrap{
    width:76px;
    height:76px;
    margin:0 auto 8px;
    border-radius:18px;
    overflow:hidden;
    background:#FFF0E2;
    border:1px solid #F1DED0;
}

.category-image{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.category-name{
    font-size:11px;
    line-height:1.35;
    font-weight:700;
    overflow-wrap:anywhere;
}

.category-item.active .category-image-wrap{
    border:2px solid #D96510;
}

.category-item.active .category-name{
    color:#C4570B;
}

@media(min-width:560px){
    .products-list{
        grid-template-columns:repeat(2,minmax(0,1fr));
        gap:14px;
    }

    .product-card{
        padding:10px;
    }

    .product-name{
        font-size:13px;
    }

    .product-price{
        font-size:15px;
    }

    .add-button{
        font-size:12px;
    }
}

@media(min-width:640px){
    .products-list{
        grid-template-columns:repeat(3,minmax(0,1fr));
    }
}

@media(max-width:360px){
    .products-section{
        margin-left:12px;
        margin-right:12px;
    }

    .products-list{
        gap:7px;
    }

    .product-card{
        padding:6px;
        border-radius:15px;
    }

    .product-image-wrap{
        border-radius:10px;
    }

    .product-name{
        font-size:11px;
        min-height:30px;
    }

    .product-price{
        font-size:12px;
    }

    .add-button{
        height:31px;
        font-size:10px;
    }
}
</style>
</head>
<body>

<div id="loadingScreen" class="loading-screen">
    <div class="loading-content">
        <div class="loading-logo">P</div>
        <div class="loading-title">Loading shop</div>
        <div class="loading-text">Please wait...</div>
        <div class="loading-spinner"></div>
    </div>
</div>

  <div id="errorScreen" class="error-screen">
    <div class="error-card">
        <div class="error-icon">⚠</div>
        <div id="errorTitle" class="error-title">Shop unavailable</div>
        <div id="errorMessage" class="error-text">
            This Live QR link is invalid or unavailable.
        </div>
    </div>
</div>

<main id="mainContent" class="page">

    <section class="shop-hero">
        <div class="brand-row">
            <div class="pyncode-brand">PYNCODE</div>
            <div class="live-badge">
                <span class="live-dot"></span>
                LIVE QR
            </div>
        </div>

        <h1 id="shopName" class="shop-name">Shop Name</h1>
        <div id="shopCategory" class="shop-category">Local Shop</div>

        <div class="shop-location">
            <span class="location-dot">●</span>
            <span id="shopLocation">Location</span>
        </div>
    </section>

    <!-- Store cover image -->
    <section id="storeCoverSection" style="display:none;margin:16px 18px 0;">
        <img
            id="storeCoverImage"
            class="store-cover-image"
            alt="Store cover"
            style="border-radius:18px;width:100%;"
        >
    </section>

    <div class="action-row">
        <button id="callButton" class="action-button call-button" type="button">
            ☎ <span>Call</span>
        </button>

        <button id="whatsappButton" class="action-button whatsapp-button" type="button">
            ◉ <span>WhatsApp</span>
        </button>
    </div>

    <div id="shopInfo" class="shop-info"></div>

    <!-- Store banners -->
    <section id="storeBannersSection" class="store-banners" style="display:none;">
        <div id="storeBannersList"></div>
    </section>

    <!-- Store categories -->
    <section id="storeCategoriesSection" class="store-categories" style="display:none;">
        <h2 class="store-categories-heading">Shop by Category</h2>
        <div id="storeCategoriesList" class="category-list"></div>
    </section>

    <section class="products-section">

        <div class="products-heading">
            <h2 class="products-title">Products</h2>
            <span id="productCount" class="products-count">0 items</span>
        </div>

        <div class="product-search-wrap">
            <input
                id="productSearch"
                class="product-search"
                type="search"
                placeholder="🔍  Search products in this shop"
                autocomplete="off"
                aria-label="Search products"
            >
        </div>

        <div id="productsList" class="products-list"></div>

        <div id="noSearchResults" class="no-search-results">
            No matching products found.
        </div>

        <div id="emptyProducts" class="empty-products">
            <div class="empty-products-icon">◌</div>
            <div class="empty-products-title">No products available</div>
            <div class="empty-products-text">Please check again later.</div>
        </div>

    </section>

    <footer class="site-footer">
        Powered by <strong>Pyncode.in</strong>
    </footer>

</main>

<!-- Fixed order summary -->
<div
    id="orderFooter"
    style="position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:680px;padding:10px 14px 14px;background:linear-gradient(to top,#FFF9F3 65%,rgba(255,249,243,.93));z-index:100;display:none;"
>
    <div style="min-height:62px;background:#B94F0A;color:#fff;border-radius:19px;padding:9px 10px 9px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 12px 35px rgba(180,76,8,.25);">

        <div>
            <div id="orderItems" style="font-size:10px;color:rgba(255,255,255,.72);margin-bottom:3px;font-weight:600;">
                0 Items
            </div>

            <div id="orderTotal" style="font-size:17px;font-weight:850;">
                ₹0
            </div>
        </div>

        <button
            id="placeOrderButton"
            type="button"
            style="min-height:45px;padding:0 17px;border:0;border-radius:13px;background:#E87516;color:#fff;font-size:12px;font-weight:850;white-space:nowrap;box-shadow:0 5px 15px rgba(0,0,0,.12);"
        >
            💬 PLACE ORDER
        </button>

    </div>
</div>

<div
    id="toast"
    style="position:fixed;left:50%;bottom:92px;transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:200;background:#B94F0A;color:#fff;padding:11px 16px;border-radius:12px;font-size:12px;font-weight:650;box-shadow:0 10px 30px rgba(120,65,25,.20);transition:.25s;white-space:nowrap;"
>
    Added
</div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL =
    "https://mtuspuehsxsjoaxoenen.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_JpopjwDVjFvsDjXeG_56NQ_k3nA2mU6";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

let currentShop = null;
let products = [];
let cart = {};
let storeBanners = [];
let storeCategories = [];
let selectedCategoryId = null;

const loadingScreen = document.getElementById("loadingScreen");
const errorScreen = document.getElementById("errorScreen");
const errorTitle = document.getElementById("errorTitle");
const errorMessage = document.getElementById("errorMessage");
const mainContent = document.getElementById("mainContent");

const shopHero = document.querySelector(".shop-hero");
const shopName = document.getElementById("shopName");
const shopCategory = document.getElementById("shopCategory");
const shopLocation = document.getElementById("shopLocation");
const shopInfo = document.getElementById("shopInfo");

const productsList = document.getElementById("productsList");
const productSearch = document.getElementById("productSearch");
const noSearchResults = document.getElementById("noSearchResults");
const productCount = document.getElementById("productCount");
const emptyProducts = document.getElementById("emptyProducts");

const callButton = document.getElementById("callButton");
const whatsappButton = document.getElementById("whatsappButton");

const orderFooter = document.getElementById("orderFooter");
const orderItems = document.getElementById("orderItems");
const orderTotal = document.getElementById("orderTotal");
const placeOrderButton = document.getElementById("placeOrderButton");
const toast = document.getElementById("toast");


function getLiveQrToken(){
    const params = new URLSearchParams(window.location.search);
    return params.get("token");
}


function showError(title, message){
    loadingScreen.style.display = "none";
    mainContent.style.display = "none";
    errorScreen.style.display = "flex";

    errorTitle.textContent = title || "Shop unavailable";
    errorMessage.textContent =
        message || "This Live QR link is unavailable.";
}


function formatPrice(value){
    const number = Number(value || 0);

    return "₹" + number.toLocaleString("en-IN", {
        minimumFractionDigits: number % 1 === 0 ? 0 : 2,
        maximumFractionDigits: 2
    });
}


function normalizePhone(phone){
    if(!phone) return "";

    let value = String(phone).replace(/\D/g, "");

    if(value.length === 10){
        value = "91" + value;
    }

    if(value.startsWith("0") && value.length === 11){
        value = "91" + value.substring(1);
    }

    return value;
}


function buildLocation(shop){
    const parts = [];

    if(shop.area) parts.push(shop.area);
    if(shop.city) parts.push(shop.city);
    if(shop.pincode) parts.push(shop.pincode);

    if(parts.length === 0 && shop.address){
        parts.push(shop.address);
    }

    return parts.length ? parts.join(" · ") : "Local shop";
}


function isSafeImageUrl(url){
    try{
        const parsed = new URL(url, window.location.href);

        return parsed.protocol === "https:" ||
               parsed.protocol === "http:";
    }catch(error){
        return false;
    }
}


function renderShop(){
    shopName.textContent = currentShop.shop_name || "Shop";
    shopCategory.textContent = currentShop.category || "Local Shop";
    shopLocation.textContent = buildLocation(currentShop);

    shopInfo.innerHTML = "";

    // Preserve the existing shop image as a hero background.
    if(currentShop.shop_image &&
       isSafeImageUrl(currentShop.shop_image)){

        shopHero.style.backgroundImage =
            'linear-gradient(rgba(0,0,0,.20),rgba(0,0,0,.28)),url("' +
            currentShop.shop_image + '")';

        shopHero.style.backgroundSize = "cover";
        shopHero.style.backgroundPosition = "center";
        shopHero.style.backgroundRepeat = "no-repeat";
    }

    if(currentShop.address){
        const pill = document.createElement("div");
        pill.className = "info-pill";
        pill.textContent = "📍 " + currentShop.address;
        shopInfo.appendChild(pill);
    }

    if(currentShop.pincode){
        const pill = document.createElement("div");
        pill.className = "info-pill";
        pill.textContent = "PIN " + currentShop.pincode;
        shopInfo.appendChild(pill);
    }

    if(currentShop.owner_name){
        const pill = document.createElement("div");
        pill.className = "info-pill";
        pill.textContent = "Owner · " + currentShop.owner_name;
        shopInfo.appendChild(pill);
    }

    const phone = String(
        currentShop.mobile || currentShop.whatsapp || ""
    ).replace(/\D/g, "");

    if(phone){
        callButton.style.display = "flex";

        callButton.onclick = function(){
            window.location.href = "tel:" + phone;
        };
    }else{
        callButton.style.display = "none";
    }

    const whatsapp = normalizePhone(
        currentShop.whatsapp || currentShop.mobile
    );

    if(whatsapp){
        whatsappButton.style.display = "flex";

        whatsappButton.onclick = function(){
            window.open(
                "https://wa.me/" + whatsapp,
                "_blank"
            );
        };
    }else{
        whatsappButton.style.display = "none";
    }
}


async function loadShop(){
    const token = getLiveQrToken();

    if(!token){
        showError(
            "Invalid Live QR link",
            "Please scan the permanent QR code provided by the shop."
        );
        return false;
    }

    const {data, error} = await supabaseClient
        .from("shops")
        .select(`
            id,
            shop_name,
            category,
            owner_name,
            mobile,
            whatsapp,
            address,
            area,
            city,
            pincode,
            description,
            shop_image,
            live_qr_enabled,
            live_qr_token,
            live_qr_status
        `)
        .eq("live_qr_token", token)
        .eq("live_qr_enabled", true)
        .eq("live_qr_status", "active")
        .maybeSingle();

    if(error){
        console.error("Shop loading error:", error);

        showError(
            "Unable to load shop",
            "Please refresh and try again."
        );

        return false;
    }

    if(!data){
        showError(
            "Shop unavailable",
            "This Live QR is invalid, disabled, or unavailable."
        );

        return false;
    }

    currentShop = data;
    renderShop();

    return true;
}


/* =========================================
   LOAD STORE COVER
========================================= */

function renderStoreCover(){
    const section = document.getElementById("storeCoverSection");
    const image = document.getElementById("storeCoverImage");

    if(!currentShop || !currentShop.shop_image){
        section.style.display = "none";
        return;
    }

    if(!isSafeImageUrl(currentShop.shop_image)){
        section.style.display = "none";
        return;
    }

    image.src = currentShop.shop_image;

    image.onerror = function(){
        section.style.display = "none";
    };

    section.style.display = "block";
}


/* =========================================
   LOAD STORE BANNERS
========================================= */

async function loadStoreBanners(){
    const section = document.getElementById("storeBannersSection");
    const list = document.getElementById("storeBannersList");

    list.innerHTML = "";
    section.style.display = "none";
    storeBanners = [];

    const {data, error} = await supabaseClient
        .from("live_qr_store_banners")
        .select("id,title,image_url,sort_order,is_active")
        .eq("shop_id", currentShop.id)
        .eq("is_active", true)
        .order("sort_order", {ascending:true});

    if(error){
        console.warn("Store banners could not load:", error);
        return;
    }

    storeBanners = data || [];

    storeBanners.forEach(function(banner){
        if(!banner.image_url || !isSafeImageUrl(banner.image_url)){
            return;
        }

        const image = document.createElement("img");

        image.className = "store-banner";
        image.src = banner.image_url;
        image.alt = banner.title || "Store banner";
        image.loading = "lazy";

        image.onerror = function(){
            image.remove();

            if(!list.querySelector("img")){
                section.style.display = "none";
            }
        };

        list.appendChild(image);
    });

    section.style.display =
        list.querySelector("img") ? "flex" : "none";
}


/* =========================================
   LOAD STORE CATEGORIES
========================================= */

async function loadStoreCategories(){
    const section = document.getElementById("storeCategoriesSection");
    const list = document.getElementById("storeCategoriesList");

    list.innerHTML = "";
    section.style.display = "none";
    storeCategories = [];

    const {data, error} = await supabaseClient
        .from("live_qr_store_categories")
        .select("id,name,image_url,sort_order,is_active")
        .eq("shop_id", currentShop.id)
        .eq("is_active", true)
        .order("sort_order", {ascending:true});

    if(error){
        console.warn("Store categories could not load:", error);
        return;
    }

    storeCategories = data || [];

    storeCategories.forEach(function(category){
        const button = document.createElement("button");

        button.type = "button";
        button.className = "category-item";
        button.dataset.categoryId = String(category.id);

        const imageWrap = document.createElement("div");
        imageWrap.className = "category-image-wrap";

        if(category.image_url && isSafeImageUrl(category.image_url)){
            const image = document.createElement("img");

            image.className = "category-image";
            image.src = category.image_url;
            image.alt = category.name || "Category";
            image.loading = "lazy";

            image.onerror = function(){
                image.remove();
                imageWrap.textContent = "▧";
            };

            imageWrap.appendChild(image);
        }else{
            imageWrap.textContent = "▧";
        }

        const name = document.createElement("div");
        name.className = "category-name";
        name.textContent = category.name || "Category";

        button.appendChild(imageWrap);
        button.appendChild(name);

        button.addEventListener("click", function(){
            selectedCategoryId =
                selectedCategoryId === category.id ? null : category.id;

            document.querySelectorAll(".category-item").forEach(function(item){
                item.classList.toggle(
                    "active",
                    item.dataset.categoryId === String(selectedCategoryId)
                );
            });

            renderProducts();
        });

        list.appendChild(button);
    });

    section.style.display =
        storeCategories.length ? "block" : "none";
}

  /* =========================================
   LOAD PRODUCTS
========================================= */

async function loadProducts(){
    const {data, error} = await supabaseClient
        .from("shop_products")
        .select(`
            id,
            shop_id,
            product_name,
            unit,
            price,
            image_url,
            is_available,
            sort_order,
            created_at
        `)
        .eq("shop_id", currentShop.id)
        .eq("is_available", true)
        .order("sort_order", {ascending:true})
        .order("created_at", {ascending:true});

    if(error){
        console.error("Product loading error:", error);

        showError(
            "Unable to load products",
            "Please refresh and try again."
        );

        return false;
    }

    products = data || [];
    renderProducts();

    return true;
}


/* =========================================
   PRODUCT RENDERING + SEARCH + CATEGORY
========================================= */

function renderProducts(){
    productsList.innerHTML = "";

    const query = (productSearch.value || "").trim().toLowerCase();

    const filteredProducts = products.filter(function(product){

        const matchesSearch =
            String(product.product_name || "").toLowerCase().includes(query) ||
            String(product.unit || "").toLowerCase().includes(query);

        /*
         * Current schema contains no product-category foreign key.
         * Until that relation exists, categories should not hide
         * products incorrectly.
         */
        const matchesCategory = !selectedCategoryId;

        return matchesSearch && matchesCategory;
    });

    productCount.textContent =
        filteredProducts.length +
        (filteredProducts.length === 1 ? " item" : " items");

    if(products.length === 0){
        emptyProducts.style.display = "block";
        noSearchResults.style.display = "none";
        return;
    }

    emptyProducts.style.display = "none";

    filteredProducts.forEach(function(product){
        productsList.appendChild(createProductCard(product));
    });

    noSearchResults.style.display =
        filteredProducts.length === 0 ? "block" : "none";
}


/* =========================================
   CREATE PRODUCT CARD
========================================= */

function createProductCard(product){
    const card = document.createElement("article");
    card.className = "product-card";

    const imageWrap = document.createElement("div");
    imageWrap.className = "product-image-wrap";

    function addImagePlaceholder(){
        imageWrap.innerHTML = "";

        const placeholder = document.createElement("div");
        placeholder.className = "product-image-placeholder";
        placeholder.textContent = "▧";
        placeholder.setAttribute(
            "aria-label",
            "Product image unavailable"
        );

        imageWrap.appendChild(placeholder);
    }

    if(product.image_url && isSafeImageUrl(product.image_url)){
        const image = document.createElement("img");

        image.className = "product-image";
        image.src = product.image_url;
        image.alt = product.product_name || "Product image";
        image.loading = "lazy";

        image.onerror = addImagePlaceholder;

        imageWrap.appendChild(image);
    }else{
        addImagePlaceholder();
    }

    card.appendChild(imageWrap);

    const details = document.createElement("div");
    details.className = "product-details";

    const name = document.createElement("div");
    name.className = "product-name";
    name.textContent = product.product_name || "Product";

    const unit = document.createElement("div");
    unit.className = "product-unit";
    unit.textContent = product.unit || "Available";

    details.appendChild(name);
    details.appendChild(unit);

    const actions = document.createElement("div");
    actions.className = "product-actions";

    const price = document.createElement("div");
    price.className = "product-price";
    price.textContent = formatPrice(product.price);

    const addButton = document.createElement("button");
    addButton.type = "button";
    addButton.className = "add-button";
    addButton.textContent = "Add";

    const quantityControl = document.createElement("div");
    quantityControl.className = "quantity-control";

    const minusButton = document.createElement("button");
    minusButton.type = "button";
    minusButton.className = "quantity-button";
    minusButton.textContent = "−";
    minusButton.setAttribute("aria-label", "Decrease quantity");

    const quantityValue = document.createElement("span");
    quantityValue.className = "quantity-value";
    quantityValue.textContent = "1";

    const plusButton = document.createElement("button");
    plusButton.type = "button";
    plusButton.className = "quantity-button";
    plusButton.textContent = "+";
    plusButton.setAttribute("aria-label", "Increase quantity");

    quantityControl.appendChild(minusButton);
    quantityControl.appendChild(quantityValue);
    quantityControl.appendChild(plusButton);

    actions.appendChild(price);
    actions.appendChild(addButton);
    actions.appendChild(quantityControl);

    card.appendChild(details);
    card.appendChild(actions);

    function refreshCard(){
        const quantity = Number(cart[product.id] || 0);

        if(quantity > 0){
            card.classList.add("selected");
            addButton.style.display = "none";
            quantityControl.classList.add("visible");
            quantityValue.textContent = quantity;
        }else{
            card.classList.remove("selected");
            addButton.style.display = "block";
            quantityControl.classList.remove("visible");
            quantityValue.textContent = "1";
        }
    }

    addButton.onclick = function(){
        cart[product.id] = 1;

        refreshCard();
        updateOrderFooter();
        showToast("Added to order");
    };

    minusButton.onclick = function(){
        const current = Number(cart[product.id] || 0);

        if(current <= 1){
            delete cart[product.id];
        }else{
            cart[product.id] = current - 1;
        }

        refreshCard();
        updateOrderFooter();
    };

    plusButton.onclick = function(){
        const current = Number(cart[product.id] || 0);

        cart[product.id] = current + 1;

        refreshCard();
        updateOrderFooter();
    };

    refreshCard();

    return card;
}


/* =========================================
   CART TOTALS
========================================= */

function getSelectedProducts(){
    return products.filter(function(product){
        return Number(cart[product.id] || 0) > 0;
    });
}

function getTotalItems(){
    return getSelectedProducts().reduce(function(total, product){
        return total + Number(cart[product.id] || 0);
    }, 0);
}

function getTotalPrice(){
    return getSelectedProducts().reduce(function(total, product){
        const quantity = Number(cart[product.id] || 0);
        const price = Number(product.price || 0);

        return total + quantity * price;
    }, 0);
}

function updateOrderFooter(){
    const totalItems = getTotalItems();
    const totalPrice = getTotalPrice();

    if(totalItems <= 0){
        orderFooter.style.display = "none";
        return;
    }

    orderFooter.style.display = "block";

    orderItems.textContent =
        totalItems + (totalItems === 1 ? " Item" : " Items");

    orderTotal.textContent = formatPrice(totalPrice);
}

  /* =========================================
   WHATSAPP ORDER MESSAGE
========================================= */

function buildWhatsAppMessage(){
    const selectedProducts = getSelectedProducts();
    const lines = [];

    lines.push("🛒 PYNCODE ORDER");
    lines.push("");
    lines.push("Shop: " + (currentShop.shop_name || ""));
    lines.push("");

    selectedProducts.forEach(function(product, index){
        const quantity = Number(cart[product.id] || 0);
        const price = Number(product.price || 0);
        const lineTotal = quantity * price;

        let line =
            (index + 1) + ". " +
            (product.product_name || "Product");

        if(product.unit){
            line += " (" + product.unit + ")";
        }

        line += " × " + quantity + " = " + formatPrice(lineTotal);

        lines.push(line);
    });

    lines.push("");
    lines.push("TOTAL: " + formatPrice(getTotalPrice()));
    lines.push("");
    lines.push("Please confirm my order.");

    return lines.join("\n");
}


function placeOrderOnWhatsApp(){
    if(getSelectedProducts().length === 0){
        showToast("Please select a product");
        return;
    }

    const whatsappNumber = normalizePhone(
        currentShop.whatsapp || currentShop.mobile
    );

    if(!whatsappNumber){
        showToast("WhatsApp number unavailable");
        return;
    }

    const whatsappUrl =
        "https://wa.me/" + whatsappNumber +
        "?text=" + encodeURIComponent(buildWhatsAppMessage());

    window.open(whatsappUrl, "_blank");
}

placeOrderButton.addEventListener(
    "click",
    placeOrderOnWhatsApp
);


/* =========================================
   TOAST MESSAGE
========================================= */

let toastTimer = null;

function showToast(message){
    toast.textContent = message;
    toast.style.opacity = "1";
    toast.style.transform = "translate(-50%,0)";

    clearTimeout(toastTimer);

    toastTimer = setTimeout(function(){
        toast.style.opacity = "0";
        toast.style.transform = "translate(-50%,20px)";
    }, 1800);
}


/* =========================================
   SEARCH
========================================= */

productSearch.addEventListener("input", renderProducts);


/* =========================================
   START LIVE QR PAGE
========================================= */

async function startLiveQrPage(){
    try{
        const shopLoaded = await loadShop();

        if(!shopLoaded){
            return;
        }

        renderStoreCover();

        /*
         * Banner/category failures should not prevent customers
         * from viewing products or placing orders.
         */
        await Promise.allSettled([
            loadStoreBanners(),
            loadStoreCategories()
        ]);

        const productsLoaded = await loadProducts();

        if(!productsLoaded){
            return;
        }

        loadingScreen.style.display = "none";
        errorScreen.style.display = "none";
        mainContent.style.display = "block";

    }catch(error){
        console.error("Live QR page error:", error);

        showError(
            "Something went wrong",
            "Please refresh the page and try again."
        );
    }
}

startLiveQrPage();

</script>
