<style>

/* =========================================
   RESET
========================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{

    font-family:
        Inter,

}

button{
    font-family:inherit;
    border:0;
    cursor:pointer;
}

button:focus{
    outline:none;
}

button:active{
    transform:scale(.97);
}

.page{

    width:100%;

    max-width:680px;

    min-height:100vh;

    margin:0 auto;

/* =========================================
   LOADING
========================================= */

.loading-screen{

    min-height:100vh;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:25px;

}

.loading-content{

    width:100%;

    max-width:320px;

    text-align:center;

}

.loading-logo{

    width:58px;

    height:58px;

    margin:0 auto 18px;

    border-radius:18px;

    background:#D96510;

    color:#fff;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:23px;

    font-weight:850;

    box-shadow:
        0 15px 35px rgba(217,101,16,.22);

}

.loading-title{

    font-size:20px;

    font-weight:750;

    margin-bottom:7px;

}

.loading-text{

    color:#9A8D84;

    font-size:13px;

}

.loading-spinner{

    width:28px;

    height:28px;

    margin:20px auto 0;

    border:3px solid #F0DCCE;

    border-top-color:#D96510;

    border-radius:50%;

    animation:
        loadingSpin .8s linear infinite;

}

@keyframes loadingSpin{

    to{
        transform:rotate(360deg);
    }

}


/* =========================================
   ERROR
========================================= */

.error-screen{

    min-height:100vh;

    display:none;

    align-items:center;

    justify-content:center;

    padding:25px;

}

.error-card{

    width:100%;

    max-width:390px;

    background:#FFFFFF;

    border-radius:25px;

    padding:34px 24px;

    text-align:center;

    border:1px solid #F1DED0;

    box-shadow:
        0 18px 50px rgba(120,65,25,.08);

}

.error-icon{

    width:60px;

    height:60px;

    margin:0 auto 18px;

    border-radius:50%;

    background:#FFF0E2;

    color:#C4570B;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:25px;

}

.error-title{

    font-size:20px;

    font-weight:800;

    margin-bottom:8px;

}

.error-text{

    color:#8C7D73;

    font-size:13px;

    line-height:1.6;

}


/* =========================================
   MAIN
========================================= */

#mainContent{
    display:none;
}


/* =========================================
   SHOP HERO
========================================= */

.shop-hero{

    position:relative;

    overflow:hidden;

    min-height:265px;

    padding:24px 20px 30px;

        radial-gradient(

            #B94F0A 0%,

            #E87516 100%
        );

    border-radius:
        0 0 32px 32px;

    box-shadow:
        0 20px 48px rgba(180,76,8,.20);

}

.shop-hero::after{

    content:"";

    position:absolute;

    width:180px;

    height:180px;

    right:-70px;

    bottom:-80px;

    border-radius:50%;

    border:1px solid rgba(255,255,255,.12);

}


/* =========================================
   BRAND
========================================= */

.brand-row{

    position:relative;

    z-index:2;

    display:flex;

    align-items:center;

    justify-content:space-between;

}

.pyncode-brand{

}

.live-badge{

/* =========================================
   SHOP NAME
========================================= */

.shop-name{

    z-index:2;

.shop-category{

/* =========================================

.shop-info{

/* =========================================

========================================= */

.products-section{

.products-heading{

}

.products-title{

    letter-spacing:-.5px;

}

.products-count{

    font-weight:650;

}


/* =========================================
   PRODUCT LIST
========================================= */

.products-list{

    display:flex;

    flex-direction:column;

    gap:10px;

}

.product-card{

    width:100%;

    min-height:88px;

}

}

}

.product-name{

.product-unit{

}

.product-actions{

/* =========================================

========================================= */

.add-button{

/* =========================================

/* =========================================

<script>


/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
    "https://mtuspuehsxsjoaxoenen.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_JpopjwDVjFvsDjXeG_56NQ_k3nA2mU6";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================
   STATE
========================================= */

let currentShop = null;

let products = [];

let cart = {};


/* =========================================
   ELEMENTS
========================================= */

const loadingScreen =
    document.getElementById(
        "loadingScreen"
    );

const errorScreen =
    document.getElementById(
        "errorScreen"
    );

const errorTitle =
    document.getElementById(
        "errorTitle"
    );

const errorMessage =
    document.getElementById(
        "errorMessage"
    );

const mainContent =
    document.getElementById(
        "mainContent"
    );

const shopName =
    document.getElementById(
        "shopName"
    );

const shopCategory =
    document.getElementById(
        "shopCategory"
    );

const shopLocation =
    document.getElementById(
        "shopLocation"
    );

const shopInfo =
    document.getElementById(
        "shopInfo"
    );

const productsList =
    document.getElementById(
        "productsList"
    );

const productCount =
    document.getElementById(
        "productCount"
    );

const emptyProducts =
    document.getElementById(
        "emptyProducts"
    );

const callButton =
    document.getElementById(
        "callButton"
    );

const whatsappButton =
    document.getElementById(
        "whatsappButton"
    );

const orderFooter =
    document.getElementById(
        "orderFooter"
    );

const orderItems =
    document.getElementById(
        "orderItems"
    );

const orderTotal =
    document.getElementById(
        "orderTotal"
    );

const placeOrderButton =
    document.getElementById(
        "placeOrderButton"
    );

const toast =
    document.getElementById(
        "toast"
    );


/* =========================================
   TOKEN
========================================= */

function getLiveQrToken(){

    const params =
        new URLSearchParams(
            window.location.search
        );

    return params.get("token");

}


/* =========================================
   ERROR
========================================= */

function showError(
    title,
    message
){

    loadingScreen.style.display =
        "none";

    mainContent.style.display =
        "none";

    errorScreen.style.display =
        "flex";

    errorTitle.textContent =
        title ||
        "Shop unavailable";

    errorMessage.textContent =
        message ||
        "This Live QR link is unavailable.";

}


/* =========================================
   PRICE
========================================= */

function formatPrice(value){

    const number =
        Number(value || 0);

    return "₹" +
        number.toLocaleString(
            "en-IN",
            {
                minimumFractionDigits:
                    number % 1 === 0
                        ? 0
                        : 2,

                maximumFractionDigits:2
            }
        );

}


/* =========================================
   PHONE
========================================= */

function normalizePhone(phone){

    if(!phone){
        return "";
    }

    let value =
        String(phone)
            .replace(/\D/g,"");


    if(
        value.length === 10
    ){

        value =
            "91" + value;

    }


    if(
        value.startsWith("0") &&
        value.length === 11
    ){

        value =
            "91" +
            value.substring(1);

    }


    return value;

}


/* =========================================
   LOCATION
========================================= */

function buildLocation(shop){

    const parts = [];


    if(shop.area){

        parts.push(
            shop.area
        );

    }


    if(shop.city){

        parts.push(
            shop.city
        );

    }


    if(shop.pincode){

        parts.push(
            shop.pincode
        );

    }


    if(
        parts.length === 0 &&
        shop.address
    ){

        parts.push(
            shop.address
        );

    }


    if(
        parts.length === 0
    ){

        return "Local shop";

    }


    return parts.join(
        " · "
    );

}


/* =========================================
   RENDER SHOP
========================================= */

function renderShop(){

    shopName.textContent =
        currentShop.shop_name ||
        "Shop";


    shopCategory.textContent =
        currentShop.category ||
        "Local Shop";


    shopLocation.textContent =
        buildLocation(
            currentShop
        );


    shopInfo.innerHTML = "";


    if(
        currentShop.address
    ){

        const pill =
            document.createElement(
                "div"
            );

        pill.className =
            "info-pill";

        pill.textContent =
            "📍 " +
            currentShop.address;

        shopInfo.appendChild(
            pill
        );

    }


    if(
        currentShop.pincode
    ){

        const pill =
            document.createElement(
                "div"
            );

        pill.className =
            "info-pill";

        pill.textContent =
            "PIN " +
            currentShop.pincode;

        shopInfo.appendChild(
            pill
        );

    }


    if(
        currentShop.owner_name
    ){

        const pill =
            document.createElement(
                "div"
            );

        pill.className =
            "info-pill";

        pill.textContent =
            "Owner · " +
            currentShop.owner_name;

        shopInfo.appendChild(
            pill
        );

    }


    const phone =
        String(
            currentShop.mobile ||
            currentShop.whatsapp ||
            ""
        )
        .replace(
            /\D/g,
            ""
        );


    if(phone){

        callButton.style.display =
            "flex";


        callButton.onclick =
            function(){

                window.location.href =
                    "tel:" + phone;

            };

    }
    else{

        callButton.style.display =
            "none";

    }


    const whatsapp =
        normalizePhone(
            currentShop.whatsapp ||
            currentShop.mobile
        );


    if(whatsapp){

        whatsappButton.style.display =
            "flex";


        whatsappButton.onclick =
            function(){

                window.open(
                    "https://wa.me/" +
                    whatsapp,
                    "_blank"
                );

            };

    }
    else{

        whatsappButton.style.display =
            "none";

    }

}


/* =========================================
   LOAD SHOP
========================================= */

async function loadShop(){

    const token =
        getLiveQrToken();


    if(!token){

        showError(
            "Invalid Live QR link",
            "Please scan the permanent QR code provided by the shop."
        );

        return false;

    }


    const {
        data,
        error
    } =
        await supabaseClient

            .from("shops")

            .select(`
                id,
                shop_name,
                category,
                owner_name,
                mobile,
                whatsapp,
                address,
                area,
                city,
                pincode,
                description,
                shop_image,
                live_qr_enabled,
                live_qr_token,
                live_qr_status
            `)

            .eq(
                "live_qr_token",
                token
            )

            .eq(
                "live_qr_enabled",
                true
            )

            .eq(
                "live_qr_status",
                "active"
            )

            .maybeSingle();


    if(error){

        console.error(
            "Shop loading error:",
            error
        );

        showError(
            "Unable to load shop",
            "Please refresh and try again."
        );

        return false;

    }


    if(!data){

        showError(
            "Shop unavailable",
            "This Live QR is invalid, disabled, or unavailable."
        );

        return false;

    }


    currentShop =
        data;


    renderShop();


    return true;

}

/* =========================================
   LOAD PRODUCTS
========================================= */

async function loadProducts(){

    const {
        data,
        error
    } =
        await supabaseClient

            .from("shop_products")

            .select(`
                id,
                shop_id,
                product_name,
                unit,
                price,
                image_url,
                is_available,
                sort_order,
                created_at
            `)

            .eq(
                "shop_id",
                currentShop.id
            )

            .eq(
                "is_available",
                true
            )

            .order(
                "sort_order",
                {
                    ascending:true
                }
            )

            .order(
                "created_at",
                {
                    ascending:true
                }
            );


    if(error){

        console.error(
            "Product loading error:",
            error
        );

        showError(
            "Unable to load products",
            "Please refresh and try again."
        );

        return false;

    }


    products =
        data || [];


    renderProducts();


    return true;

}


/* =========================================
   RENDER PRODUCTS
========================================= */

function renderProducts(){

    productsList.innerHTML = "";


    productCount.textContent =
        products.length +
        (
            products.length === 1
                ? " item"
                : " items"
        );


    if(
        products.length === 0
    ){

        emptyProducts.style.display =
            "block";

        return;

    }


    emptyProducts.style.display =
        "none";


    products.forEach(
        function(product){

            const card =
                createProductCard(
                    product
                );

            productsList.appendChild(
                card
            );

        }
    );

}


/* =========================================
   CREATE PRODUCT CARD
========================================= */

function createProductCard(
    product
){

    const card =
        document.createElement(
            "article"
        );

    card.className =
        "product-card";


    const details =
        document.createElement(
            "div"
        );

    details.className =
        "product-details";


    const name =
        document.createElement(
            "div"
        );

    name.className =
        "product-name";

    name.textContent =
        product.product_name ||
        "Product";


    const unit =
        document.createElement(
            "div"
        );

    unit.className =
        "product-unit";

    unit.textContent =
        product.unit ||
        "Available";


    details.appendChild(
        name
    );

    details.appendChild(
        unit
    );


    const actions =
        document.createElement(
            "div"
        );

    actions.className =
        "product-actions";


    const price =
        document.createElement(
            "div"
        );

    price.className =
        "product-price";

    price.textContent =
        formatPrice(
            product.price
        );


    const addButton =
        document.createElement(
            "button"
        );

    addButton.type =
        "button";

    addButton.className =
        "add-button";

    addButton.textContent =
        "Add";


    const quantityControl =
        document.createElement(
            "div"
        );

    quantityControl.className =
        "quantity-control";


    const minusButton =
        document.createElement(
            "button"
        );

    minusButton.type =
        "button";

    minusButton.className =
        "quantity-button";

    minusButton.textContent =
        "−";


    const quantityValue =
        document.createElement(
            "span"
        );

    quantityValue.className =
        "quantity-value";

    quantityValue.textContent =
        "1";


    const plusButton =
        document.createElement(
            "button"
        );

    plusButton.type =
        "button";

    plusButton.className =
        "quantity-button";

    plusButton.textContent =
        "+";


    quantityControl.appendChild(
        minusButton
    );

    quantityControl.appendChild(
        quantityValue
    );

    quantityControl.appendChild(
        plusButton
    );


    actions.appendChild(
        price
    );

    actions.appendChild(
        addButton
    );

    actions.appendChild(
        quantityControl
    );


    card.appendChild(
        details
    );

    card.appendChild(
        actions
    );


    function refreshCard(){

        const quantity =
            Number(
                cart[
                    product.id
                ] || 0
            );


        if(
            quantity > 0
        ){

            card.classList.add(
                "selected"
            );

            addButton.style.display =
                "none";

            quantityControl.classList.add(
                "visible"
            );

            quantityValue.textContent =
                quantity;

        }
        else{

            card.classList.remove(
                "selected"
            );

            addButton.style.display =
                "block";

            quantityControl.classList.remove(
                "visible"
            );

            quantityValue.textContent =
                "1";

        }

    }


    addButton.onclick =
        function(){

            cart[
                product.id
            ] = 1;


            refreshCard();

            updateOrderFooter();

            showToast(
                "Added to order"
            );

        };


    minusButton.onclick =
        function(){

            const current =
                Number(
                    cart[
                        product.id
                    ] || 0
                );


            if(
                current <= 1
            ){

                delete cart[
                    product.id
                ];

            }
            else{

                cart[
                    product.id
                ] =
                    current - 1;

            }


            refreshCard();

            updateOrderFooter();

        };


    plusButton.onclick =
        function(){

            const current =
                Number(
                    cart[
                        product.id
                    ] || 0
                );


            cart[
                product.id
            ] =
                current + 1;


            refreshCard();

            updateOrderFooter();

        };


    refreshCard();


    return card;

}


/* =========================================
   SELECTED PRODUCTS
========================================= */

function getSelectedProducts(){

    return products.filter(
        function(product){

            return (
                Number(
                    cart[
                        product.id
                    ] || 0
                ) > 0
            );

        }
    );

}


/* =========================================
   TOTAL ITEMS
========================================= */

function getTotalItems(){

    return getSelectedProducts()
        .reduce(
            function(total,product){

                return total +
                    Number(
                        cart[
                            product.id
                        ] || 0
                    );

            },
            0
        );

}


/* =========================================
   TOTAL PRICE
========================================= */

function getTotalPrice(){

    return getSelectedProducts()
        .reduce(
            function(total,product){

                const quantity =
                    Number(
                        cart[
                            product.id
                        ] || 0
                    );

                const price =
                    Number(
                        product.price || 0
                    );


                return total +
                    (
                        quantity *
                        price
                    );

            },
            0
        );

}


/* =========================================
   UPDATE ORDER FOOTER
========================================= */

function updateOrderFooter(){

    const totalItems =
        getTotalItems();

    const totalPrice =
        getTotalPrice();


    if(
        totalItems <= 0
    ){

        orderFooter.style.display =
            "none";

        return;

    }


    orderFooter.style.display =
        "block";


    orderItems.textContent =
        totalItems +
        (
            totalItems === 1
                ? " Item"
                : " Items"
        );


    orderTotal.textContent =
        formatPrice(
            totalPrice
        );

}

/* =========================================
   BUILD WHATSAPP MESSAGE
========================================= */

function buildWhatsAppMessage(){

    const selectedProducts =
        getSelectedProducts();


    const lines = [];


    lines.push(
        "🛒 PYNCODE ORDER"
    );


    lines.push("");


    lines.push(
        "Shop: " +
        (
            currentShop.shop_name ||
            ""
        )
    );


    lines.push("");


    selectedProducts.forEach(
        function(product,index){

            const quantity =
                Number(
                    cart[
                        product.id
                    ] || 0
                );


            const price =
                Number(
                    product.price || 0
                );


            const lineTotal =
                quantity *
                price;


            let line =
                (
                    index + 1
                ) +
                ". " +
                (
                    product.product_name ||
                    "Product"
                );


            if(
                product.unit
            ){

                line +=
                    " (" +
                    product.unit +
                    ")";

            }


            line +=
                " × " +
                quantity +
                " = " +
                formatPrice(
                    lineTotal
                );


            lines.push(
                line
            );

        }
    );


    lines.push("");


    lines.push(
        "TOTAL: " +
        formatPrice(
            getTotalPrice()
        )
    );


    lines.push("");


    lines.push(
        "Please confirm my order."
    );


    return lines.join(
        "\n"
    );

}


/* =========================================
   PLACE ORDER
========================================= */

function placeOrderOnWhatsApp(){

    const selectedProducts =
        getSelectedProducts();


    if(
        selectedProducts.length === 0
    ){

        showToast(
            "Please select a product"
        );

        return;

    }


    const whatsappNumber =
        normalizePhone(
            currentShop.whatsapp ||
            currentShop.mobile
        );


    if(
        !whatsappNumber
    ){

        showToast(
            "WhatsApp number unavailable"
        );

        return;

    }


    const message =
        buildWhatsAppMessage();


    const whatsappUrl =
        "https://wa.me/" +
        whatsappNumber +
        "?text=" +
        encodeURIComponent(
            message
        );


    window.open(
        whatsappUrl,
        "_blank"
    );

}


/* =========================================
   ORDER BUTTON
========================================= */

placeOrderButton.addEventListener(
    "click",
    placeOrderOnWhatsApp
);


/* =========================================
   TOAST
========================================= */

let toastTimer = null;


function showToast(
    message
){

    toast.textContent =
        message;


    toast.style.opacity =
        "1";


    toast.style.transform =
        "translate(-50%,0)";


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            function(){

                toast.style.opacity =
                    "0";


                toast.style.transform =
                    "translate(-50%,20px)";

            },
            1800
        );

}


/* =========================================
   START
========================================= */

async function startLiveQrPage(){

    try{

        const shopLoaded =
            await loadShop();


        if(
            !shopLoaded
        ){

            return;

        }


        const productsLoaded =
            await loadProducts();


        if(
            !productsLoaded
        ){

            return;

        }


        loadingScreen.style.display =
            "none";


        errorScreen.style.display =
            "none";


        mainContent.style.display =
            "block";


    }
    catch(error){

        console.error(
            "Live QR page error:",
            error
        );


        showError(
            "Something went wrong",
            "Please refresh the page and try again."
        );

    }

}


/* =========================================
   INITIALIZE
========================================= */

startLiveQrPage();

</script>
