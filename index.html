<script>

/* =====================================================
   SUPABASE CONNECTION
===================================================== */

const SUPABASE_URL =
    "https://mtuspuehsxsjoaxoenen.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_JpopjwDVjFvsDjXeG_56NQ_k3nA2mU6";


const supabaseClient =
    supabase.createClient(

/* =====================================================
   HIDDEN ADMIN ACCESS
   5 TAPS ON PYNCODE LOGO
===================================================== */

const adminTrigger =
    document.getElementById(
        "adminTrigger"
    );


let adminTapCount =
    0;


let adminTapTimer =
    null;


const ADMIN_TAPS =
    5;


const ADMIN_TAP_TIMEOUT =
    2000;


if(adminTrigger){

    adminTrigger.addEventListener(
        "click",
        function(){

            adminTapCount++;


            clearTimeout(
                adminTapTimer
            );


            adminTapTimer =
                setTimeout(
                    function(){

                        adminTapCount =
                            0;

                    },
                    ADMIN_TAP_TIMEOUT
                );


            if(
                adminTapCount >=
                ADMIN_TAPS
            ){

                adminTapCount =
                    0;


                clearTimeout(
                    adminTapTimer
                );


                window.location.href =
                    "admin-login.html";

            }

        }
    );


    adminTrigger.addEventListener(
        "keydown",
        function(event){

            if(
                event.key === "Enter" ||
                event.key === " "
            ){

                event.preventDefault();

                adminTrigger.click();

            }

        }
    );

}

  /* =====================================================
   LOAD CATEGORIES
===================================================== */

function loadCategories(){

    const categoryGrid =
        document.getElementById(
            "categoryGrid"
        );


    if(!categoryGrid){

        return;

    }


    categoryGrid.innerHTML =
        categories
        .map(
            function(item){

                const icon =
                    item[0];

                const name =
                    item[1];


                return `

                    <a
                        class="category-card"
                        href="category.html?category=${encodeURIComponent(name)}"
                    >

                        <span class="category-icon">
                            ${icon}
                        </span>


                        <span>
                            ${name}
                        </span>


                        <span class="category-arrow">
                            →
                        </span>

                    </a>

                `;

            }
        )
        .join("");

}


/* =====================================================
   INITIALIZE WEBSITE
===================================================== */

async function initialize(){

    /*
     * Load existing categories
     */

    loadCategories();

}


/* =====================================================
   START WEBSITE
===================================================== */

if(
    document.readyState ===
    "loading"
){

    document.addEventListener(
        "DOMContentLoaded",
        initialize
    );

}
else{

    initialize();

}
