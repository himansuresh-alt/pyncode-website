<style>

/* =====================================================
   RESET
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:
        linear-gradient(
            180deg,
            #f8fbff 0%,
            #f5f7fb 55%,
            #ffffff 100%
        );

    color:#151a28;

    min-height:100vh;

    padding-bottom:90px;
}


/* =====================================================
   HEADER
===================================================== */

.header{

    width:100%;

    min-height:76px;

    background:
        rgba(255,255,255,.97);

    border-bottom:
        1px solid #e6e9ef;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:
        0 4%;

    position:relative;

    z-index:20;

    box-shadow:
        0 5px 20px
        rgba(20,30,60,.045);

}


.logo{

    display:flex;

    align-items:center;

    gap:10px;

    color:#151a28;

    font-size:23px;

    font-weight:900;

    letter-spacing:-.5px;

    cursor:pointer;

    user-select:none;

}


.logo-mark{

    width:100px;

    height:42px;

    display:flex;

    align-items:center;

    justify-content:center;

    border-radius:13px;

    color:#fff;

    font-size:21px;

    font-weight:900;

    background:
        linear-gradient(
            135deg,
            #ff7619,
            #ff416d
        );

    box-shadow:
        0 8px 20px
        rgba(255,90,70,.22);

}


.logo-mark img{

    width:100%;

    height:100%;

    object-fit:contain;

    display:block;

}


.list-shop-btn{

    min-height:44px;

    padding:
        0 19px;

    display:inline-flex;

    align-items:center;

    justify-content:center;

    border-radius:12px;

    background:
        linear-gradient(
            135deg,
            #151a24,
            #252b36
        );

    color:#fff;

    text-decoration:none;

    font-size:13px;

    font-weight:900;

    box-shadow:
        0 7px 17px
        rgba(0,0,0,.12);

    transition:
        transform .2s ease,
        box-shadow .2s ease;

}


.list-shop-btn:hover{

    transform:
        translateY(-2px);

    box-shadow:
        0 10px 22px
        rgba(0,0,0,.17);

}


.header-actions{

    display:flex;

    align-items:center;

    gap:6px;

}


/* =====================================================
   HOME ACTION BUTTONS
===================================================== */

.home-action-buttons{

    display:flex;

    align-items:center;

    justify-content:center;

    gap:10px;

    padding:
        8px 4% 0;

}


.services-button,
.promotion-button{

    display:inline-flex;

    align-items:center;

    justify-content:center;

    gap:9px;

    min-height:50px;

    padding:
        0 24px;

    border-radius:14px;

    color:#fff;

    text-decoration:none;

    font-size:15px;

    font-weight:900;

}


.services-button{

    background:
        linear-gradient(
            135deg,
            #ff7619,
            #ff416d
        );

    box-shadow:
        0 8px 20px
        rgba(255,90,70,.20);

}


.promotion-button{

    background:
        linear-gradient(
            135deg,
            #151a24,
            #252b36
        );

    box-shadow:
        0 8px 20px
        rgba(20,25,35,.16);

}


.services-button span,
.promotion-button span{

    font-size:19px;

}


/* =====================================================
   CATEGORIES SECTION
===================================================== */

.categories-section{

    width:100%;

    max-width:1200px;

    margin:0 auto;

    padding:
        38px 4% 65px;

}


.section-heading{

    margin-bottom:24px;

}


.section-eyebrow{

    display:flex;

    align-items:center;

    gap:7px;

    color:#ef603e;

    font-size:12px;

    font-weight:900;

    letter-spacing:.7px;

    text-transform:uppercase;

    margin-bottom:7px;

}


.section-title{

    color:#151a28;

    font-size:30px;

    line-height:1.15;

    font-weight:900;

    letter-spacing:-.7px;

}


.section-subtitle{

    margin-top:7px;

    color:#7b8492;

    font-size:14px;

    line-height:1.5;

}


/* =====================================================
   CATEGORY GRID
===================================================== */

.category-grid{

    display:grid;

    grid-template-columns:
        repeat(
            4,
            minmax(0,1fr)
        );

    gap:12px;

}


/* =====================================================
   CATEGORY CARD
===================================================== */

.category-card{

    min-height:68px;

    padding:
        12px 14px;

    display:flex;

    align-items:center;

    gap:11px;

    background:
        rgba(255,255,255,.98);

    border:
        1px solid #dfe4ea;

    border-radius:16px;

    color:#171c28;

    text-decoration:none;

    font-size:13px;

    font-weight:800;

    line-height:1.3;

    box-shadow:
        0 5px 17px
        rgba(25,40,70,.035);

    transition:
        transform .2s ease,
        border-color .2s ease,
        box-shadow .2s ease,
        background .2s ease;

}


.category-card:hover{

    transform:
        translateY(-3px);

    border-color:#ffc1ad;

    background:#fff;

    box-shadow:
        0 11px 25px
        rgba(255,91,65,.09);

}


.category-icon{

    width:42px;

    height:42px;

    flex-shrink:0;

    display:flex;

    align-items:center;

    justify-content:center;

    border-radius:12px;

    background:
        linear-gradient(
            145deg,
            #fff1e9,
            #fff8f5
        );

    border:
        1px solid #ffded1;

    font-size:20px;

}


.category-arrow{

    margin-left:auto;

    color:#a2a9b3;

    font-size:17px;

    transition:
        transform .2s ease,
        color .2s ease;

}


.category-card:hover .category-arrow{

    color:#f05e3c;

    transform:
        translateX(3px);

}


/* =====================================================
   FOOTER
===================================================== */

.footer{

    width:100%;

    background:
        linear-gradient(
            135deg,
            #101624,
            #151d30
        );

    color:#fff;

    padding:
        32px 4% 21px;

}


.footer-inner{

    width:100%;

    max-width:1180px;

    margin:0 auto;

    display:grid;

    grid-template-columns:
        1.2fr
        1fr
        auto;

    align-items:center;

    gap:30px;

}


.footer-brand{

    min-width:0;

}


.footer-title{

    color:#fff;

    font-size:21px;

    font-weight:900;

}


.footer-text{

    margin-top:7px;

    color:#aeb6c5;

    font-size:13px;

    line-height:1.5;

}


.footer-links{

    display:flex;

    align-items:center;

    justify-content:center;

    gap:9px;

    flex-wrap:wrap;

}


.footer-links a{

    color:#aeb6c5 !important;

    text-decoration:none !important;

    font-size:13px;

}


.footer-links a:hover{

    color:#ff9369 !important;

}


.footer-separator{

    color:#4d5668;

    font-size:13px;

}


.footer-contact{

    min-width:200px;

    padding-left:27px;

    border-left:
        1px solid #343d50;

}


.footer-ad{

    color:#969faf;

    font-size:12px;

    margin-bottom:5px;

}


.footer-contact a{

    display:block;

    color:#fff !important;

    text-decoration:none !important;

    font-size:14px;

    font-weight:800;

    line-height:1.4;

}


.footer-number{

    color:#ff9369 !important;

    font-size:20px !important;

    margin-top:3px;

}


.footer-copy{

    width:100%;

    max-wid

  th:1180px;

    margin:
        23px auto 0;

    padding-top:17px;

    border-top:
        1px solid #2c3446;

    color:#737d91 !important;

    font-size:12px;

    text-align:center;

}

/* =====================================================
   FIXED BOTTOM NAVIGATION
===================================================== */


.bottom-nav{
    position:fixed;

    left:10px;
    right:10px;
    bottom:10px;

    height:68px;

    background:#151d30;

    border:1px solid rgba(255,255,255,.08);

    border-radius:24px;

    display:flex;

    align-items:center;

    justify-content:space-around;

    padding:6px;

    z-index:9998;

    box-shadow:
        0 8px 28px
        rgba(10,20,40,.20);
}


.bottom-nav-item{
    flex:1;

    height:56px;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    gap:4px;

    border-radius:18px;

    text-decoration:none;

    color:#aeb6c5;

    font-size:11px;

    font-weight:800;

    transition:
        background .2s ease,
        color .2s ease,
        transform .15s ease;
}

.bottom-nav-item{
    flex:1;
    height:56px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
    border-radius:18px;
    text-decoration:none;
    color:#aeb6c5;
    font-size:11px;
    font-weight:800;
}

.bottom-nav-item .nav-label{
    font-size:10px;
    line-height:1.2;
}


.bottom-nav-item.active{
    background:#ffffff;

    color:#151a28;

    box-shadow:
        0 3px 10px
        rgba(0,0,0,.08);
}


.bottom-nav-item:active{
    transform:scale(.95);
}

  /* PYNCODE HOME ACTION BANNERS */
.pyncode-banner-stack {
    width: 100%;
    max-width: 1200px;
    margin: 0 auto;
    padding: 20px 24px 8px;
    display: flex;
    flex-direction: column;
    gap: 16px;
}

.pyncode-banner {
    position: relative;
    isolation: isolate;
    overflow: hidden;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 180px;
    align-items: center;
    gap: 18px;
    min-height: 220px;
    padding: 24px 26px;
    border-radius: 24px;
    border: 1px solid rgba(255,255,255,.8);
    box-shadow: 0 10px 28px rgba(23,45,35,.09);
}

.pyncode-banner:after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background: linear-gradient(130deg,transparent 55%,rgba(255,255,255,.4));
}

.pyncode-banner.qr {
    background: linear-gradient(115deg,#e9f8ed,#b8e4c8);
}

.pyncode-banner.shop {
    background: linear-gradient(115deg,#fff1df,#ffd39f);
}

.pyncode-banner.service {
    background: linear-gradient(115deg,#e8f3ff,#b8d9ff);
}

.pyncode-banner-copy {
    position: relative;
    z-index: 1;
    max-width: 720px;
}

.pyncode-banner-tag {
    display: inline-block;
    padding: 7px 11px;
    border-radius: 99px;
    background: #167c4b;
    color: #fff;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: .4px;
}

.pyncode-banner.shop .pyncode-banner-tag,
.pyncode-banner.shop .pyncode-banner-button {
    background: #e85c18;
}

.pyncode-banner.service .pyncode-banner-tag,
.pyncode-banner.service .pyncode-banner-button {
    background: #1768c7;
}

.pyncode-banner h2 {
    margin: 12px 0 4px;
    font-size: clamp(28px,4vw,42px);
    line-height: 1.05;
    font-weight: 900;
    color: #172820;
}

.pyncode-banner.shop h2 span {
    color: #d64a12;
}

.pyncode-banner.service h2 span {
    color: #145eb3;
}

.pyncode-banner h3 {
    margin: 0 0 8px;
    font-size: 18px;
    font-weight: 800;
    color: #263a30;
}

.pyncode-banner p {
    font-size: 14px;
    line-height: 1.6;
    color: #3e5147;
    max-width: 600px;
}

.pyncode-banner-button {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-top: 14px;
    padding: 11px 16px;
    border-radius: 12px;
    background: #167c4b;
    color: #fff;
    text-decoration: none;
    font-size: 13px;
    font-weight: 800;
}

.pyncode-banner-art {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 150px;
    position: relative;
}

.banner-phone {
    width: 88px;
    padding: 9px 7px;
    border: 4px solid #1b2922;
    border-radius: 19px;
    background: #fff;
    box-shadow: 0 10px 20px #193b2928;
    transform: rotate(-6deg);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    color: #1c2d23;
    font-size: 9px;
    font-weight: 700;
}

.banner-phone .phone-notch {
    width: 32px;
    height: 5px;
    background: #17231d;
    border-radius: 8px;
}

.banner-phone .phone-avatar {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: #e4f3e8;
    font-size: 17px;
}

.banner-phone span {
    padding: 4px;
    background: #f0f6f2;
    border-radius:

  5px;
    width: 100%;
    text-align: center;
}

.banner-qr {
    width: 90px;
    padding: 10px 7px;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 9px 20px #193b2928;
    transform: rotate(5deg);
    display: flex;
    align-items: center;
    flex-direction: column;
    gap: 6px;
    font-size: 10px;
    font-weight: 800;
}

.banner-qr-pattern {
    width: 58px;
    height: 58px;
    border: 5px solid #18271f;
    background: repeating-conic-gradient(#18271f 0 25%,#fff 0 50%) 0/12px 12px;
}

.banner-shop-emoji,
.banner-service-emoji {
    font-size: 88px;
    filter: drop-shadow(0 8px 8px #6d421b25);
}

.banner-benefit-list,
.banner-service-list {
    display: flex;
    flex-direction: column;
    gap: 7px;
}

.banner-benefit-list span,
.banner-service-list span {
    background: #ffffffdf;
    padding: 8px 9px;
    border-radius: 10px;
    font-size: 10px;
    font-weight: 800;
    white-space: nowrap;
    color: #27382e;
}

@media(max-width:700px) {

    }

/* QR STORE CUSTOM IMAGE BANNER — DESIGN ONLY */
.pyncode-qr-image-banner {
    display: block;
    min-height: 0;
    padding: 0;
    border: 0;
    overflow: hidden;
    background: #fff8ef;
    border-radius: 24px;
    box-shadow: 0 12px 32px rgba(90, 48, 16, .10);
}
.pyncode-qr-image-banner::after {
    display: none;
}
.pyncode-qr-image-banner a {
    display: block;
    width: 100%;
    line-height: 0;
    border-radius: inherit;
}
.pyncode-qr-image-banner img {
    display: block;
    width: 100%;
    height: auto;
    border-radius: inherit;
}
.pyncode-qr-image-banner a:focus-visible {
    outline: 3px solid #f05a24;
    outline-offset: 4px;
}
@media (max-width: 700px) {
    .pyncode-qr-image-banner {
        padding: 0;
        border-radius: 16px;
    }
    .pyncode-qr-image-banner img {
        width: 100%;
        height: auto;
        object-fit: contain;
    }
}



/* =====================================================
   PYNCODE THREE PREMIUM IMAGE BANNERS — DESIGN ONLY
   Original destinations and all page functionality preserved.
===================================================== */
.pyncode-banner-stack .pyncode-image-banner {
    display: block;
    width: 100%;
