<style>

/* =====================================================
   RESET
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:
        linear-gradient(
            180deg,
            #f8fbff 0%,
            #f5f7fb 55%,
            #ffffff 100%
        );

    color:#151a28;

    min-height:100vh;
}


/* =====================================================
   HEADER
===================================================== */

.header{

    width:100%;

    min-height:76px;

    background:
        rgba(255,255,255,.97);

    border-bottom:
        1px solid #e6e9ef;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:
        0 4%;

    position:relative;

    z-index:20;

    box-shadow:
        0 5px 20px
        rgba(20,30,60,.045);

}


.logo{

    display:flex;

    align-items:center;

    gap:10px;

    color:#151a28;

    font-size:23px;

    font-weight:900;

    letter-spacing:-.5px;

    cursor:pointer;

    user-select:none;

}


.logo-mark{

    width:100px;

    height:42px;

    display:flex;

    align-items:center;

    justify-content:center;

    border-radius:13px;

    color:#fff;

    font-size:21px;

    font-weight:900;

    background:
        linear-gradient(
            135deg,
            #ff7619,
            #ff416d
        );

    box-shadow:
        0 8px 20px
        rgba(255,90,70,.22);

}

.logo-mark img{

    width:100%;

    height:100%;

    object-fit:contain;

    display:block;

}


.list-shop-btn{

    min-height:44px;

    padding:
        0 19px;

    display:inline-flex;

    align-items:center;

    justify-content:center;

    border-radius:12px;

    background:
        linear-gradient(
            135deg,
            #151a24,
            #252b36
        );

    color:#fff;

    text-decoration:none;

    font-size:13px;

    font-weight:900;

    box-shadow:
        0 7px 17px
        rgba(0,0,0,.12);

    transition:
        transform .2s ease,
        box-shadow .2s ease;

}


.list-shop-btn:hover{

    transform:
        translateY(-2px);

    box-shadow:
        0 10px 22px
        rgba(0,0,0,.17);

}


/* =====================================================
   BANNER SECTION
===================================================== */

.banner-section{

    padding:
        28px 4% 12px;

}


.banner{

    width:100%;

    height:300px;

    position:relative;

    overflow:hidden;

    border-radius:22px;

    background:#e9eaec;

    box-shadow:
        0 10px 28px
        rgba(25,40,70,.08);

}


.banner-image{

    width:100%;

    height:100%;

    display:block;

    object-fit:cover;

    border-radius:22px;

    transition:
        opacity .25s ease;

}


.banner-image.hidden{

    display:none;

}


/* =====================================================
   BANNER ARROWS
===================================================== */

.banner-arrow{

    position:absolute;

    top:50%;

    transform:
        translateY(-50%);

    width:46px;

    height:46px;

    border:none;

    border-radius:50%;

    background:
        rgba(15,20,30,.52);

    color:#fff;

    font-size:29px;

    cursor:pointer;

    z-index:10;

    backdrop-filter:
        blur(5px);

    transition:
        transform .2s ease,
        background .2s ease;

}


.banner-arrow:hover{

    background:
        rgba(15,20,30,.72);

}


.banner-arrow:active{

    transform:
        translateY(-50%)
        scale(.94);

}


.banner-arrow.left{

    left:15px;

}


.banner-arrow.right{

    right:15px;

}


/* =====================================================
   BANNER DOTS
===================================================== */

.banner-dots{

    position:absolute;

    left:50%;

    bottom:14px;

    transform:
        translateX(-50%);

    display:flex;

    gap:7px;

    z-index:10;

}


.banner-dot{

    width:9px;

    height:9px;

    border-radius:50%;

    background:
        rgba(255,255,255,.82);

    border:
        1px solid
        rgba(0,0,0,.14);

    cursor:pointer;

}


.banner-dot.active{

    background:#151a24;

}


/* =====================================================
   EMPTY BANNER
===================================================== */

.banner-empty{

    position:absolute;

    inset:0;

    display:flex;

    align-items:center;

    justify-content:center;

    color:#9298a2;

    font-size:14px;

    background:#e9eaec;

}


/* =====================================================
   HOME ACTION BUTTONS
===================================================== */

.home-action-buttons{

    display:flex;

    align-items:center;

    justify-content:center;

    gap:10px;

    padding:

}


.services-button,
.promotion-button{

    align-items:center;

    justify-content:center;

    gap:9px;

    min-height:50px;

    font-weight:900;

}


.services-button{

}


.promotion-button{

            #151a24,
            #252b36

    box-shadow:

}


.services-button span,
.promotion-button span{

}


/* =====================================================
   CATEGORIES SECTION
===================================================== */

.categories-section{

    width:100%;

    max-width:1200px;

    margin:0 auto;

    padding:
        38px 4% 65px;

}


.section-heading{

    margin-bottom:24px;

}


.section-eyebrow{

    display:flex;

    align-items:center;

    gap:7px;

    color:#ef603e;

    font-size:12px;

    font-weight:900;

    letter-spacing:.7px;

    text-transform:uppercase;

    margin-bottom:7px;

}


.section-title{

    color:#151a28;

    font-size:30px;

    line-height:1.15;

    font-weight:900;

    letter-spacing:-.7px;

}


.section-subtitle{

    margin-top:7px;

    color:#7b8492;

    font-size:14px;

    line-height:1.5;

}


/* =====================================================
   CATEGORY GRID
===================================================== */

.category-grid{

    display:grid;

    grid-template-columns:
        repeat(
            4,
            minmax(0,1fr)

    gap:12px;

}


/* =====================================================
   CATEGORY CARD
===================================================== */

.category-card{

    padding:
        12px 14px;

    align-items:center;

    gap:11px;

    color:#171c28;

    text-decoration:none;

    font-size:13px;

    font-weight:800;

    line-height:1.3;

}


.category-card:hover{

    transform:

    background:#fff;

    box-shadow:

.category-icon{

    display:flex;

    align-items:center;

.category-arrow{

<script>

/* =====================================================
   SUPABASE CONNECTION
===================================================== */

const SUPABASE_URL =
    "https://mtuspuehsxsjoaxoenen.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_JpopjwDVjFvsDjXeG_56NQ_k3nA2mU6";


const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =====================================================
   HIDDEN ADMIN ACCESS
   5 TAPS ON PYNCODE LOGO
===================================================== */

const adminTrigger =
    document.getElementById(
        "adminTrigger"
    );


let adminTapCount =
    0;


let adminTapTimer =
    null;


const ADMIN_TAPS =
    5;


const ADMIN_TAP_TIMEOUT =
    2000;


if(adminTrigger){

    adminTrigger.addEventListener(
        "click",
        function(){

            adminTapCount++;


            clearTimeout(
                adminTapTimer
            );


            adminTapTimer =
                setTimeout(
                    function(){

                        adminTapCount =
                            0;

                    },
                    ADMIN_TAP_TIMEOUT
                );


            if(
                adminTapCount >=
                ADMIN_TAPS
            ){

                adminTapCount =
                    0;


                clearTimeout(
                    adminTapTimer
                );


                window.location.href =
                    "admin-login.html";

            }

        }
    );


    adminTrigger.addEventListener(
        "keydown",
        function(event){

            if(
                event.key === "Enter" ||
                event.key === " "
            ){

                event.preventDefault();

                adminTrigger.click();

        }

}


/* =====================================================
   BANNER STATE
===================================================== */

let banners =
    [];


let currentBanner =
    0;


/* =====================================================
   BANNER ELEMENTS
===================================================== */

const bannerImage =
    document.getElementById(
        "bannerImage"
    );


const bannerEmpty =
    document.getElementById(
        "bannerEmpty"
    );


const bannerDots =
    document.getElementById(
        "bannerDots"
    );


const prevButton =
    document.getElementById(
        "prevBanner"
    );


const nextButton =
    document.getElementById(
        "nextBanner"
    );


const bannerViewer =
    document.getElementById(
        "bannerViewer"
    );


const bannerViewerImage =
    document.getElementById(
        "bannerViewerImage"
    );


const bannerViewerClose =
    document.getElementById(
        "bannerViewerClose"
    );


const bannerViewerPrev =
    document.getElementById(
        "bannerViewerPrev"
    );


const bannerViewerNext =
    document.getElementById(
        "bannerViewerNext"
    );


const bannerBox =
    document.querySelector(
        ".banner"
    );


/* =====================================================
   OPEN FULLSCREEN VIEWER
===================================================== */

function openBannerViewer(){

    if(
        !banners.length ||
        !banners[currentBanner] ||
        !banners[currentBanner].imageUrl
    ){

        return;

    }


    bannerViewerImage.src =
        banners[currentBanner].imageUrl;


    bannerViewer.classList.add(
        "active"
    );

}


if(bannerBox){

    bannerBox.addEventListener(
        "click",
        function(event){

            if(
                event.target.closest(
                    "button"
                )
            ){

                return;

            }


            if(
                !bannerImage ||
                bannerImage.classList.contains(
                    "hidden"
                )
            ){

                return;

            }


            openBannerViewer();

        }
    );

}

  /* =====================================================
   LOAD BANNERS
===================================================== */

async function loadBanners(){

    try{

        const {
            data,
            error
        } =
        await supabaseClient
            .from("banners")
            .select("*")
            .eq(
                "is_active",
                true
            )
            .order(
                "created_at",
                {
                    ascending:false
                }
            );


        if(error){

            console.error(
                "BANNER LOAD ERROR:",
                error
            );


            banners =
                [];


            createDots();

            showBanner(0);

            return;

        }


        banners =
            (data || [])
            .map(
                function(item){

                    return {

                        id:
                            item.id,

                        name:
                            item.name || "",

                        imageUrl:
                            item.image_url

                    };

                }
            )
            .filter(
                function(item){

                    return Boolean(
                        item.imageUrl
                    );

                }
            );


        currentBanner =
            0;


        createDots();

        showBanner(0);

    }
    catch(error){

        console.error(
            "BANNER ERROR:",
            error
        );


        banners =
            [];


        createDots();

        showBanner(0);

    }

}


/* =====================================================
   CREATE BANNER DOTS
===================================================== */

function createDots(){

    if(!bannerDots){

        return;

    }


    bannerDots.innerHTML =
        "";


    if(
        banners.length <= 1
    ){

        return;

    }


    banners.forEach(
        function(_,index){

            const dot =
                document.createElement(
                    "span"
                );


            dot.className =
                "banner-dot";


            if(
                index ===
                currentBanner
            ){

                dot.classList.add(
                    "active"
                );

            }


            dot.addEventListener(
                "click",
                function(event){

                    event.stopPropagation();

                    showBanner(
                        index
                    );

                }
            );


            bannerDots.appendChild(
                dot
            );

        }
    );

}


/* =====================================================
   UPDATE DOTS
===================================================== */

function updateDots(){

    if(!bannerDots){

        return;

    }


    const dots =
        bannerDots.querySelectorAll(
            ".banner-dot"
        );


    dots.forEach(
        function(dot,index){

            if(
                index ===
                currentBanner
            ){

                dot.classList.add(
                    "active"
                );

            }
            else{

                dot.classList.remove(
                    "active"
                );

            }

        }
    );

}


/* =====================================================
   SHOW BANNER
===================================================== */

function showBanner(index){

    if(
        !bannerImage ||
        !bannerEmpty
    ){

        return;

    }


    /* NO BANNERS */

    if(
        banners.length === 0
    ){

        bannerImage.classList.add(
            "hidden"
        );


        bannerImage.removeAttribute(
            "src"
        );


        bannerEmpty.style.display =
            "flex";


        if(bannerDots){

            bannerDots.innerHTML =
                "";

        }


        return;

    }


    /* LOOP FORWARD */

    if(
        index >=
        banners.length
    ){

        index =
            0;

    }


    /* LOOP BACKWARD */

    if(index < 0){

        index =
            banners.length - 1;

    }


    currentBanner =
        index;


    const banner =
        banners[
            currentBanner
        ];


    if(
        !banner ||
        !banner.imageUrl
    ){

        return;

    }


    bannerImage.classList.add(
        "hidden"
    );


    bannerEmpty.style.display =
        "flex";


    bannerImage.onload =
        function(){

            bannerImage.classList.remove(
                "hidden"
            );


            bannerEmpty.style.display =
                "none";

        };


    bannerImage.onerror =
        function(){

            bannerImage.classList.add(
                "hidden"
            );


            bannerEmpty.style.display =
                "flex";

        };


    bannerImage.src =
        banner.imageUrl;


    updateDots();

}


/* =====================================================
   NEXT BANNER
===================================================== */

function nextBanner(){

    if(
        banners.length <= 1
    ){

        return;

    }


    showBanner(
        currentBanner + 1
    );

}


/* =====================================================
   PREVIOUS BANNER
===================================================== */

function previousBanner(){

    if(
        banners.length <= 1
    ){

        return;

    }


    showBanner(
        currentBanner - 1
    );

}


/* =====================================================
   BANNER BUTTON EVENTS
===================================================== */

if(prevButton){

    prevButton.addEventListener(
        "click",
        function(event){

            event.stopPropagation();

            previousBanner();

        }
    );

}


if(nextButton){

    nextButton.addEventListener(
        "click",
        function(event){

            event.stopPropagation();

            nextBanner();

        }
    );

}


/* =====================================================
   FULL SCREEN VIEWER CONTROLS
===================================================== */

if(bannerViewerClose){

    bannerViewerClose.addEventListener(
        "click",
        function(){

            bannerViewer.classList.remove(
                "active"
            );

        }
    );

}


if(bannerViewerPrev){

    bannerViewerPrev.addEventListener(
        "click",
        function(event){

            event.stopPropagation();


            if(
                banners.length <= 1
            ){

                return;

            }


            previousBanner();


            if(
                banners[currentBanner]
            ){

                bannerViewerImage.src =
                    banners[
                        currentBanner
                    ].imageUrl;

            }

        }
    );

}


if(bannerViewerNext){

    bannerViewerNext.addEventListener(
        "click",
        function(event){

            event.stopPropagation();


            if(
                banners.length <= 1
            ){

                return;

            }


            nextBanner();


            if(
                banners[currentBanner]
            ){

                bannerViewerImage.src =
                    banners[
                        currentBanner
                    ].imageUrl;

            }

        }
    );

}


/* =====================================================
   CLOSE VIEWER BY BACKDROP
===================================================== */

if(bannerViewer){

    bannerViewer.addEventListener(
        "click",
        function(event){

            if(
                event.target ===
                bannerViewer
            ){

                bannerViewer.classList.remove(
                    "active"
                );

            }

        }
    );

}


/* =====================================================
   ESCAPE KEY
===================================================== */

document.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Escape" &&
            bannerViewer &&
            bannerViewer.classList.contains(
                "active"
            )
        ){

            bannerViewer.classList.remove(
                "active"
            );

        }

    }
);


/* =====================================================
   AUTO BANNER SLIDER
===================================================== */

setInterval(
    function(){

        if(
            banners.length > 1 &&
            bannerViewer &&
            !bannerViewer.classList.contains(
                "active"
            )
        ){

            showBanner(
                currentBanner + 1
            );

        }

    },
    5000
);
