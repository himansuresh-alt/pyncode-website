    transition:
        transform .2s ease,
        box-shadow .2s ease,
        border-color .2s ease;

}

    transform:

    border-color:#ffc4b4;

    box-shadow:

}

===================================================== */

    background:#eef1f5;

.shop-image{

    width:100%;

    height:100%;

    display:block;

    object-fit:cover;

    transition:
        transform .35s ease;

}


.shop-card:hover .shop-image{

    transform:
        scale(1.035);

}

   VERIFIED BADGE
===================================================== */

    position:absolute;

/* =====================================================
   LOAD SHOPS FROM SUPABASE
===================================================== */

async function loadShopsFromSupabase(){

    shopGrid.innerHTML = `
        <div class="shop-empty">

            <div class="shop-empty-icon">
                ⏳
            </div>

            <div class="shop-empty-title">
                Loading shops...
            </div>

            <div class="shop-empty-text">
                Finding registered shops near you.
            </div>

        </div>
    `;

    try{

  const { data, error } =
    await supabaseClient
        .from("shops")
        .select("*")
        .order(
            "created_at",
            {
                ascending:false
            }
        );
      
        if(error){

            console.error(
                "Supabase shop loading error:",
                error
            );

            shopGrid.innerHTML = `
                <div class="shop-empty">

                    <div class="shop-empty-icon">
                        ⚠️
                    </div>

                    <div class="shop-empty-title">
                        Unable to load shops
                    </div>

                    <div class="shop-empty-text">
                        Please try again later.
                    </div>

                </div>
            `;

            return;

        }


        shops =
            (data || []).map(
                function(row){

                    return {

                        id:
                            row.id || "",

                        name:
                            row.shop_name ||
                            row.name ||
                            "Shop",

                        category:
                            row.category ||
                            "",

                        location:
                            [
                                row.area,
                                row.city
                            ]
                            .filter(Boolean)
                            .join(", ") ||
                            row.address ||
                            "Location not available",

                        pincode:
                            String(
                                row.pincode ||
                                row.shop_pincode ||
                                ""
                            ).trim(),

                        image:
                            row.shop_image ||
                            row.image ||
                            "",

                        phone:
                            row.mobile ||
                            row.phone ||
                            row.registered_mobile ||
                            "",

                        whatsapp:
                            row.whatsapp ||
                            row.mobile ||
                            row.phone ||
                            "",

                        rating:
                            row.rating ||
                            "New"

                    };

                }
            );


        renderShops();

    }
    catch(error){

        console.error(
            "Unexpected Supabase error:",
            error
        );

        shopGrid.innerHTML = `
            <div class="shop-empty">

                <div class="shop-empty-icon">
                    ⚠️
                </div>

                <div class="shop-empty-title">
                    Something went wrong
                </div>

                <div class="shop-empty-text">
                    Please refresh the page and try again.
                </div>

            </div>
        `;

    }

}


/* =====================================================
   CATEGORY FILTER
===================================================== */

function loadCategoryFilter(){

    categoryFilter.innerHTML =
        categories
        .map(
            function(category){

                const active =
                    category.name ===
                    selectedCategory
                    ? "active"
                    : "";

                return `

                    <button
                        type="button"
                        class="category-chip ${active}"
                        data-category="${category.name}"
                    >

                        <span>
                            ${category.icon}
                        </span>

                        <span>
                            ${category.name}
                        </span>

                    </button>

                `;

            }
        )
        .join("");


    document
        .querySelectorAll(
            ".category-chip"
        )
        .forEach(
            function(button){

                button.addEventListener(
                    "click",
                    function(){

                        selectedCategory =
                            this.dataset.category;

                        selectedPincode =
                            "";

                        pincodeInput.value =
                            "";

                        updateHero();

                        renderShops();

                        loadCategoryFilter();

                    }
                );

            }
        );

}


/* =====================================================
   UPDATE HERO
===================================================== */

function updateHero(){

    const category =
        categories.find(
            function(item){

                return item.name ===
                    selectedCategory;

            }
        );


    if(!category){

        return;

    }


    heroTitle.textContent =
        category.name;

    heroDescription.textContent =
        category.description;


    const heroBrands =
        document.getElementById(
            "heroBrands"
        );


    if(!heroBrands){

        return;

    }


    if(
        category.brands &&
        category.brands.length
    ){

        heroBrands.innerHTML =
            category.brands
            .map(
                function(brand){

                    const name =
                        Array.isArray(brand)
                        ? brand[0]
                        : brand;

                    const domain =
                        Array.isArray(brand)
                        ? brand[1]
                        : "";


                    if(domain){

                        const logo =
                            "https://www.google.com/s2/favicons?domain=" +
                            domain +
                            "&sz=128";

                        return `

                            <div
                                class="hero-brand"
                                title="${name}"
                            >

                                <img
                                    src="${logo}"
                                    alt="${name}"
                                    loading="lazy"
                                    onerror="
                                        this.style.display='none';
                                        this.parentElement.innerHTML=
                                        '<span class=&quot;hero-brand-name&quot;>${name}</span>';
                                    "
                                >

                                <span
                                    class="hero-brand-name"
                                >
                                    ${name}
                                </span>

                            </div>

                        `;

                    }


                    return `

                        <div
                            class="hero-brand"
                            title="${name}"
                        >

                            <span
                                class="hero-brand-name"
                            >
                                ${name}
                            </span>

                        </div>

                    `;

                }
            )
            .join("");

    }
    else{

        heroBrands.innerHTML =
            "";

    }

}


/* =====================================================
   RENDER SHOP CARDS
===================================================== */

function renderShops(){

    let filteredShops =
        shops.slice();


    /* CATEGORY FILTER */

    if(
        selectedCategory !== "All"
    ){

        filteredShops =
            filteredShops.filter(
                function(shop){

                    return shop.category ===
                        selectedCategory;

                }
            );

    }


    /* PINCODE FILTER */

    if(selectedPincode){

        filteredShops =
            filteredShops.filter(
                function(shop){

                    return shop.pincode ===
                        selectedPincode;

                }
            );

    }


    /* LIST TITLE */

    shopListTitle.textContent =
        selectedCategory === "All"
        ? "All Shops"
        : selectedCategory;


    /* LOCATION */

    if(selectedPincode){

        shopLocation.textContent =
            "📍 " +
            selectedPincode;

    }
    else{

        shopLocation.textContent =
            "";

    }


    /* SHOP COUNT */

    shopListCount.textContent =
        filteredShops.length +
        " shop" +
        (
            filteredShops.length === 1
            ? ""
            : "s"
        ) +
        " available";


    /* EMPTY STATE */

    if(
        filteredShops.length === 0
    ){

        shopGrid.innerHTML = `

            <div class="shop-empty">

                <div class="shop-empty-icon">
                    🔍
                </div>

                <div class="shop-empty-title">
                    No shops found
                </div>

                <div class="shop-empty-text">
                    Try another category or pincode.
                </div>

            </div>

        `;

        return;

    }


    /* SHOP CARDS */

    shopGrid.innerHTML =
        filteredShops
        .map(
            function(shop){

                const message =
                    "Hi " +
                    shop.name +
                    ", I found your business on Pyncode.in.";


                return `

                    <article class="shop-card">

                        <div class="shop-image-wrap">

                            <img
                                class="shop-image"
                                src="${shop.image || 'icon-192.png'}"
                                alt="${shop.name}"
                                loading="lazy"
                            >

                            <div class="verified-badge">
                                ✓ Verified
                            </div>

                        </div>


                        <div class="shop-card-body">

                            <div class="shop-name-row">

                                <div class="shop-name">
                                    ${shop.name}
                                </div>

                                <div class="shop-arrow">
                                    →
                                </div>

                            </div>


                            <div class="shop-category">
                                ${shop.category}
                            </div>


                            <div class="shop-location">

                                <span>
                                    📍
                                </span>

                                <span>
                                    ${shop.location}
                                </span>

                            </div>


                            <div class="shop-rating">

                                <span class="rating-star">
                                    ★
                                </span>

                                <span>
                                    ${shop.rating}
                                </span>

                                <span>
                                    Trusted Business
                                </span>

                            </div>


                            <div class="shop-actions">

                                <a
                                    href="tel:+91${String(shop.phone || "").replace(/\D/g, "")}"
                                    class="shop-action call-action"
                                    onclick="event.stopPropagation();"
                                >
                                    📞 Call
                                </a>


                                <a
                                    href="https://wa.me/91${String(shop.whatsapp || shop.phone || "").replace(/\D/g, "")}?text=${encodeURIComponent(message)}"
                                    target="_blank"
                                    rel="noopener noreferrer"
                                    class="shop-action whatsapp-action"
                                    onclick="event.stopPropagation();"
                                >
                                    💬 WhatsApp
                                </a>


                                <a
                                    href="category-shop-current-offer.html?shop_id=${encodeURIComponent(shop.id)}"
                                    class="shop-action offers-action"
                                    onclick="event.stopPropagation();"
                                >
                                    🔥 View Offers
                                </a>

                            </div>

                        </div>

                    </article>

                `;

            }
        )
        .join("");

}


/* =====================================================
   PINCODE SEARCH
===================================================== */

function searchByPincode(){

    const value =
        pincodeInput.value
        .replace(
            /[^0-9]/g,
            ""
        )
        .slice(
            0,
            6
        );


    pincodeInput.value =
        value;


    if(
        value.length !== 6
    ){

        selectedPincode =
            "";

        renderShops();

        return;

    }


    selectedPincode =
        value;


    renderShops();

}


/* =====================================================
   SEARCH BUTTON
===================================================== */

if(searchButton){

    searchButton.addEventListener(
        "click",
        searchByPincode
    );

}


if(pincodeInput){

    pincodeInput.addEventListener(
        "keydown",
        function(event){

            if(
                event.key === "Enter"
            ){

                searchByPincode();

            }

        }
    );

}

/* =====================================================

===================================================== */

function loadCategoryFromURL(){

    const params =
        new URLSearchParams(
            window.location.search
        );


    const categoryFromURL =
        params.get("category");


    if(!categoryFromURL){

        selectedCategory =
            "All";

        return;

    }


    const exists =
        categories.some(
            function(category){

                return category.name ===
                    categoryFromURL;

            }
        );


    if(exists){

        selectedCategory =
            categoryFromURL;

    }
    else{

        selectedCategory =
            "All";

    }

}
