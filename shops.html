<style>
:root{--ink:#0e1322;--bg:#f2f4f9;--line:#e3e7ef;--mut:#6a7388;--b1:#ff7a1a;--b2:#ff3d6e;--ok:#12a150;--wa:#1faa59}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;padding-bottom:104px}
button,input{font:inherit}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--b2);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
.ic{width:16px;height:16px;flex-shrink:0}

/* HEADER */
.header{position:sticky;top:0;z-index:30;height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:rgba(255,255,255,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:8px;font-size:20px;font-weight:800;letter-spacing:-.5px;cursor:pointer}
.logo-mark{width:56px;height:38px;border-radius:11px;overflow:hidden;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--b1),var(--b2))}
.logo-mark img{width:100%;height:140%;object-fit:contain}
.pyn{color:#ef603e}
.head-actions{display:flex;gap:6px}
.btn-dark,.btn-wa{height:40px;padding:0 13px;border:0;border-radius:11px;display:inline-flex;align-items:center;font-size:12px;font-weight:800;color:#fff;white-space:nowrap;cursor:pointer}
.btn-dark{background:var(--ink)}
.btn-wa{background:var(--wa)}

/* HERO */
.hero{background:radial-gradient(900px 300px at 85% -10%,rgba(255,61,110,.38),transparent 60%),radial-gradient(700px 300px at 0 110%,rgba(255,122,26,.28),transparent 60%),var(--ink);color:#fff;padding:32px 0 24px;border-radius:0 0 28px 28px}
.hero h1{font-size:clamp(26px,5.5vw,40px);font-weight:800;letter-spacing:-1px;line-height:1.1;max-width:560px}
.hero p{margin-top:8px;color:#aab2c8;font-size:14px}
.search-box{margin-top:20px;display:flex;gap:8px;padding:6px;background:#fff;border-radius:16px;box-shadow:0 14px 34px rgba(0,0,0,.28)}
.search-box .ic{width:20px;height:20px;align-self:center;margin-left:10px;color:var(--b2)}
.pincode-input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--ink);font-size:15px;font-weight:600}
.pincode-input::placeholder{color:#9aa2b4;font-weight:500}
.search-btn{height:44px;padding:0 20px;border:0;border-radius:11px;background:linear-gradient(135deg,var(--b1),var(--b2));color:#fff;font-weight:800;font-size:13px;cursor:pointer}
.loc-card{margin-top:12px;padding:12px 12px 12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.16);border-radius:16px}
.loc-title{font-size:14px;font-weight:800}
.loc-status{margin-top:3px;font-size:12px;color:#aab2c8;line-height:1.45}
.loc-status[data-type=error]{color:#ffb4c4}
.loc-btn{flex-shrink:0;height:42px;padding:0 15px;display:inline-flex;align-items:center;gap:7px;border:0;border-radius:12px;background:#fff;color:var(--ink);font-size:12px;font-weight:800;cursor:pointer}
.loc-btn.active{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.3)}
.loc-btn:disabled{opacity:.6;cursor:wait}
.radius{margin-top:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.radius[hidden]{display:none}
.radius-label{font-size:12px;font-weight:700;color:#aab2c8}
.radius-button{height:34px;padding:0 14px;border:1px solid rgba(255,255,255,.22);border-radius:999px;background:transparent;color:#fff;font-size:12px;font-weight:800;cursor:pointer}
.radius-button.active{background:#fff;color:var(--ink);border-color:#fff}

/* CATEGORIES */
.sec-head{display:flex;align-items:center;justify-content:space-between;margin:24px 0 10px}
.sec-title{font-size:15px;font-weight:800}
.view-all{height:34px;padding:0 13px;display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:12px;font-weight:800}
.category-filter{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 8px;margin:0 -16px;scrollbar-width:none}
.category-filter::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;height:38px;padding:0 15px;border:1px solid var(--line);border-radius:999px;background:#fff;color:#4c556b;font-size:12px;font-weight:700;white-space:nowrap;cursor:pointer}
.chip.active{background:var(--ink);border-color:var(--ink);color:#fff}

/* SHOPS */
.list-head{margin:22px 0 14px}
.shop-list-title{font-size:24px;font-weight:800;letter-spacing:-.5px}
.shop-list-count{margin-top:3px;font-size:13px;font-weight:600;color:var(--mut)}
.shop-grid{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:700px){.shop-grid{grid-template-columns:repeat(2,1fr)}.hero{padding:48px 0 34px}}
@media(min-width:1000px){.shop-grid{grid-template-columns:repeat(3,1fr)}}
.shop-card{overflow:hidden;background:#fff;border:1px solid var(--line);border-radius:20px;display:flex;flex-direction:column;box-shadow:0 1px 2px rgba(14,19,34,.04),0 10px 28px rgba(14,19,34,.06)}
.shop-image-wrap{position:relative;height:178px;background:#e9edf4}
.shop-image-wrap::after{content:"";position:absolute;inset:auto 0 0;height:60%;background:linear-gradient(transparent,rgba(14,19,34,.5))}
.shop-image{width:100%;height:100%;object-fit:cover;display:block}
.badge{position:absolute;z-index:1;display:inline-flex;align-items:center;gap:5px;padding:6px 10px;border-radius:999px;font-size:11px;font-weight:800}
.verified{top:12px;left:12px;background:rgba(255,255,255,.95);color:var(--ok)}
.distance{left:12px;bottom:12px;background:rgba(14,19,34,.78);color:#fff}
.shop-body{padding:15px;display:flex;flex-direction:column;flex:1}
.shop-name{font-size:17px;font-weight:800;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shop-category{align-self:flex-start;margin-top:7px;padding:4px 10px;border-radius:999px;background:#fff1ec;color:#e0502c;font-size:11px;font-weight:800}
.shop-location{display:flex;align-items:center;gap:6px;margin-top:10px;color:var(--mut);font-size:12.5px;line-height:1.4}
.shop-rating{margin-top:8px;font-size:12px;font-weight:800;color:#4c556b}
.star{color:#f4a623}
.shop-actions{margin-top:auto;padding-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.act{height:40px;display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;font-size:12px;font-weight:800;border:1px solid var(--line);background:#f5f7fb;color:var(--ink)}
.act.wa{background:var(--wa);border-color:var(--wa);color:#fff}
.act.dir{background:#fff1ec;border-color:#fad4c8;color:#e0502c}
span.act{opacity:.45}
.skeleton{height:330px;border-radius:20px;background:linear-gradient(100deg,#e9edf4 30%,#f6f8fb 50%,#e9edf4 70%);background-size:200% 100%;animation:sk 1.2s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
.shop-empty{grid-column:1/-1;padding:34px 20px;text-align:center;background:#fff;border:1px dashed #cfd5e1;border-radius:20px}
.shop-empty .ic{width:30px;height:30px;color:var(--b2)}
.shop-empty-title{margin-top:10px;font-size:16px;font-weight:800}
.shop-empty-text{margin:6px auto 0;max-width:320px;color:var(--mut);font-size:13px;line-height:1.5}
.empty-btn{margin-top:14px;height:40px;padding:0 18px;border:0;border-radius:11px;background:var(--ink);color:#fff;font-size:12px;font-weight:800;cursor:pointer}

/* BOTTOM NAV */
.bottom-nav{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);width:min(560px,calc(100% - 20px));height:66px;display:flex;gap:4px;padding:6px;background:rgba(14,19,34,.96);border-radius:22px;z-index:50;box-shadow:0 12px 32px rgba(10,20,40,.3)}
.bottom-nav-item{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:17px;color:#aab2c8;font-size:10px;font-weight:700}
.bottom-nav-item .nav-icon{font-size:19px}
.bottom-nav-item.active{background:#fff;color:var(--ink)}
@media(max-width:600px){.btn-dark{padding:0 10px}.logo{font-size:17px}.logo-mark{width:48px}.loc-card{flex-direction:column;align-items:stretch}.loc-btn{justify-content:center}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}
</style>
</head>

<header class="header">
  <div class="logo" onclick="window.location.href='index.html'" aria-label="Pyncode.in Home">

<main class="wrap">

<nav class="bottom-nav" aria-label="Main navigation">

<script>

const categories=["Home Appliances","Mobile Showrooms","EV Bike Showrooms","Bike Showrooms","Car Showrooms","Furnitures","Battery Shops","Men's Clothing","Women's Clothing","New Born Babies Shops","Toys Showrooms","Utensils & Cookware","Mattress & Bedding","Ethnic Wear Showroom","Ayurvedic & Herbals","Nutrition & Supplements","Electrics & Electronics","Hardware","Paint Shops","Cleaning Products","Pharmacy/Medicals","Fitness Equipments","Building Materials","Books & Stationary","Garden & Plants","Gift Shops","Pooja & Religious Shops","Opticals & Sunglasses","Jewellery Showrooms","Footwares","Modular Kitchen","Flooring & Tiles","Printers & Scanners","Home Theatre & Audio","Computers & Laptops","CCTV & Security","Mobile Accessories","Car Detailing Showrooms","Tyre Shops","Bike Service Shops","Car Service Shops","Home Appliances Service","Cycle Showrooms","Hospitals","Interior Designers","Doors & Windows Shops","Salon & Spa","Photography Studios","Bakery & Cake Shops","Pet Shops & Vet","Solar Panel Shops","Coaching & Tuition Centers","Hotels & Resorts","Wedding Halls / Kalyana Mandapam","Musical Instruments","Gaming Zones","Seeds & Fertilizer Shops","Insurance Offices","Loan & Finance Companies","Play Schools & Kindergarten","Freelancers","Franchise Outlets","Real Estate","Used Car & Bikes Dealers","Men's/Women's Accessories","Sandhai / Market Place","Travel & Tour Services","Wedding & Events Services","Digital Marketing Agencies","Manpower / Staffing Services","Construction & Contractors","Online Business","Courier Services","Manufacturer & Suppliers"];

const SUPABASE_URL="https://mtuspuehsxsjoaxoenen.supabase.co";
const SUPABASE_KEY="sb_publishable_JpopjwDVjFvsDjXeG_56NQ_k3nA2mU6";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const $=id=>document.getElementById(id);
const LOC_KEY="pyncode_user_location";

let allShops=[];
let selectedCategory="";
let selectedPincode="";
let userLatitude=null;
let userLongitude=null;
let userArea="";
let userPincode="";
let selectedRadiusKm=5;

/* ICONS */
const ICONS={
pin:'<path d="M12 21s7-6.2 7-11a7 7 0 10-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/>',
phone:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 005 5L15 13l5 2v4a2 2 0 01-2 2A16 16 0 013 6a2 2 0 012-2z"/>',
chat:'<path d="M21 12a8 8 0 01-11.6 7.1L4 20l1-4.6A8 8 0 1121 12z"/>',
nav:'<path d="M3 11l18-8-8 18-2-8-8-2z"/>',
gift:'<rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13M5 12v8h14v-8M12 8c-3 0-4-4-1.5-4S12 8 12 8zm0 0c3 0 4-4 1.5-4S12 8 12 8z"/>',
check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
target:'<circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>',
close:'<path d="M6 6l12 12M18 6L6 18"/>',
search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>',
alert:'<circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.01"/>'
};

function icon(name){
return '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+ICONS[name]+'</svg>';
}

/* HELPERS */
function escapeHtml(v){
return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}

function cleanPhoneNumber(v){
if(v==null)return "";
let p=String(v).replace(/\D/g,"");
if(p.startsWith("91")&&p.length===12)p=p.slice(2);
return p.length===10?p:"";
}

function hasValidCoordinates(lat,lng){
if(lat==null||lng==null||lat===""||lng==="")return false;
lat=Number(lat);lng=Number(lng);
return Number.isFinite(lat)&&Number.isFinite(lng)&&Math.abs(lat)<=90&&Math.abs(lng)<=180&&!(lat===0&&lng===0);
}

function calculateDistance(lat1,lon1,lat2,lon2){
const r=Math.PI/180;
const dLat=(lat2-lat1)*r,dLon=(lon2-lon1)*r;
const a=Math.sin(dLat/2)**2+Math.cos(lat1*r)*Math.cos(lat2*r)*Math.sin(dLon/2)**2;
return 6371*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function formatDistance(d){
if(!Number.isFinite(d))return "";
return d<1?Math.round(d*1000)+" m away":d.toFixed(1)+" km away";
}

function buildDirectionsUrl(lat,lng){
if(!hasValidCoordinates(lat,lng))return "";
return "https://www.google.com/maps/dir/?api=1&destination="+encodeURIComponent(Number(lat)+","+Number(lng));
}

/* LOCATION STATE */
function locOn(){
return hasValidCoordinates(userLatitude,userLongitude);
}

function saveLocation(){
try{localStorage.setItem(LOC_KEY,JSON.stringify({lat:userLatitude,lng:userLongitude,area:userArea,pin:userPincode,at:Date.now()}));}catch(e){}
}

function restoreSavedLocation(){
try{
const s=JSON.parse(localStorage.getItem(LOC_KEY)||"null");
if(s&&hasValidCoordinates(s.lat,s.lng)&&Date.now()-s.at<6*3600*1000){
userLatitude=Number(s.lat);
userLongitude=Number(s.lng);
userArea=s.area||"";
userPincode=s.pin||"";
if(!userArea)lookupArea();
}
}catch(e){}
}

function setLocationStatus(msg,type){
const el=$("locationStatus");
el.textContent=msg;
el.dataset.type=type||"";
}

function updateLocationUI(){
const on=locOn(),btn=$("useLocationButton");
$("locTitle").textContent=on?"Near "+(userArea||"your location"):"Showing all registered shops";
btn.className="loc-btn"+(on?" active":"");
btn.innerHTML=icon(on?"close":"target")+(on?"Show all shops":"Use my location");
$("radiusSection").hidden=!on;
if(on){
setLocationStatus(selectedPincode?"Pincode search is on, so the radius is paused.":"Shops within "+selectedRadiusKm+" km of you, nearest first.");
}else{
setLocationStatus("Turn on location to see only the shops in your area.");
}
document.querySelectorAll(".radius-button").forEach(b=>b.classList.toggle("active",Number(b.dataset.radius)===selectedRadiusKm));
}

async function lookupArea(){
try{
const r=await fetch("https://nominatim.openstreetmap.org/reverse?format=jsonv2&addressdetails=1&zoom=16&lat="+userLatitude+"&lon="+userLongitude);
const a=(await r.json()).address||{};
userArea=a.suburb||a.neighbourhood||a.city_district||a.village||a.town||a.city||"";
userPincode=String(a.postcode||"").replace(/\D/g,"").slice(0,6);
}catch(e){}
if(!locOn())return;
saveLocation();
updateLocationUI();
renderShops();
}

function requestUserLocation(){
if(!navigator.geolocation){
setLocationStatus("This browser can't detect location. Search by pincode instead.","error");
return;
}
const btn=$("useLocationButton");
btn.disabled=true;
btn.innerHTML=icon("target")+"Detecting...";
setLocationStatus("Allow location access when your browser asks.");
navigator.geolocation.getCurrentPosition(
function(p){
userLatitude=Number(p.coords.latitude);
userLongitude=Number(p.coords.longitude);
userArea="";userPincode="";
btn.disabled=false;
saveLocation();
updateLocationUI();
renderShops();
lookupArea();
},
function(e){
btn.disabled=false;
updateLocationUI();
setLocationStatus(
e.code===1?"Location is blocked. Allow it in browser settings, or search by pincode.":
e.code===3?"Location timed out. Try again.":
"Location isn't available right now. Try again.","error");
},
{enableHighAccuracy:true,timeout:15000,maximumAge:300000}
);
}

function clearLocation(){
userLatitude=null;userLongitude=null;userArea="";userPincode="";
try{localStorage.removeItem(LOC_KEY);}catch(e){}
updateLocationUI();
renderShops();
}

function toggleLocation(){
if(locOn())clearLocation();else requestUserLocation();
}

function setupRadiusFilter(){
document.querySelectorAll(".radius-button").forEach(function(b){
b.addEventListener("click",function(){
selectedRadiusKm=Number(this.dataset.radius);
updateLocationUI();
renderShops();
});
});
}
  /* CATEGORIES */
function loadCategoryFilter(){
const box=$("categoryFilter");
box.innerHTML="";
[""].concat(categories).forEach(function(c){
const b=document.createElement("button");
b.type="button";
b.className="chip";
b.dataset.category=c;
b.textContent=c||"All";
b.onclick=function(){selectedCategory=c;updateActiveCategory();renderShops();};
box.appendChild(b);
});
}

function updateActiveCategory(){
document.querySelectorAll(".chip").forEach(b=>b.classList.toggle("active",b.dataset.category===selectedCategory));
}

function loadCategoryFromURL(){
const c=new URLSearchParams(window.location.search).get("category");
if(!c)return;
const d=decodeURIComponent(c).trim();
const m=categories.find(i=>i.toLowerCase()===d.toLowerCase());
selectedCategory=m||d;
}

/* PINCODE */
function searchByPincode(){
const input=$("pincodeInput");
const v=input.value.trim();
if(v&&!/^\d{6}$/.test(v)){
alert("Please enter a valid 6 digit pincode.");
input.focus();
return;
}
selectedPincode=v;
updateLocationUI();
renderShops();
}

function resetFilters(){
selectedCategory="";
selectedPincode="";
$("pincodeInput").value="";
updateActiveCategory();
updateLocationUI();
renderShops();
}

function openInterestedWhatsApp(){
const msg="Hi Pyncode.in, I am interested in listing my business on Pyncode.";
window.open("https://wa.me/?text="+encodeURIComponent(msg),"_blank","noopener");
}

/* SHOP CARD */
function buildShopCard(s){
const name=escapeHtml(s.name||"Unnamed Business");
const cat=escapeHtml(s.category||"Business");
const place=escapeHtml(s.location||s.address||"Location available");
const img=escapeHtml(s.image||"/icon-512.png");
const phone=cleanPhoneNumber(s.phone);
const wa=cleanPhoneNumber(s.whatsapp||s.phone);
const dist=formatDistance(s.distance);
const dir=buildDirectionsUrl(s.latitude,s.longitude);

const callBtn=phone?'<a href="tel:+91'+phone+'" class="act">'+icon("phone")+'Call</a>':'<span class="act">'+icon("phone")+'Call</span>';
const waBtn=wa?'<a href="https://wa.me/91'+wa+'" target="_blank" rel="noopener" class="act wa">'+icon("chat")+'WhatsApp</a>':'<span class="act wa">'+icon("chat")+'WhatsApp</span>';
const dirBtn=dir?'<a href="'+dir+'" target="_blank" rel="noopener" class="act dir">'+icon("nav")+'Directions</a>':"";
const offBtn=s.id?'<a href="category-shop-current-offer.html?shop_id='+encodeURIComponent(s.id)+'" class="act">'+icon("gift")+'Offers</a>':"";

return '<article class="shop-card">'+
'<div class="shop-image-wrap">'+
'<img class="shop-image" src="'+img+'" alt="'+name+'" loading="lazy" onerror="this.onerror=null;this.src=\'/icon-512.png\'">'+
'<span class="badge verified">'+icon("check")+'Verified</span>'+
(dist?'<span class="badge distance">'+icon("pin")+escapeHtml(dist)+'</span>':"")+
'</div>'+
'<div class="shop-body">'+
'<div class="shop-name" title="'+name+'">'+name+'</div>'+
'<div class="shop-category">'+cat+'</div>'+
'<div class="shop-location">'+icon("pin")+'<span>'+place+'</span></div>'+
(s.rating?'<div class="shop-rating"><span class="star">★</span> '+escapeHtml(String(s.rating))+'</div>':"")+
'<div class="shop-actions">'+callBtn+waBtn+dirBtn+offBtn+'</div>'+
'</div></article>';
}

function emptyHtml(ic,title,text,label,fn){
return '<div class="shop-empty">'+icon(ic)+'<div class="shop-empty-title">'+title+'</div><div class="shop-empty-text">'+text+'</div>'+
(label?'<button type="button" class="empty-btn" onclick="'+fn+'">'+label+'</button>':"")+'</div>';
}

/* RENDER */
function renderShops(){
const grid=$("shopGrid");
const active=locOn();
const radiusMode=active&&!selectedPincode;

let list=allShops.filter(function(s){
const catOk=!selectedCategory||String(s.category).toLowerCase()===selectedCategory.toLowerCase();
const pinOk=!selectedPincode||String(s.pincode).trim()===selectedPincode;
return catOk&&pinOk;
}).map(function(s){
return Object.assign({},s,{distance:active&&hasValidCoordinates(s.latitude,s.longitude)?calculateDistance(userLatitude,userLongitude,s.latitude,s.longitude):null});
});

if(radiusMode){
list=list.filter(function(s){
if(s.distance!==null)return s.distance<=selectedRadiusKm;
return userPincode&&String(s.pincode).trim()===userPincode;
});
}

if(active){
list.sort((a,b)=>(a.distance??1e9)-(b.distance??1e9));
}

$("shopListTitle").textContent=selectedCategory||(active?"Shops near you":"All shops");
$("shopListCount").textContent=list.length+(list.length===1?" shop":" shops")+
(radiusMode?" within "+selectedRadiusKm+" km":"")+
(selectedPincode?" in "+selectedPincode:"");

if(!list.length){
grid.innerHTML=radiusMode
?emptyHtml("search","No shops within "+selectedRadiusKm+" km","No registered shops in this area yet. Try a bigger radius or view every shop.","Show all shops","clearLocation()")
:emptyHtml("search","No shops found","Nothing matches these filters.","Clear filters","resetFilters()");
return;
}

grid.innerHTML=list.map(buildShopCard).join("");
}

/* LOAD FROM SUPABASE */
async function loadShopsFromSupabase(){
const grid=$("shopGrid");
try{
const result=await supabaseClient.from("shops").select("*").eq("listing_type","shop").order("created_at",{ascending:false});
if(result.error)throw result.error;

allShops=(result.data||[]).filter(s=>s.listing_type==="shop").map(function(s){
const ok=hasValidCoordinates(s.latitude,s.longitude);
return{
id:s.id,
name:s.shop_name||"Unnamed Business",
category:s.category||"Business",
location:[s.area,s.city].filter(Boolean).join(", "),
pincode:s.pincode||"",
address:s.address||"",
image:s.shop_image||"",
phone:s.mobile||s.owner_mobile||"",
whatsapp:s.whatsapp||"",
rating:s.rating||"",
latitude:ok?Number(s.latitude):null,
longitude:ok?Number(s.longitude):null
};
});

renderShops();
}catch(error){
console.error("Error loading registered shops:",error);
$("shopListCount").textContent="Could not load";
grid.innerHTML=emptyHtml("alert","Couldn't load shops","Check your connection and try again.","Try again","loadShopsFromSupabase()");
}
}

/* BOTTOM NAV */
function setupBottomNavigation(){
const current=window.location.pathname.split("/").pop().toLowerCase();
document.querySelectorAll(".bottom-nav-item").forEach(function(item){
const target=(item.getAttribute("href")||"").split("/").pop().toLowerCase();
item.classList.toggle("active",target===current);
});
}

/* INIT */
function initialize(){
loadCategoryFromURL();
loadCategoryFilter();
updateActiveCategory();

$("searchButton").onclick=searchByPincode;
const pin=$("pincodeInput");
pin.addEventListener("keydown",function(e){if(e.key==="Enter")searchByPincode();});
pin.addEventListener("input",function(e){e.target.value=e.target.value.replace(/\D/g,"").slice(0,6);});

$("useLocationButton").onclick=toggleLocation;
setupRadiusFilter();
restoreSavedLocation();
updateLocationUI();
setupBottomNavigation();
loadShopsFromSupabase();
}

document.addEventListener("DOMContentLoaded",initialize);

</script>

</body>
